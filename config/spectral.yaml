extends: ["spectral:oas"]
rules:
  operation-operationId: error
  operation-tags: off
  oas3-api-servers: warn
  info-contact: off
  info-license: off
  tag-description: off
  oas3-valid-media-example: off
  oas3-valid-schema-example: off
  # Genealogy-specific: forbid raw DNA fields in public API surface.
  # The contract rule that enforces the same invariant lives in
  # `scripts/test-contracts.mjs`; this Spectral rule complements it
  # with editor / CI integration via `spectral lint`.
  forbidden-properties:
    description: >
      Reject `dnaRaw`, `rawGenotype`, `dna`, `kit`, `rawDna` and
      `raw_dna` property keys at every schema level. DNA is owned
      by `services/dna-service`; no other surface may reference
      these fields.
    severity: error
    recommended: true
    given: "$..properties"
    then:
      field: "@key"
      function: pattern
      functionOptions:
        match: "^(?!dnaRaw$|rawGenotype$|dna$|kit$|rawDna$|raw_dna$).+$"
