# contracts/genealogy — Event, Claim và Provenance contract (E4.5).
#
# Source of truth for life-event + claim aggregates, the
# provenance axis (different from certainty) and the
# recurring-memorial hook. Mirrors `requirements.md` R4.1
# (event attaches to many persons with roles), R4.4
# (provenance + certainty + confidence), R5 (event linked to
# source / citation), R8 (research / research-log), R10
# (privacy + memorial honoring living status), and
# `design.md` §5.3 (temporal / certainty / calendar) +
# §5.5 (event / claim model) + §6.2 (ABAC obligations).
#
# The Java executor lives under
# `services/genealogy-service/src/main/java/com/genealogy/platform/
# services/genealogy/domain/` (`LifeEvent` + `Claim` records +
# `LifeEventInvariants` + `ClaimInvariants`). The Flyway
# migration that lands the persistence contract is
# `services/genealogy-service/src/main/resources/db/migration/
# V6__event_claim.sql`. The chart mirror (byte-identical) lives
# at `platform/helm/genealogy-platform/files/event-claim-policy.yaml`
# and is enforced by `scripts/lint-event-claim-config.mjs`.
#
# Imported claims MUST NOT be treated as verified by default.
# This is the single most important invariant of the contract
# (R4.4 + R8): a source can carry `provenance = IMPORTED`
# AND `certainty = HYPOTHESIS | ASSERTED`; bumping it to
# `VERIFIED` requires either `provenance = USER_ENTERED` with
# an editor review or `provenance = VERIFIED_BY_SOURCE` from a
# trusted authority.
apiVersion: v1
kind: EventClaimPolicy
metadata:
  name: default-event-claim/v1
  namespace: gp-platform
spec:
  policyId: default-event-claim/v1
  description: >-
    Life-event + claim defaults. Mirrors `requirements.md`
    R4.1 / R4.4 / R5 / R8 / R10 and `design.md` §5.3 + §5.5
    + §6.2. The platform treats event and claim as separate
    aggregates; an event may carry 0+ claims, a claim MAY
    attach to one event (or none — claims may be standalone
    research hypotheses). Provenance is a separate axis from
    certainty: a source can be `ASSERTED` but `IMPORTED`,
    and the renderer must surface that gap.
  # R4.1 / R4.4 — life-event kind closed-set. Mirrors the
  # task line "Event nhiều participant/role, recurring
  # memorial, date/place và privacy".
  lifeEventKinds:
    - BIRTH
    - BAPTISM
    - DEATH
    - BURIAL
    - CREMATION
    - MARRIAGE
    - DIVORCE
    - ENGAGEMENT
    - EDUCATION
    - OCCUPATION
    - RESIDENCE
    - IMMIGRATION
    - EMIGRATION
    - MILITARY_SERVICE
    - ILLNESS
    - RELIGIOUS_CEREMONY
    - RECURRING_MEMORIAL
    - CUSTOM
  # R4.1 — event participant role closed-set. The platform
  # uses the same role vocabulary as Relationship (E4.4)
  # so the renderer can route on a single role mapping. For
  # events we additionally need `WITNESS` (christening,
  # wedding, funeral), `OFFICIANT` (priest / celebrant /
  # registrar) and `INFORMANT` (person who told the recorder).
  eventParticipantRoles:
    - SUBJECT
    - PARENT
    - CHILD
    - SIBLING
    - PARTNER
    - GUARDIAN
    - WARD
    - WITNESS
    - OFFICIANT
    - INFORMANT
  # R4.1 / NFR4 — privacy classification closed-set.
  # `PRIVATE` matches `design.md` §6.3. `UNLISTED` mirrors
  # the Tree (E4.1) semantics: token-only access, soft noindex,
  # rate-limited. `PUBLIC` may still be redacted by R10 living
  # redaction — this contract only describes the EVENT-level
  # classification; redaction is layered by the ABAC obligations
  # (E3.4).
  privacyClassifications:
    - PRIVATE
    - UNLISTED
    - PUBLIC
  # R4.4 — certainty closed-set. Re-asserted for self-
  # containment of the contract; the enum is shared with
  # E4.2 / E4.3 / E4.4.
  certainties:
    - HYPOTHESIS
    - ASSERTED
    - VERIFIED
    - DISPUTED
  # R4.4 — provenance status closed-set (mirrors the
  # Relationship contract, E4.4). Reused so a claim can
  # carry the same provenance vocabulary without cross-
  # service coupling.
  provenanceStatuses:
    - USER_ENTERED
    - IMPORTED
    - VERIFIED_BY_SOURCE
    - CORRECTION
  # R4.4 — source-reference kind closed-set. A claim MUST
  # carry at least one source reference; the kind tells
  # the renderer how to render a citation chip.
  sourceReferenceKinds:
    - REPOSITORY_CITATION
    - DOCUMENT_CITATION
    - TRANSCRIPT_CITATION
    - PAGE_LOCATOR
    - URL
    - MEDIA_ATTACHMENT
    - INTERVIEW_NOTE
  # R4.4 / R8 — confidence numeric range. The renderer MUST
  # treat `confidence = null` as "the editor chose to skip a
  # number" rather than as 0. The band is inclusive 0.0..1.0;
  # the contract normalises all incoming values into this
  # range and rejects values outside it.
  confidenceRange:
    min: 0.0
    max: 1.0
  # R4.4 — cap on number of participants per life-event.
  # Mirrors the Relationship cap (E4.4) so the renderer can
  # rely on a single upper bound for batch rendering.
  maxParticipantsPerEvent: 16
  # R4.4 — cap on number of source references per claim.
  # The platform supports chains of citations but rejects
  # unbounded blobs (a single claim with > 32 sources is
  # almost always a research-log mistake, not real evidence).
  maxSourceReferencesPerClaim: 32
  # R4.4 — cap on the free-form description of an event.
  # Mirrors the date-place policy cap and prevents DoS on
  # the search projection.
  maxDescriptionChars: 2048
  # R4.4 — cap on the `customLabel` of a CUSTOM-kind event.
  # Mirrors Relationship.
  maxCustomLabelChars: 256
  # R4.4 / NFR4 — recurring memorial hook. A life-event with
  # `kind = RECURRING_MEMORIAL` MUST have an anniversary date
  # (E4.3) so the renderer can schedule a recurring notice.
  # The hook is opt-in at the contract level; the renderer
  # is responsible for the actual scheduling (E5).
  recurringMemorialRequired:
    - RECURRING_MEMORIAL
  # R10 — living-link redaction for life-events. The
  # default visibility MUST be downgraded to PRIVATE until a
  # privacy officer overrides it when at least one
  # participant is a living person.
  livingLinkRedactsByDefault: true
  # R4.4 / NFR4 — audit hooks. Each life-event / claim
  # mutation emits an audit event with a closed-set action.
  # Audit class = `consent` because event / claim changes
  # shift the privacy surface (R10 / living-link redaction).
  auditClassOnEventCreate: consent
  auditActionOnEventCreate: event.created
  auditClassOnEventUpdate: consent
  auditActionOnEventUpdate: event.updated
  auditClassOnEventDelete: consent
  auditActionOnEventDelete: event.deleted
  auditClassOnClaimCreate: consent
  auditActionOnClaimCreate: claim.created
  auditClassOnClaimUpdate: consent
  auditActionOnClaimUpdate: claim.updated
  auditClassOnClaimVerify: consent
  auditActionOnClaimVerify: claim.verified
  auditClassOnClaimDispute: consent
  auditActionOnClaimDispute: claim.disputed
  # R4.4 — provenance policy. Imported claims MUST NOT
  # default to `certainty = VERIFIED`. The contract names the
  # allowed combinations so the renderer can surface them
  # without re-implementing the policy.
  provenancePolicy:
    description: "`IMPORTED` provenance NEVER combines with `VERIFIED` certainty unless an editor issues a `claim.verify` transition that ALSO updates the provenance to `VERIFIED_BY_SOURCE` or `USER_ENTERED`. The platform surfaces the gap in the UI; the invariant service emits a `DENY` finding for any combination of `IMPORTED + VERIFIED` at write time."
    allowedCombinations:
      - provenance: USER_ENTERED
        certainties: [HYPOTHESIS, ASSERTED, VERIFIED, DISPUTED]
      - provenance: IMPORTED
        certainties: [HYPOTHESIS, ASSERTED, DISPUTED]
      - provenance: VERIFIED_BY_SOURCE
        certainties: [ASSERTED, VERIFIED]
      - provenance: CORRECTION
        certainties: [ASSERTED, VERIFIED]
  # R4.4 / R5 — claim lifecycle. A claim MUST start as
  # `HYPOTHESIS | ASSERTED | IMPORTED`; promotion to
  # `VERIFIED` requires a non-empty source-reference list
  # AND a reviewer trail. The contract exposes the lifecycle
  # as a closed-set so the renderer can show a status chip
  # without guessing.
  claimLifecycle:
    - HYPOTHESIS
    - ASSERTED
    - VERIFIED
    - DISPUTED
  # R4.4 / R8 — source-reference minimum. A claim MUST
  # carry at least one source reference. `CORRECTION`
  # claims MUST additionally carry a `correctsClaimId`
  # back-reference so the merge service (E4.6) can wire
  # the chain.
  claimRequiresSourceReference: true
  correctionRequiresBackReference: true
