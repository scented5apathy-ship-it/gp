/*
 * Gradle daemon + JVM settings.
 *
 * `org.gradle.java.installations.auto-detect=false` keeps Gradle from
 * scanning the host for other JDK installs (which can pick up a JDK
 * 25 dev preview that breaks the embedded Kotlin DSL bootstrap). CI
 * agents pin a single JDK 21 via `JAVA_HOME` per ADR-E0.5-01, so
 * auto-detection is unnecessary.
 *
 * `org.gradle.toolchains.foojay-resolver-convention.disabled=true`
 * disables the Foojay Toolchain resolver (which would attempt a
 * network download of an unrelated JDK).
 */
org.gradle.java.installations.auto-detect=false
org.gradle.toolchains.foojay-resolver-convention.disabled=true

# Build cache: drop intermediate outputs on a fresh checkout.
org.gradle.caching=true
org.gradle.parallel=true

# Reproducible jar metadata per ADR-E0.5-01 §Consequences.
org.gradle.warning.mode=summary