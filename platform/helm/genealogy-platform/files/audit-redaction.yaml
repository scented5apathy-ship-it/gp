# Audit redaction list (E3.6).
#
# Source of truth for the audit-event metadata redactor used by
# both the publisher side (`libs/platform-spring-boot-starter/`)
# and the consumer side (`audit-service`). The lists split into:
#   - `denyKeys`: keys whose value is dropped entirely before the
#     event leaves the originating service;
#   - `maskKeys`: keys whose value is replaced by `[REDACTED:<key>]`
#     before persistence;
#   - `scrubPatterns`: regex patterns applied to free-text metadata
#     values regardless of key (email / JWT / DNA / key material).
#
# Per `privacy-and-legal-gate.md` §11 + `ownership-catalog.md` §2.11
# the lists mirror the forbidden payload classes; expanding the
# lists requires DPO sign-off. CI fails on any reduction.
apiVersion: v1
kind: AuditRedactionList
metadata:
  name: default-audit-redaction-list
  namespace: gp-platform
spec:
  denyKeys:
    - rawDna
    - raw_dna
    - dnaRaw
    - genotype
    - sequence
    - kitPayload
    - rawBytes
    - biography
    - freeText
    - notes
    - password
    - accessToken
    - refreshToken
    - apiKey
    - clientSecret
    - cookie
    - setCookie
  maskKeys:
    - email
    - phone
    - address
    - currentResidence
    - school
    - guardians
    - name
    - firstName
    - lastName
    - birthDate
    - deathDate
    - ipAddress
    - userAgent
    - deviceFingerprint
  scrubPatterns:
    - name: email
      regex: '[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'
      replacement: "[REDACTED:email]"
    - name: ipv4
      regex: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
      replacement: "[REDACTED:ipv4]"
    - name: ipv6
      regex: '\b(?:[0-9a-fA-F]{1,4}:){2,7}[0-9a-fA-F]{1,4}\b'
      replacement: "[REDACTED:ipv6]"
    - name: jwt
      regex: '(?i)eyJ[A-Za-z0-9._\-]+'
      replacement: "[REDACTED:jwt]"
    - name: bearer
      regex: '(?i)bearer\s+[A-Za-z0-9._\-]+'
      replacement: "[REDACTED:bearer]"
    - name: ssn
      regex: '\b\d{3}-\d{2}-\d{4}\b'
      replacement: "[REDACTED:ssn]"
    - name: dnaSequence
      regex: '\b(?:[ACGT]{16,})\b'
      replacement: "[REDACTED:dnaSequence]"
  maxMetadataSizeBytes: 4096
  overflowBehavior: TRUNCATE_WITH_MARKER
