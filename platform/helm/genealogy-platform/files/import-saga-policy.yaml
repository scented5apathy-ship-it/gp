# contracts/importexport/import-saga-policy.yaml
#
# E9.3 — Import mapping / dedup / saga contract.
#
# Single source of truth for the importexport-service import saga:
# preview → user confirmation → chunked commit with checkpoint /
# compensation. Domain service remains the source of truth; the saga
# is the orchestrator that drives the user-facing state machine.
# DNA bucket shield and outbox event emission are enforced.
#
# Conventions mirror the E9.1 / E9.2 contracts.

policyVersion: "1.0.0"
owner: importexport
domain: genealogy.platform.importexport.import.v1
contract: "E9.3 Import mapping + dedup + saga"
doc: |
  Import saga contract. Defines the closed-set mapping / dedup
  outcomes, chunk commit phases, checkpoint + compensation
  flow, duplicate candidate strategies, and sandbox egress.
  Compatibility policy = BACKWARD per ADR-E0.5-08.

# ---------------------------------------------------------------------------
# 1. Closed-set vocabularies
# ---------------------------------------------------------------------------

importSagaPhases:
  doc: "Closed-set phases the import saga traverses."
  values:
    - PREVIEWING
    - MAPPING
    - DEDUPING
    - CONFIRMING
    - CHUNKING
    - COMMITTING
    - RECONCILING
    - COMPENSATING
    - CANCELLED
    - FINALIZED

importSagaStatuses:
  doc: "Closed-set statuses emitted by the import saga."
  values:
    - QUEUED
    - PREVIEWING
    - PREVIEW_READY
    - AWAITING_CONFIRMATION
    - CHUNKING
    - CHUNK_COMMITTING
    - RECONCILING
    - COMPLETED
    - CANCELLED
    - COMPENSATING
    - COMPENSATED
    - FAILED
    - BLOCKED

importMappingStrategies:
  doc: "Closed-set strategies used to map external → internal."
  values:
    - EXACT_KEY_MATCH
    - FUZZY_NAME_MATCH
    - PLACE_NORMALIZED_MATCH
    - DATE_NORMALIZED_MATCH
    - CITATION_PROVENANCE_MATCH
    - MANUAL_OVERRIDE

importDedupOutcomes:
  doc: "Closed-set outcomes emitted per record candidate."
  values:
    - NEW
    - DUPLICATE_AUTO_MERGE
    - DUPLICATE_CANDIDATE
    - DUPLICATE_USER_MERGED
    - DUPLICATE_REJECTED
    - DRY_RUN_REPORT_ONLY

importChunkCommitStrategies:
  doc: "Closed-set strategies for chunk commit."
  values:
    - SEQUENTIAL
    - PARALLEL_BOUNDED
    - RATE_LIMITED
    - TENANT_SCOPED

importReconciliationTargets:
  doc: "Closed-set services / projections the import must reconcile."
  values:
    - SEARCH_PROJECTION
    - COLLABORATION_TIMELINE
    - MEDIA_INDEX
    - TREE_RENDERER_CACHE
    - PUBLIC_PROJECTION

importSagaFailureReasons:
  doc: "Closed-set failure reasons emitted by the import saga."
  values:
    - IMPORT_PREVIEW_NOT_FOUND
    - IMPORT_PREVIEW_EXPIRED
    - IMPORT_DEDUP_CANDIDATES_TOO_MANY
    - IMPORT_DEDUP_STRATEGY_UNKNOWN
    - IMPORT_CHUNK_TOO_LARGE
    - IMPORT_CHUNK_COMMIT_TIMEOUT
    - IMPORT_CHUNK_COMMIT_FAILED
    - IMPORT_COMPENSATION_FAILED
    - IMPORT_DUPLICATE_RUN_REJECTED
    - IMPORT_RECONCILIATION_FAILED
    - IMPORT_DNA_BUCKET_FORBIDDEN
    - IMPORT_PII_LEAK_DETECTED
    - IMPORT_TENANT_MISMATCH
    - IMPORT_USER_PROVIDED_PAYLOAD_TOO_LARGE

importSagaAuditEvents:
  doc: "Closed-set audit hooks the import saga emits."
  values:
    - IMPORT_PREVIEW_QUEUED
    - IMPORT_PREVIEW_READY
    - IMPORT_DEDUP_CANDIDATES_READY
    - IMPORT_CONFIRMATION_RECEIVED
    - IMPORT_CHUNK_STARTED
    - IMPORT_CHUNK_COMMITTED
    - IMPORT_CHUNK_COMPENSATED
    - IMPORT_RECONCILIATION_STARTED
    - IMPORT_RECONCILIATION_FINISHED
    - IMPORT_DNA_BUCKET_REFUSED
    - IMPORT_PII_LEAK_REFUSED
    - IMPORT_FINALIZED
    - IMPORT_FAILED

importSagaConfirmationModes:
  doc: "Closed-set confirmation modes the saga accepts."
  values:
    - USER_ACCEPT_ALL
    - USER_ACCEPT_PER_CANDIDATE
    - USER_ACCEPT_PER_RECORD
    - ADMIN_FORCE_COMMIT
    - DRY_RUN_ONLY

importSagaCompensationActions:
  doc: "Closed-set compensation actions the saga invokes."
  values:
    - DELETE_IMPORTED_CHUNK
    - UNDO_DEDUP_MERGE
    - REVERT_PROJECTION_RECONCILIATION
    - REVOKE_TEMP_CREDENTIAL
    - RESTORE_PREVIEW_EXPIRY

# ---------------------------------------------------------------------------
# 2. Sandbox egress allowlist
# ---------------------------------------------------------------------------

sandboxEgressAllowlist:
  doc: "Network egress allowlist for the import saga sandbox."
  values:
    - postgres
    - apicurio
    - vault-agent
    - openfga
    - audit-service
    - kafka-broker
    - temporal-frontend

# ---------------------------------------------------------------------------
# 3. State machine
# ---------------------------------------------------------------------------

importSagaStateMatrix:
  doc: "Import saga state machine — every status reachable from QUEUED."
  initialStatus: QUEUED
  statuses:
    - status: QUEUED
      transitions: [PREVIEWING, CANCELLED, FAILED, BLOCKED]
    - status: PREVIEWING
      transitions: [PREVIEW_READY, FAILED]
    - status: PREVIEW_READY
      transitions: [AWAITING_CONFIRMATION, CANCELLED, FAILED]
    - status: AWAITING_CONFIRMATION
      transitions: [CHUNKING, CANCELLED, COMPENSATING, FAILED]
    - status: CHUNKING
      transitions: [CHUNK_COMMITTING, FAILED]
    - status: CHUNK_COMMITTING
      transitions: [RECONCILING, COMPENSATING, FAILED]
    - status: RECONCILING
      transitions: [COMPLETED, FAILED]
    - status: COMPLETED
      transitions: []
      terminal: true
    - status: CANCELLED
      transitions: []
      terminal: true
    - status: COMPENSATING
      transitions: [COMPENSATED, FAILED]
    - status: COMPENSATED
      transitions: []
      terminal: true
    - status: FAILED
      transitions: []
      terminal: true
    - status: BLOCKED
      transitions: []
      terminal: true

# ---------------------------------------------------------------------------
# 4. Boolean guard rails
# ---------------------------------------------------------------------------

guardRails:
  previewBeforeCommitRequired: true
  userConfirmationRequired: true
  dryRunBeforeChunking: true
  chunkCommitBoundedParallelism: true
  compensationReversible: true
  compensationIdempotent: true
  checkpointVersioned: true
  outboxRelaySeparated: true
  dnaBucketAccess: FORBIDDEN
  dnaBucketPrefixes:
    - dna/raw
    - dna/match
    - dna/consent
  crossServiceReferencesAreOpaque: true
  crossServiceReferencesRequirePublisherResolution: true
  tenantBoundaryOnEveryRepository: true
  longTransactionForbidden: true
  secretInPayloadForbidden: true
  auditHookOnEveryChunkCommit: true
  auditHookOnEveryCompensation: true
  adrRequiredBeforeExternalMatcher: true

# ---------------------------------------------------------------------------
# 5. Numeric bounds
# ---------------------------------------------------------------------------

numericBounds:
  importPreviewMaxRecords: 1000000
  importPreviewMaxCandidatesPerRecord: 50
  importPreviewExpirySeconds: 604800
  importChunkMaxRecords: 1000
  importChunkMaxBytes: 10485760
  importChunkMaxConcurrentCommits: 8
  importChunkCommitTimeoutSeconds: 300
  importChunkCommitHeartbeatSeconds: 30
  importChunkBackoffCoefficient: 2
  importChunkBackoffInitialSeconds: 5
  importChunkBackoffMaximumSeconds: 60
  importCompensationTimeoutSeconds: 600
  importCompensationHeartbeatSeconds: 30
  importReconciliationTimeoutSeconds: 900
  importReconciliationHeartbeatSeconds: 60
  importDedupFuzzyThreshold: 0.85
  importNameMaxLength: 256
  importAliasMaxLength: 256
  importAliasPerRecordMax: 64
  importNoteMaxLength: 4096
  importSagaIdLength: 64
  importActorPseudoIdLength: 64
  importTenantPseudoIdLength: 64
  importCorrelationIdLength: 128
  importUserPayloadMaxBytes: 52428800

# ---------------------------------------------------------------------------
# 6. Reconciled invariants (numeric)
# ---------------------------------------------------------------------------

reconciliationInvariants:
  importChunkCommitTimeoutSeconds: 300
  importChunkCommitHeartbeatSeconds: 30
  importChunkCommitHeartbeatMultiplier: 10
  importCompensationTimeoutSeconds: 600
  importCompensationHeartbeatSeconds: 30
  importCompensationHeartbeatMultiplier: 20
  importReconciliationTimeoutSeconds: 900
  importReconciliationHeartbeatSeconds: 60
  importReconciliationHeartbeatMultiplier: 15

# ---------------------------------------------------------------------------
# 7. Outbox event envelope
# ---------------------------------------------------------------------------

outboxEvents:
  doc: "Outbox events emitted by the import saga."
  items:
    - type: gp.importexport.v1.ImportPreviewReady
      envelopeFields:
        - eventId
        - eventType
        - occurredAt
        - tenantId
        - aggregateId
        - aggregateVersion
        - traceId
        - payload
    - type: gp.importexport.v1.ImportChunkCommitted
      envelopeFields:
        - eventId
        - eventType
        - occurredAt
        - tenantId
        - aggregateId
        - aggregateVersion
        - traceId
        - payload
    - type: gp.importexport.v1.ImportReconciled
      envelopeFields:
        - eventId
        - eventType
        - occurredAt
        - tenantId
        - aggregateId
        - aggregateVersion
        - traceId
        - payload

# ---------------------------------------------------------------------------
# 8. Audit hook requirements
# ---------------------------------------------------------------------------

auditHooks:
  auditRequired:
    - IMPORT_PREVIEW_QUEUED
    - IMPORT_PREVIEW_READY
    - IMPORT_DEDUP_CANDIDATES_READY
    - IMPORT_CONFIRMATION_RECEIVED
    - IMPORT_CHUNK_STARTED
    - IMPORT_CHUNK_COMMITTED
    - IMPORT_CHUNK_COMPENSATED
    - IMPORT_RECONCILIATION_STARTED
    - IMPORT_RECONCILIATION_FINISHED
    - IMPORT_DNA_BUCKET_REFUSED
    - IMPORT_PII_LEAK_REFUSED
    - IMPORT_FINALIZED
    - IMPORT_FAILED

# ---------------------------------------------------------------------------
# 9. Forbidden payload patterns
# ---------------------------------------------------------------------------

forbiddenPayloadPatterns:
  - rawDnaSequence
  - rawFastq
  - rawBam
  - rawVcf
  - exifGps
  - cameraSerial
  - passportNumber
  - socialSecurityNumber
  - nameOnBirth
  - rawEmail
  - rawPhone
  - rawAddress
  - biometricTemplate
  - rawFacialEmbedding
  - rawLivingStatus
  - rawMinorStatus
  - rawConsentDocument
  - rawSocialSecurityNumber
  - rawPassport
  - rawDriverLicense
  - rawTaxId
  - rawMedicalRecord
  - rawPaymentInstrument
  - productionPii

# ---------------------------------------------------------------------------
# 10. Capability boundaries
# ---------------------------------------------------------------------------

capabilityBoundaries:
  forbiddenSelfBuilt:
    - "Custom dedup matcher (use OpenSearch trigram or PostgreSQL pg_trgm)"
    - "Distributed transaction (outbox relay + chunked commit is enough)"
    - "Generic job-state / retry scheduler (Temporal per ADR-E0.5-07)"
    - "Custom preview approval UI (re-use platform components)"
    - "Custom long-running transaction (chunked commit + checkpoint is enough)"
    - "Cross-service aggregation (use Kafka events + publisher resolution)"