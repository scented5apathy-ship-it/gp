# E11.5 — Admin / support / operations contract.
#
# Source of truth: requirements.md R16, design.md §12 §13, ownership-catalog.md
# §2.11 + §3, privacy-and-legal-gate.md §9 TM-06 + D-07.
# Validated by scripts/lint-operations.mjs and enforced by
# services/operations-service/.../AdminSupportGuard.java.
#
# Hard invariants (E11.5 — Admin/support operations):
#   * JIT support access requires step-up auth + scoped expiry +
#     banner + audit (R16.3).
#   * Impersonation is disabled by default and never covers DNA,
#     raw consent, raw match, raw export, or tenant deletion.
#   * Tenant ops actions route through audit-service; admin/support
#     surface is internal-only via BFF / admin shell.
#   * DLQ replay is gated by an ADR + a check-point snapshot; no
#     manual flush without snapshot.
#   * Feature flag override requires reason + owner + audit; cannot
#     toggle DNA/consent flags.
#   * Projection rebuild views are sandboxed; cross-tenant rebuilds
#     forbidden.
#   * Tenant switch in the same browser session requires re-auth.

