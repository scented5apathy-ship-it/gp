guardRails:
  jitRequiresStepUpAuth: true
  jitRequiresScopedExpiry: true
  jitRequiresBannerVisible: true
  jitRequiresAuditLogEntry: true
  impersonationDisabledByDefault: true
  impersonationNeverCoversDna: true
  impersonationNeverCoversConsent: true
  impersonationNeverCoversExportRawBundle: true
  impersonationNeverCoversTenantDeletion: true
  impersonationSelfGrantForbidden: true
  impersonationGrantOtherForbidden: true
  dlqReplayRequiresSnapshot: true
  dlqReplaySnapshotMustIncludeLineageHash: true
  dlqReplayWithoutSnapshotIsBlocked: true
  projectionRebuildIsTenantScoped: true
  projectionRebuildCrossTenantForbidden: true
  featureFlagOverrideRequiresReason: true
  featureFlagOverrideRequiresOwner: true
  featureFlagDnaForbidden: true
  featureFlagConsentForbidden: true
  featureFlagTenantIsolationForbidden: true
  featureFlagAuditForbidden: true
  planOverrideRequiresReason: true
  quotaOverrideRequiresReason: true
  tenantSwitchRequiresReauth: true
  auditExportMUSTRespectRetention: true
  auditExportMUSTBeSignedUrl: true
  auditExportMUSTBeOneShot: true
  tenantOpsMustRouteThroughAudit: true
  adminSupportSurfaceInternalOnly: true
  adminSupportSurfaceBannerVisible: true

numericBounds:
  jitMaxDurationMinutes: 240
  jitMaxScopeMinutes: 240
  jitApprovalTimeoutSeconds: 900
  impersonationMaxDurationSeconds: 0
  dlqReplayMaxEventsPerRun: 10000
  dlqReplayMaxWindowHours: 168
  projectionRebuildMaxRows: 5000000
  projectionRebuildTimeoutSeconds: 1800
  featureFlagOverrideMaxTtlSeconds: 86400
  planOverrideMaxTtlSeconds: 2592000
  quotaOverrideMaxTtlSeconds: 604800
  auditExportSignedUrlTtlSeconds: 3600
  auditExportMaxBytes: 524288000
  tenantSwitchReauthMaxClockSkewSeconds: 60

invariants:
  - name: jitApprovalTimeoutShorterThanJitMaxDuration
    expression: jitApprovalTimeoutSeconds <= jitMaxDurationMinutes * 60
    why: approval window must close before JIT expires
  - name: jitMaxScopeDoesNotExceedJitMaxDuration
    expression: jitMaxScopeMinutes <= jitMaxDurationMinutes
    why: scope window cannot exceed the duration window
  - name: impersonationMaxDurationIsZero
    expression: impersonationMaxDurationSeconds == 0
    why: impersonation is disabled by default; any non-zero value is a bug
  - name: auditExportSignedUrlTtlWithinJitScope
    expression: auditExportSignedUrlTtlSeconds <= jitMaxDurationMinutes * 60
    why: signed URL cannot outlive the JIT window
  - name: dlqReplayMaxWindowWithinJitMaxDuration
    expression: dlqReplayMaxWindowHours * 3600 <= jitMaxDurationMinutes * 60
    why: DLQ replay window must fit inside a JIT access window

jitAccessStateMatrix:
  doc: "JIT support access lifecycle."
  initialStatus: REQUESTED
  statuses:
    - status: REQUESTED
      transitions: [PENDING_APPROVAL, DENIED]
    - status: PENDING_APPROVAL
      transitions: [ACTIVE, DENIED]
    - status: ACTIVE
      transitions: [EXPIRED, REVOKED]
    - status: EXPIRED
      transitions: []
      terminal: true
    - status: REVOKED
      transitions: []
      terminal: true
    - status: DENIED
      transitions: []
      terminal: true

dlqReplayStateMatrix:
  doc: "DLQ replay lifecycle."
  initialStatus: REQUESTED
  statuses:
    - status: REQUESTED
      transitions: [SNAPSHOT_VERIFIED, BLOCKED]
    - status: SNAPSHOT_VERIFIED
      transitions: [RUNNING]
    - status: RUNNING
      transitions: [COMPLETED, FAILED]
    - status: COMPLETED
      transitions: []
      terminal: true
    - status: BLOCKED
      transitions: []
      terminal: true
    - status: FAILED
      transitions: []
      terminal: true

projectionRebuildAdminStateMatrix:
  doc: "Projection rebuild lifecycle (admin-driven)."
  initialStatus: REQUESTED
  statuses:
    - status: REQUESTED
      transitions: [APPROVED, BLOCKED]
    - status: APPROVED
      transitions: [RUNNING]
    - status: RUNNING
      transitions: [COMPLETED, FAILED]
    - status: COMPLETED
      transitions: []
      terminal: true
    - status: BLOCKED
      transitions: []
      terminal: true
    - status: FAILED
      transitions: []
      terminal: true

