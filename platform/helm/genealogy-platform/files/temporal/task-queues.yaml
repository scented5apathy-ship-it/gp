# Source-of-truth Temporal task queue policy — E2.4.
#
# Per `tasks.md` E2.4 every worker task queue is declared here.
# Adding a new task queue requires a PR to this file (the chart picks
# the change up on the next `helm upgrade` and the worker Helm hook
# recreates the queues with the documented `WorkflowExecutionRetention`
# + `description`).
#
# Naming: `<domain>-<capability>`. Capability is one of `main`,
# `dna-match`, `media-scan`, `media-derive`, `search-rebuild`,
# `interop`, `notify-dispatch`, `report-gen`. The `<domain>-`
# prefix matches the namespace name in `namespace-config.yaml` so
# operators can grep one file to find every workflow for a domain.
#
# Worker identity:
#   - the `workerIdentity` block declares which workload identity
#     is allowed to register against this queue. The identity is the
#     Kubernetes service-account name (e.g. `genealogy-service`,
#     `dna-worker`). Workers register via the Istio-mTLS-secured
#     gRPC channel; the server allows only identities in the list
#     below.
#
# Default settings (override-able per queue):
#   - `workflowExecutionRetention`: 30d (365d for `dna-*`).
#   - `description`: a human-readable summary consumed by
#     `temporal task-queue describe`.
#
# This file is the contract; runtime reconciliation lives in
# `templates/components/temporal/task-queue-config.yaml` Helm hook.
apiVersion: v1
kind: ConfigMap
metadata:
  name: genea-temporal-task-queues
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: temporal
    app.kubernetes.io/version: "1.26"
    gp.genealogy/contract-only: "true"
data:
  policy.yaml: |
    # Default for every queue. Per-queue overrides are spelled out
    # below; anything that does not declare an override inherits
    # these.
    defaults:
      workflowExecutionRetentionDays: 30
      description: "auto-generated by E2.4 chart"
    queues:
      # ----- Genealogy -----
      - name: genea-genealogy-main
        namespace: genea-genealogy
        description: tree merge, person upsert, relationship reconcile
        ownerService: genealogy-service
        workerIdentity:
          - genealogy-service
          - genealogy-worker
        workflowExecutionRetentionDays: 30
      - name: genea-genealogy-outbox
        namespace: genea-genealogy
        description: transactional outbox relay (genealogy → Kafka)
        ownerService: genealogy-service
        workerIdentity:
          - genealogy-service
        workflowExecutionRetentionDays: 30
      # ----- Media -----
      - name: genea-media-scan
        namespace: genea-media
        description: ClamAV + Tika scan on QUARANTINED assets
        ownerService: media-service
        workerIdentity:
          - media-service
          - media-worker
        workflowExecutionRetentionDays: 30
      - name: genea-media-derive
        namespace: genea-media
        description: libvips/FFmpeg/Tesseract derivative production
        ownerService: media-service
        workerIdentity:
          - media-service
          - media-worker
        workflowExecutionRetentionDays: 30
      # ----- Search -----
      - name: genea-search-rebuild
        namespace: genea-search
        description: authorized + public search projection rebuild
        ownerService: search-service
        workerIdentity:
          - search-service
          - search-indexer
        workflowExecutionRetentionDays: 30
      # ----- Interop -----
      - name: genea-interop-transfer
        namespace: genea-interop
        description: GEDCOM/CSV/JSON/PDF import + export workflows
        ownerService: import-export-service
        workerIdentity:
          - import-export-service
          - export-worker
        workflowExecutionRetentionDays: 30
      # ----- Notify -----
      - name: genea-notify-dispatch
        namespace: genea-notify
        description: notification dispatch + retry/dead-letter
        ownerService: notification-service
        workerIdentity:
          - notification-service
          - notification-worker
        workflowExecutionRetentionDays: 30
      # ----- Report -----
      - name: genea-reporting-gen
        namespace: genea-reporting
        description: report / dashboard / projection generation
        ownerService: reporting-service
        workerIdentity:
          - reporting-service
        workflowExecutionRetentionDays: 30
      # ----- DNA -----
      # Retention bumped to 365d per `privacy-and-legal-gate.md`
      # §14 — revocation evidence must survive the longest legal
      # hold window the platform supports at GA.
      - name: genea-dna-match
        namespace: genea-dna
        description: DNA match + segment computation (worker pool isolated)
        ownerService: dna-service
        workerIdentity:
          - dna-service
          - dna-worker
        workflowExecutionRetentionDays: 365
      - name: genea-dna-revoke
        namespace: genea-dna
        description: DNA revocation + evidence purge workflow
        ownerService: dna-service
        workerIdentity:
          - dna-service
          - dna-worker
        workflowExecutionRetentionDays: 365
