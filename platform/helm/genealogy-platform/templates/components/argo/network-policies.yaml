{{/*
Argo CD + Argo Rollouts NetworkPolicy — default deny all
Ingress + Egress; allow the in-cluster application-controller
+ repo-server + rollouts-controller to communicate; allow
Prometheus to scrape the metrics endpoint; allow the OTel
Collector to receive the audit + notification webhooks.

Per `tasks.md` E2.9 + `design.md` §13 the Argo CD server
admin UI is NEVER reachable from the public ingress. It is
only reachable from the bastion VPN (operator console).
*/}}
{{- $argo := .Values.components.gitOps }}
{{- if and $argo.enabled (eq $argo.driver "argocd") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-default-deny
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argocd
    gp.genealogy/contract-only: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: genealogy-platform
      app.kubernetes.io/component: argocd
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-allow-control-plane
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argocd
    gp.genealogy/contract-only: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: genealogy-platform
      app.kubernetes.io/component: argocd
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Operator admin UI — bastion VPN only.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 443
    # Prometheus scrapes the metrics endpoint.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
      ports:
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 8082
    # In-cluster application-controller → repo-server
    # (port 8081) + application-controller → server (port 8080)
    # + repo-server → server (port 8080)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: genealogy-platform
              app.kubernetes.io/component: argocd
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 6379
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # OTel Collector (audit log + notifications webhook)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Vault (admin password + signing keys via ESO)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/component: vault
      ports:
        - protocol: TCP
          port: 8200
    # Keycloak (OIDC SSO)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/component: keycloak
      ports:
        - protocol: TCP
          port: 8080
    # Application namespaces (the application-controller
    # reconciles Application / Rollout / Secret / ConfigMap
    # CRs across the platform).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-edge
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-bff
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-services
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-workers
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-platform
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-observability
      ports:
        - protocol: TCP
          port: 443
{{- if $argo.rolloutsEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argo-rollouts-allow-control-plane
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argo-rollouts
    gp.genealogy/contract-only: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: genealogy-platform
      app.kubernetes.io/component: argo-rollouts
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrapes the metrics endpoint.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
      ports:
        - protocol: TCP
          port: 8082
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Prometheus (AnalysisTemplate metrics queries)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # OTel Collector (audit log)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Application namespaces (Rollout / Deployment / Service /
    # ConfigMap / Secret reconciliation).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-edge
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-bff
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-services
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-workers
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-platform
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
