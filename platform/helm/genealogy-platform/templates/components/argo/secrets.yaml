{{/*
Argo CD + Argo Rollouts Secrets (placeholders for
External Secrets Operator + Vault per E2.6 contract).
The chart NEVER inlines a literal credential; the
bootstrap Job awaits the ExternalSecret object and
rolls the Pod only after ESO reports Ready=True.

Placeholders for the canonical Argo CD secret set:
  - argocd-admin-password       (admin password; required for
                                 initial bootstrap)
  - argocd-server-secret        (server session secret)
  - argocd-signing-key          (UI signing key)
  - argocd-dex-signing-key      (OIDC signing key)
  - argocd-gpg-signing-key      (manifest signing key)
  - argocd-redis-secret         (Redis AUTH password)
  - argocd-keycloak-client-secret (OIDC client secret)
  - argocd-notifications-slack-secret (webhook secret)
*/}}
{{- $argo := .Values.components.gitOps }}
{{- if and $argo.enabled (eq $argo.driver "argocd") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-admin-password
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argocd
    gp.genealogy/contract-only: "true"
type: Opaque
stringData:
  password: "REPLACE_VIA_ESO"
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-server-secret
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argocd
    gp.genealogy/contract-only: "true"
type: Opaque
stringData:
  secret: "REPLACE_VIA_ESO"
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-signing-key
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argocd
    gp.genealogy/contract-only: "true"
type: Opaque
stringData:
  signingKey: "REPLACE_VIA_ESO"
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-dex-signing-key
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argocd
    gp.genealogy/contract-only: "true"
type: Opaque
stringData:
  signingKey: "REPLACE_VIA_ESO"
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-gpg-signing-key
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argocd
    gp.genealogy/contract-only: "true"
type: Opaque
stringData:
  signingKey: "REPLACE_VIA_ESO"
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-redis-secret
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argocd
    gp.genealogy/contract-only: "true"
type: Opaque
stringData:
  password: "REPLACE_VIA_ESO"
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-keycloak-client-secret
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argocd
    gp.genealogy/contract-only: "true"
type: Opaque
stringData:
  clientSecret: "REPLACE_VIA_ESO"
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-slack-secret
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argocd
    gp.genealogy/contract-only: "true"
type: Opaque
stringData:
  webhook: "REPLACE_VIA_ESO"
{{- end }}
