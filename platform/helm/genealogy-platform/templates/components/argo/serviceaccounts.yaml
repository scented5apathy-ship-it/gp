{{/*
Argo CD + Argo Rollouts ServiceAccounts. The
argocd-application-controller SA needs the standard
Kubernetes RBAC to manage Application / Rollout / Secret
CRs (cluster-scoped, controlled by AppProject RBAC, not
by ServiceAccount). The argo-rollouts-controller SA needs
the standard RBAC to manage Rollout / AnalysisTemplate /
Deployment / Service / ConfigMap / Secret CRs.
*/}}
{{- $argo := .Values.components.gitOps }}
{{- if and $argo.enabled (eq $argo.driver "argocd") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argocd
    gp.genealogy/contract-only: "true"
{{- if $argo.rolloutsEnabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-rollouts
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: argo-rollouts
    gp.genealogy/contract-only: "true"
{{- end }}
{{- end }}
