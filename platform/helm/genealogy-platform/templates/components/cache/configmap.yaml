{{/*
Valkey config ConfigMap — mirror the source-of-truth file
into the cluster. The chart never mutates the
source-of-truth file; the contract is enforced by the deep
linter + the byte-identity check on the mirror.
*/}}
{{- $cache := .Values.components.cache }}
{{- $source := printf "files/%s" ($cache.configPath | default "storage/valkey-config.yaml") }}
{{- if $cache.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: genea-cache-valkey-config
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: cache
    gp.genealogy/contract-only: "true"
data:
  config.yaml: |-
    {{- (.Files.Get $source) | nindent 4 }}
{{- end }}
