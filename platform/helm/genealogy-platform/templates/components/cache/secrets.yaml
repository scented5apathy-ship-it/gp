{{/*
Valkey Secrets — placeholder objects consumed by External
Secrets Operator. The chart never inlines a literal password.
ESO syncs the actual password from Vault at runtime.
*/}}
{{- $cache := .Values.components.cache }}
{{- if and $cache.enabled (eq $cache.provider "valkey") }}
{{- $ns := "gp-data" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: valkey-credentials
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: cache
    gp.genealogy/contract-only: "true"
  annotations:
    "external-secrets.io/external-secret": valkey-credentials
type: Opaque
stringData:
  # Placeholder — replaced by ESO.
  password: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: valkey-server-tls
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: cache
    gp.genealogy/contract-only: "true"
  annotations:
    cert-manager.io/issuer-name: selfsigned-ca
    cert-manager.io/common-name: valkey.gp-data.svc.cluster.local
    cert-manager.io/duration: 8760h
type: kubernetes.io/tls
stringData:
  tls.crt: "REPLACE_ME"
  tls.key: "REPLACE_ME"
  ca.crt: "REPLACE_ME"
{{- end }}
