{{/*
Valkey ServiceAccount + Sentinel ServiceAccount. Domain pods
(bff, openfga-cache, etc.) retain their own ServiceAccounts;
the chart ships the cache pod's SA + the cache-init Job's SA.
*/}}
{{- $cache := .Values.components.cache }}
{{- if and $cache.enabled (eq $cache.provider "valkey") }}
{{- $ns := "gp-data" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: valkey
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: cache
    gp.genealogy/contract-only: "true"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cache-acl-init
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: cache
    app.kubernetes.io/job: cache-acl-init
    gp.genealogy/contract-only: "true"
automountServiceAccountToken: false
{{- end }}
