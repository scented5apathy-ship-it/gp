{{/*
Umbrella component template.

This template intentionally only emits a labelled namespace stub per
component block. The actual workload manifests ship with the
dedicated E2.2–E2.10 subcharts. Keeping a single stub here lets
`helm template --validate-only` succeed today (required by the
preflight script) without duplicating any platform workload into the
umbrella.

Per `agent-execution.md` §4.4 the umbrella is contract-first; no
domain authorization, no inline secret, no implicit cross-namespace
allow — those live in the dedicated subcharts and the workload
charts.
*/}}
{{- range $name, $component := .Values.components }}
{{- if eq $name "kong" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-contract-stub
  namespace: gp-edge
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: kong
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Kong runtime contract (E2.2).
    # Domain authorization is forbidden here per design.md §4.1 / §5.
    responsibilities:
      - tls termination
      - auth-validation (jwt slot; key resolution wired in E3.1)
      - cors
      - request-size limit
      - rate limit (per route class)
      - correlation-id injection (X-Request-Id)
    route_classes:
      - public      # web-public  -> gp-bff/web-public
      - authenticated # web-bff    -> gp-bff/web-bff
      - partner     # public-api  -> gp-bff/public-api
      - admin       # admin-api   -> gp-platform/admin-api
    forbidden:
      - business authorization (living / DNA / consent)
      - aggregate data storage
      - OpenFGA tuple write
      - ABAC decision
    notes:
      - All routes are path-scoped and tag-scoped so a cross-route
        request cannot reach the wrong backend.
      - The admin route is additionally IP-restricted to the bastion
        + Argo CD + on-call VPN ranges.
      - `KONG_PLUGINS` allow-list rejects any plugin that could carry
        domain authorization at startup.
{{- end }}
{{- if eq $name "kafka" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-contract-stub
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: kafka
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Kafka runtime contract (E2.3).
    responsibilities:
      - durable event bus (KRaft, no ZooKeeper)
      - topic + ACL config-as-code
      - per-broker static quota (StaticQuotaCallback)
      - JMX exporter for SLI / alert source
    topic_classes:
      - domain-event      # 30d retention
      - projection-rebuild # 7d retention
      - audit             # 365d retention
      - dlq               # 14d retention
    compatibility:
      - BACKWARD (default)
      - FORWARD (projection rebuild)
      - FULL (shared enums)
    forbidden:
      - storing raw DNA
      - storing file content
      - storing access token
      - storing PII not required for the consumer
      - scram-sha-512 (no literal credentials)
    notes:
      - Two listeners (plain 9092 + tls 9093), both internal-only.
      - Default `auto.create.topics.enable=false` — every topic must
        be declared in `platform/kafka/topics.yaml`.
      - Authz is `simple`; business authorization is enforced at the
        service via OpenFGA + ABAC, never at the broker.
      - Replication factor is per-env (3 SaaS / 3 on-prem / 1 dev).
{{- end }}
{{- if eq $name "apicurio" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apicurio-contract-stub
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: apicurio
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Apicurio runtime contract (E2.3).
    responsibilities:
      - canonical schema store (Avro, ADR-E0.5-08)
      - compatibility policy enforcement (BACKWARD default)
      - artifact lifecycle (deprecate / disable / restore)
    artifacts:
      - genea-person-v1
      - genea-tree-v1
      - genea-relationship-v1
      - genea-media-v1
      - genea-research-v1
      - genea-collaboration-v1
      - genea-notification-v1
      - genea-search-rebuild-v1
      - genea-public-rebuild-v1
      - genea-audit-v1
      - genea-dlq-v1
    storage: postgresql (sql kind, in-memory forbidden in production)
    forbidden:
      - storing raw DNA / file content / token in any artifact
      - enabling the confluent-compatible REST shim
        (Confluent Community License, not on allow-list)
    notes:
      - Avro only; JSON Schema is reserved for partner webhooks.
      - Per-artifact compatibility override applied at provisioning
        via `scripts/seed-apicurio.mjs`.
      - JMX exporter sidecar feeds the registry-availability alert.
{{- end }}
{{- if eq $name "temporal" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-contract-stub
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: temporal
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Temporal runtime contract (E2.4).
    responsibilities:
      - durable workflow + saga orchestration
      - namespace + retention policy
      - per-queue worker identity
      - visibility / search attribute whitelist
    namespaces:
      - genea-default
      - genea-genealogy
      - genea-media
      - genea-search
      - genea-interop
      - genea-notify
      - genea-reporting
      - genea-dna
    defaults:
      workflowExecutionTimeout: 24h
      activityScheduleToCloseTimeout: 60s
      activityHeartbeatTimeout: 10s
      activityMaxAttempts: 3
    visibility_attribute_whitelist:
      - TenantId
      - WorkflowType
      - TaskQueue
      - Attempt
      - AggregateType
      - AggregateId
      - MediaAssetId
      - TransferJobId
      - ConsentId
    forbidden_search_attributes:
      - raw PII / email / phone / address
      - raw DNA genotype or segment table
      - OIDC access / refresh token
      - raw Keycloak subject
      - signed media URL
      - raw person / user / tenant UUID
    workerIdentity:
      - Kubernetes service-account name (genealogy-service, media-worker, dna-worker) registered via Istio mTLS.
    notes:
      - Self-hosted Temporal everywhere per ADR-E0.5-07. SaaS may swap to Temporal Cloud only with an in-region + on-prem parity contract.
      - 30-day retention default; DNA namespace bumped to 365d per privacy-and-legal-gate.md section 14.
      - Domain authorization is at the service via OpenFGA + ABAC; Temporal does NOT carry business policy.
      - Search attributes are pseudonymised at the worker boundary via the platform tenant-pseudo-id library.
{{- end }}
{{- if eq $name "istio" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-contract-stub
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: istio
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Istio service mesh contract (E2.5).
    responsibilities:
      - workload identity (SPIFFE X.509) via strict mTLS
      - deny-by-default AuthorizationPolicy (forged principal rejected)
      - REGISTRY_ONLY outbound (no public internet egress without ServiceEntry)
      - OTel-trace export via the platform OTel Collector (E2.10)
      - Prometheus RED metrics via the platform Prometheus (E2.10)
      - JSON access log including SPIFFE principal (PII redacted by OTel pipeline)
    namespaces:
      - gp-platform
      - gp-edge
      - gp-bff
      - gp-services
      - gp-workers
      - gp-data
      - gp-observability
      - gp-argocd
    default_policy:
      mtls: STRICT
      outboundPolicy: REGISTRY_ONLY
      inboundPolicy: MUTUAL_TLS
      mesh_retry: disabled
      app_retry:
        maxAttempts: 3
        backoff: 50ms/2s/2x
      trustDomain: cluster.local
    principal_format: "spiffe://cluster.local/ns/{{.Namespace}}/sa/{{.ServiceAccount}}"
    dedicated_deny_blocks:
      - dna-service egress (only dna-worker may reach dna-postgres / dna-raw)
      - media-worker egress (only the ClamAV / Tika / FFmpeg / Gotenberg sandbox)
      - dna-worker egress (public internet forbidden)
    forbidden:
      - mesh-level retry (would compound with app-level retry budget)
      - PERMISSIVE / DISABLE mTLS (plaintext forbidden in production)
      - ALLOW without source.principals (deny-by-default must be intact)
      - CUSTOM ext-authz without a registered envoyExtAuthzHttp provider
      - business authorization (living / DNA / consent) — service-owned
    notes:
      - Mesh + app retry budgets are kept disjoint (3 app attempts × 1 mesh attempt) to prevent retry amplification per design.md §13.
      - Workload identity is the SPIFFE cert minted by istiod; the platform cert-manager + Vault PKI chain anchors the trust root.
      - Domain authorization is at the service via OpenFGA + ABAC; Istio only gates mesh-level (network) authorization.
      - The dna-service and media-worker isolation rules mirror E10.2 + E7.2 sandbox contracts.
{{- end }}
{{- if eq $name "vault" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-contract-stub
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Vault runtime contract (E2.6).
    responsibilities:
      - dynamic short-lived credentials
      - per-workload policy
      - key rotation
    forbidden:
      - storing raw DNA
      - storing PII
      - persisting secret material outside KMS-backed storage
{{- end }}
{{- if eq $name "observability" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-contract-stub
  namespace: gp-observability
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: observability
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Observability contract (E2.10).
    label_allowlist:
      - tenant_pseudo_id
      - user_pseudo_id
      - service
      - version
      - environment
      - trace_id
    label_denylist:
      - tenant_id
      - user_id
      - email
      - raw_dna
{{- end }}
{{- end }}
