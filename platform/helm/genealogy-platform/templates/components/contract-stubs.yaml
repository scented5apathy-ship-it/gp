{{/*
Umbrella component template.

This template intentionally only emits a labelled namespace stub per
component block. The actual workload manifests ship with the
dedicated E2.2–E2.10 subcharts. Keeping a single stub here lets
`helm template --validate-only` succeed today (required by the
preflight script) without duplicating any platform workload into the
umbrella.

Per `agent-execution.md` §4.4 the umbrella is contract-first; no
domain authorization, no inline secret, no implicit cross-namespace
allow — those live in the dedicated subcharts and the workload
charts.
*/}}
{{- range $name, $component := .Values.components }}
{{- if eq $name "kong" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-contract-stub
  namespace: gp-edge
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: kong
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Kong runtime contract (E2.2).
    # Domain authorization is forbidden here per design.md §4.1 / §5.
    responsibilities:
      - tls termination
      - auth-validation (jwt slot; key resolution wired in E3.1)
      - cors
      - request-size limit
      - rate limit (per route class)
      - correlation-id injection (X-Request-Id)
    route_classes:
      - public      # web-public  -> gp-bff/web-public
      - authenticated # web-bff    -> gp-bff/web-bff
      - partner     # public-api  -> gp-bff/public-api
      - admin       # admin-api   -> gp-platform/admin-api
    forbidden:
      - business authorization (living / DNA / consent)
      - aggregate data storage
      - OpenFGA tuple write
      - ABAC decision
    notes:
      - All routes are path-scoped and tag-scoped so a cross-route
        request cannot reach the wrong backend.
      - The admin route is additionally IP-restricted to the bastion
        + Argo CD + on-call VPN ranges.
      - `KONG_PLUGINS` allow-list rejects any plugin that could carry
        domain authorization at startup.
{{- end }}
{{- if eq $name "kafka" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-contract-stub
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: kafka
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Kafka runtime contract (E2.3).
    responsibilities:
      - durable event bus (KRaft, no ZooKeeper)
      - topic + ACL config-as-code
      - per-broker static quota (StaticQuotaCallback)
      - JMX exporter for SLI / alert source
    topic_classes:
      - domain-event      # 30d retention
      - projection-rebuild # 7d retention
      - audit             # 365d retention
      - dlq               # 14d retention
    compatibility:
      - BACKWARD (default)
      - FORWARD (projection rebuild)
      - FULL (shared enums)
    forbidden:
      - storing raw DNA
      - storing file content
      - storing access token
      - storing PII not required for the consumer
      - scram-sha-512 (no literal credentials)
    notes:
      - Two listeners (plain 9092 + tls 9093), both internal-only.
      - Default `auto.create.topics.enable=false` — every topic must
        be declared in `platform/kafka/topics.yaml`.
      - Authz is `simple`; business authorization is enforced at the
        service via OpenFGA + ABAC, never at the broker.
      - Replication factor is per-env (3 SaaS / 3 on-prem / 1 dev).
{{- end }}
{{- if eq $name "apicurio" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apicurio-contract-stub
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: apicurio
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Apicurio runtime contract (E2.3).
    responsibilities:
      - canonical schema store (Avro, ADR-E0.5-08)
      - compatibility policy enforcement (BACKWARD default)
      - artifact lifecycle (deprecate / disable / restore)
    artifacts:
      - genea-person-v1
      - genea-tree-v1
      - genea-relationship-v1
      - genea-media-v1
      - genea-research-v1
      - genea-collaboration-v1
      - genea-notification-v1
      - genea-search-rebuild-v1
      - genea-public-rebuild-v1
      - genea-audit-v1
      - genea-dlq-v1
    storage: postgresql (sql kind, in-memory forbidden in production)
    forbidden:
      - storing raw DNA / file content / token in any artifact
      - enabling the confluent-compatible REST shim
        (Confluent Community License, not on allow-list)
    notes:
      - Avro only; JSON Schema is reserved for partner webhooks.
      - Per-artifact compatibility override applied at provisioning
        via `scripts/seed-apicurio.mjs`.
      - JMX exporter sidecar feeds the registry-availability alert.
{{- end }}
{{- if eq $name "temporal" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-contract-stub
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: temporal
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Temporal runtime contract (E2.4).
    responsibilities:
      - durable workflow + saga orchestration
      - namespace + retention policy
      - per-queue worker identity
      - visibility / search attribute whitelist
    namespaces:
      - genea-default
      - genea-genealogy
      - genea-media
      - genea-search
      - genea-interop
      - genea-notify
      - genea-reporting
      - genea-dna
    defaults:
      workflowExecutionTimeout: 24h
      activityScheduleToCloseTimeout: 60s
      activityHeartbeatTimeout: 10s
      activityMaxAttempts: 3
    visibility_attribute_whitelist:
      - TenantId
      - WorkflowType
      - TaskQueue
      - Attempt
      - AggregateType
      - AggregateId
      - MediaAssetId
      - TransferJobId
      - ConsentId
    forbidden_search_attributes:
      - raw PII / email / phone / address
      - raw DNA genotype or segment table
      - OIDC access / refresh token
      - raw Keycloak subject
      - signed media URL
      - raw person / user / tenant UUID
    workerIdentity:
      - Kubernetes service-account name (genealogy-service, media-worker, dna-worker) registered via Istio mTLS.
    notes:
      - Self-hosted Temporal everywhere per ADR-E0.5-07. SaaS may swap to Temporal Cloud only with an in-region + on-prem parity contract.
      - 30-day retention default; DNA namespace bumped to 365d per privacy-and-legal-gate.md section 14.
      - Domain authorization is at the service via OpenFGA + ABAC; Temporal does NOT carry business policy.
      - Search attributes are pseudonymised at the worker boundary via the platform tenant-pseudo-id library.
{{- end }}
{{- if eq $name "istio" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-contract-stub
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: istio
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Istio service mesh contract (E2.5).
    responsibilities:
      - workload identity (SPIFFE X.509) via strict mTLS
      - deny-by-default AuthorizationPolicy (forged principal rejected)
      - REGISTRY_ONLY outbound (no public internet egress without ServiceEntry)
      - OTel-trace export via the platform OTel Collector (E2.10)
      - Prometheus RED metrics via the platform Prometheus (E2.10)
      - JSON access log including SPIFFE principal (PII redacted by OTel pipeline)
    namespaces:
      - gp-platform
      - gp-edge
      - gp-bff
      - gp-services
      - gp-workers
      - gp-data
      - gp-observability
      - gp-argocd
    default_policy:
      mtls: STRICT
      outboundPolicy: REGISTRY_ONLY
      inboundPolicy: MUTUAL_TLS
      mesh_retry: disabled
      app_retry:
        maxAttempts: 3
        backoff: 50ms/2s/2x
      trustDomain: cluster.local
    principal_format: "spiffe://cluster.local/ns/{{.Namespace}}/sa/{{.ServiceAccount}}"
    dedicated_deny_blocks:
      - dna-service egress (only dna-worker may reach dna-postgres / dna-raw)
      - media-worker egress (only the ClamAV / Tika / FFmpeg / Gotenberg sandbox)
      - dna-worker egress (public internet forbidden)
    forbidden:
      - mesh-level retry (would compound with app-level retry budget)
      - PERMISSIVE / DISABLE mTLS (plaintext forbidden in production)
      - ALLOW without source.principals (deny-by-default must be intact)
      - CUSTOM ext-authz without a registered envoyExtAuthzHttp provider
      - business authorization (living / DNA / consent) — service-owned
    notes:
      - Mesh + app retry budgets are kept disjoint (3 app attempts × 1 mesh attempt) to prevent retry amplification per design.md §13.
      - Workload identity is the SPIFFE cert minted by istiod; the platform cert-manager + Vault PKI chain anchors the trust root.
      - Domain authorization is at the service via OpenFGA + ABAC; Istio only gates mesh-level (network) authorization.
      - The dna-service and media-worker isolation rules mirror E10.2 + E7.2 sandbox contracts.
{{- end }}
{{- if eq $name "vault" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-contract-stub
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Vault + cloud KMS abstraction contract (E2.6).
    responsibilities:
      - dynamic short-lived credentials via Vault Agent Injector
      - per-workload policy (deny-all default + path-scoped ACLs)
      - key rotation per data class (30-365d per privacy-and-legal-gate.md §5)
      - cloud KMS abstraction (SaaS = AWS KMS; on-prem = Vault transit)
      - short-lived AppRole + JWT for CI + human operators
      - emergency key revoke (DNA consent revocation path)
    auth_methods:
      - kubernetes      # canonical workload identity (E1.4 Spring Boot template)
      - keycloak-oidc   # reserved for human operators (E3.1)
      - github-actions  # reserved for CI / GitOps runners (ADR-E0.5-13)
    forbidden_auth_methods:
      - userpass
      - ldap
      - cert
    kms_abstraction:
      contract_interface: com.genealogy.platform.kms.KmsProvider
      active_provider:
        saas: aws-kms
        onprem: vault-transit
        dev: vault-transit
      keys_per_class: 11    # one KMS key per data class in §5
      rotation_days:
        PII.IDENTITY: 90
        PII.QUASI_ID: 90
        PII.SENSITIVE: 30
        GENETIC.RAW: 30
        GENETIC.METADATA: 90
        GENETIC.DERIVED: 90
        MEDIA.RAW: 90
        MEDIA.DERIVATIVE: 90
        AUDIT.APPENDONLY: 365
        OPS.METADATA: 90
        SECRET: 30
    seal:
      saas: awskms     # via IRSA / pod identity (no literal key)
      onprem: transit  # against customer-managed Vault cluster
      dev: shamir      # operator-unsealed manually
    injector_required_annotations:
      - vault.hashicorp.com/agent-inject: "true"
      - vault.hashicorp.com/agent-revoke-on-shutdown: "true"
      - vault.hashicorp.com/role: <policy-from-policies.yaml>
    forbidden:
      - persisting raw DNA
      - persisting raw PII
      - persisting secret material outside KMS-backed storage
      - literal AWS access key / secret key in any values file
      - root policy capability in any Vault policy
      - business authorization (living / DNA / consent) — service-owned
    notes:
      - Source-of-truth files: platform/vault/server-config.yaml +
        auth-methods.yaml + policies.yaml + kms-abstraction.yaml +
        injector-templates.yaml.
      - Mirror files: platform/helm/genealogy-platform/files/vault/*.yaml.
      - Bootstrap Job: templates/components/vault/bootstrap-job.yaml.
        Runs on every `helm upgrade` (pre-install,pre-upgrade hook).
      - Domain authorization is at the service via OpenFGA + ABAC;
        Vault only decides credential scope.
      - The dna-data class (GENETIC.RAW) has its own KMS key + Vault
        policy (E10.2 isolation); emergency revoke is wired to
        E10.5 consent revocation.
{{- end }}
{{- if eq $name "storage" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-contract-stub
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: storage
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # S3/MinIO + bucket policy contract (E2.7).
    responsibilities:
      - S3-compatible object storage (MinIO on-prem + dev; AWS S3 on SaaS)
      - per-bucket versioning + lifecycle + encryption (SSE-KMS) + CORS
      - per-bucket IAM policy (workload SA → read/write)
      - per-bucket prefix template with `{tenant_pseudo_id}`
      - cross-region replication on SaaS (RPO ≤ 15 min)
      - object lock (compliance mode) on dna-raw + import-export
      - signed URL TTL ceiling (1 hour, 15 min for export)
      - audit log to OTel Collector (E2.10)
      - byte-identity mirror of source-of-truth files
    buckets:
      - media            # tree media (images, audio, video, PDF)
      - media-quarantine # uploads waiting for scan
      - dna-raw          # raw DNA (E10.4, isolated bucket)
      - import-export    # GEDCOM / CSV / JSON / PDF bundles
    bucket_invariants:
      publicAccessBlock: enforced
      kmsKeyAliasRequired: true
      prefixTenantPseudoIdRequired: true
      corsWildcardForbidden: true
    forbidden:
      - public READ ACL on the `media` bucket
      - raw tenant UUID in any prefix template
      - raw DNA outside `dna-raw/*`
      - raw PII outside `media-quarantine/*`
      - signed URL TTL > 1 hour (export bucket ≤ 15 min)
      - literal AWS access key / secret key in any values file
      - CORS wildcard origin
    signed_url_ttl_ceiling_seconds: 3600
    export_signed_url_ttl_seconds: 900
    replication:
      saas: enabled     # cross-region active-passive
      onprem: customer-managed
      dev: disabled
    s3_api_operations:
      - PutObject
      - GetObject
      - HeadObject
      - DeleteObject
      - CopyObject
      - CreateMultipartUpload
      - UploadPart
      - CompleteMultipartUpload
      - AbortMultipartUpload
      - ListObjectVersions
      - GetObjectSignedUrl
      - PutObjectSignedUrl
      - PutBucketLifecycle
      - PutBucketCors
      - PutObjectWithSSEKMS
      - PutObjectLegalHold
      - PutObjectRetention
    notes:
      - Source-of-truth: platform/storage/{s3-config,bucket-policy,compatibility-matrix}.yaml.
      - Mirror: platform/helm/genealogy-platform/files/storage/*.yaml.
      - Bootstrap Job: templates/components/storage/bucket-init-job.yaml.
      - Compatibility test: scripts/check-s3-compatibility.mjs (Testcontainers + aws-sdk-client-mock).
      - Domain code binds to com.genealogy.platform.storage.ObjectStorageProvider;
        runtime provider is selected via the per-env `storage.provider` value.
      - The dna-raw bucket is E10.2 isolated (separate IAM, separate KMS key,
        separate NetworkPolicy). The web-bff has NO access to dna-raw.
      - Lifecycle: media 365d; media-quarantine 30d; dna-raw indefinite (legal hold);
        import-export 30d.
{{- end }}
{{- if eq $name "cache" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-contract-stub
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: cache
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Valkey (Redis-compatible) cache contract (E2.7).
    responsibilities:
      - cache / session / rate-state substrate (NOT source of truth)
      - Sentinel-managed HA (3 replicas SaaS + on-prem)
      - per-class TTL ceiling (session 1h, rate 60s, cache 5m, decision 30s)
      - per-user ACL with subcommand allowlist
      - tenant-aware key namespace `gp:{tenant_pseudo_id}:*`
      - persistence AOF + RDB snapshot (fail-safe, not source-of-truth)
      - Prometheus exporter on port 9121
    required_users:
      - web-bff
      - media-service
      - genealogy-service
      - search-service
      - rate-limiter
      - openfga-cache
      - abac-cache
      - tenant-lookup
      - observability
      - operator       # @admin; bootstrap + runbook only
    ttl_ceilings:
      sessionSeconds: 7200
      rateStateSeconds: 300
      cacheSeconds: 1800
      permissionDecisionSeconds: 60
      abacRedactionSeconds: 60
    maxmemoryPolicy: allkeys-lru
    forbidden:
      - storing raw DNA / raw PII / raw sensitive content
      - key pattern containing `password`, `apiKey`, `token`, `private_key`
      - `@admin` ACL for any service user (operator only)
      - `noeviction` policy (silent OOM risk)
      - `KEYS *` / `FLUSHDB` / `FLUSHALL` from service users
    notes:
      - Source-of-truth: platform/storage/valkey-config.yaml.
      - Mirror: platform/helm/genealogy-platform/files/storage/valkey-config.yaml.
      - Domain code binds to com.genealogy.platform.cache.CacheClient;
        the adapter is `valkey-client` on on-prem + dev and
        `elasticache-client` on SaaS.
      - Cache data is fail-safe only — domain services must
        rebuild cache state from PostgreSQL on Valkey restart.
      - The openfga-cache / abac-cache users MUST be invalidated
        on tuple write / policy change (E3.4). The cache client
        publishes `gp.cache.invalidate` events to Kafka on key
        delete.
{{- end }}
{{- if eq $name "observability" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-contract-stub
  namespace: gp-observability
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: observability
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Observability contract (E2.10).
    label_allowlist:
      - tenant_pseudo_id
      - user_pseudo_id
      - service
      - version
      - environment
      - trace_id
    label_denylist:
      - tenant_id
      - user_id
      - email
      - raw_dna
{{- end }}
{{- if eq $name "featureFlags" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: featureflags-contract-stub
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Flagsmith + OpenFeature contract (E2.8).
    responsibilities:
      - Feature flag taxonomy owned by Flagsmith admin UI / GitOps
      - OpenFeature SDK safe default when Flagsmith is unreachable
      - 5 environments (development / staging / production / onprem / audit)
      - Per-environment RBAC (Org Admin / Environment Admin / Environment User / Audit Viewer)
      - Audit log of every flag create / update / delete / evaluate
      - Evaluation context scoped by tenant_pseudo_id (no raw UUID)
      - Bootstrap Job on every helm upgrade (idempotent)
      - Byte-identity mirror of source-of-truth files
    environments:
      - development   # local Docker Compose stack
      - staging       # SaaS pre-production
      - production    # SaaS production
      - onprem        # customer-managed cluster
      - audit         # read-only snapshot for DPO + privacy team
    legal_gate_flags:  # privacy-and-legal-gate.md §12
      - legal.data_residency.allowlist
      - legal.public_sharing.enabled
      - legal.dna.enabled
      - legal.media_upload.enabled
      - legal.gedcom_import.enabled
      - legal.cross_region_transfer.enabled
      - legal.parsers.restricted
      - legal.flag_bypass_allowlist
    required_flag_columns:
      - key
      - type
      - safeDefault
      - owner
      - whenTrue
      - whenFalse
      - expiresOn
      - audit
      - scope
      - legalGate
      - dataClass
    allowed_flag_types:
      - boolean
      - string
      - integer
      - float
      - json
    forbidden_flag_key_patterns:
      - skip.*auth
      - skip.*openfga
      - skip.*abac
      - skip.*consent
      - skip.*audit
      - bypass.*auth
      - bypass.*consent
      - disable.*audit
      - disable.*encryption
      - no.*redact
      - raw.*dna
      - raw.*pii
    safe_default_posture:
      typeFallbacks:
        boolean: false
        string: ""
        integer: 0
        float: 0.0
        json: "{}"
      evaluationTimeoutMs: 200
      perEvaluationCacheSeconds: 30
      forbiddenAttributes:
        - tenant_id
        - user_id
        - email
        - raw_dna
      requiredAttributes:
        - tenant_pseudo_id
        - user_pseudo_id
    forbidden:
      - using a flag to skip OpenFGA authorization check
      - using a flag to skip ABAC redaction
      - using a flag to skip consent ledger entry
      - using a flag to skip audit logging
      - setting a flag from application code (setFlag / setVariant)
      - reading a raw Flagsmith HTTP response (bypasses cache)
      - reading a flag without a typed default
      - per-tenant Flagsmith environment (segment override only)
      - business authorization (living / DNA / consent) — service-owned
    notes:
      - Source-of-truth: platform/featureflags/{flagsmith-server,environments,flag-taxonomy,safe-defaults,sdk-config}.yaml.
      - Mirror: platform/helm/genealogy-platform/files/featureflags/*.yaml.
      - Bootstrap Job: templates/components/featureflags/bootstrap-job.yaml.
        Runs on every helm upgrade (pre-install,pre-upgrade hook).
      - Domain code binds to com.genealogy.platform.featureflags.FeatureFlagClient (Java)
        and @openfeature/js-sdk (Node.js / Next.js PWA). The Spring Boot starter
        `libs/platform-spring-boot-starter` installs NoOpProvider as the safe default;
        the Flagsmith provider is wired by E2.8 via the
        `platform.openfeature.provider=flagsmith` property.
      - Evaluation MUST be scoped by tenant_pseudo_id; the ABAC layer (E3.4)
        verifies the pseudo-id against the BFF-issued trusted context.
      - The audit environment is read-only — flag create / update / delete are
        blocked via Flagsmith RBAC. DPO + privacy team use this snapshot.
{{- end }}
{{- if eq $name "gitops" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-contract-stub
  namespace: gp-argocd
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: gitops
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Argo CD + Argo Rollouts contract (E2.9).
    responsibilities:
      - GitOps reconciliation (Application set + drift detection 180s)
      - Progressive delivery (canary + blue-green) via Argo Rollouts
      - AppProject RBAC with four-eyes principle (developer / config-reviewer / release-approver / platform-admin)
      - Promotion pipeline dev → staging → production with release-approver + MFA gate
      - Source-repo allowlist + destination-namespace allowlist per AppProject
      - Audit log + notifications to OTel Collector
      - TLS 1.2 minimum; anonymous access FORBIDDEN; Keycloak OIDC SSO
      - Byte-identity mirror of source-of-truth files
    app_projects:
      - name: genealogy-platform-prod
        source_repos:
          - https://github.com/genealogy/platform-manifests
          - https://github.com/genealogy/platform-helm-charts
          - https://github.com/genealogy/service-charts
        destinations:
          - gp-edge / gp-bff / gp-services / gp-workers
        roles:
          - developer          # code PR + non-prod sync
          - config-reviewer    # config change PR review
          - release-approver   # production / staging promotion (MFA required)
          - platform-admin     # AppProject / RBAC bootstrap + break-glass
      - name: genealogy-platform-nonprod
        source_repos:
          - https://github.com/genealogy/platform-manifests
          - https://github.com/genealogy/platform-helm-charts
          - https://github.com/genealogy/service-charts
        destinations:
          - gp-edge-staging / gp-bff-staging / gp-services-staging / gp-workers-staging
      - name: genealogy-platform-platform
        source_repos:
          - https://github.com/genealogy/platform-manifests
          - https://github.com/genealogy/platform-helm-charts
        destinations:
          - gp-argocd / gp-platform / gp-observability / gp-data
    promotion_pipeline:
      dev:
        cluster: in-cluster
        autoPromote: true
        requiresApproval: false
      staging:
        cluster: in-cluster
        autoPromote: false
        requiresApproval: true
        approverRole: config-reviewer
      production:
        cluster: in-cluster
        autoPromote: false
        requiresApproval: true
        approverRole: release-approver
        requiresMfa: true
    rollout_strategy:
      canary:
        maxSurge: "25%"
        maxUnavailable: 0
        traffic_routing: istio
        steps:
          - setWeight: 5
          - pause: 2m
          - analysis: [error-rate, latency-p95]
          - setWeight: 15
          - pause: 3m
          - analysis: [error-rate, latency-p95, success-rate]
          - setWeight: 35
          - pause: 4m
          - analysis: [error-rate, latency-p95, success-rate, saturation]
          - setWeight: 60
          - pause: 6m
          - setWeight: 85
          - pause: 8m
          - setWeight: 100
      analysis_templates:
        - error-rate      # canary 5xx ratio < 1 %
        - latency-p95     # canary p95 < 800 ms
        - success-rate    # canary 2xx ratio > 99.5 %
        - saturation      # canary CPU < 80 %
      service_classes:
        - stateless-api           # canary
        - bff                     # canary
        - domain-event-consumer   # blue-green
        - async-worker            # blue-green
    sync_windows:
      allow:
        - id: dev-auto-sync
          schedule: 24/7
          applications: ["*-dev"]
        - id: staging-window
          schedule: weekdays 06:00-20:00 UTC
          applications: ["*-staging"]
          approverRole: config-reviewer
        - id: production-window
          schedule: weekdays 08:00-18:00 UTC
          applications: ["*-prod"]
          approverRole: release-approver
          requiresMfa: true
      deny:
        - id: weekend-blackout
          schedule: Sat 00:00-24:00 UTC
          applications: ["*-prod"]
          manualSync: true
          approverRole: release-approver
          requiresMfa: true
        - id: change-freeze-q4
          schedule: Dec 20 - Jan 20
          applications: ["*-prod"]
          ticketRequired: true
          ticketPattern: "^CHG-[0-9]{6}$"
        - id: legal-hold-window
          schedule: manual until rescinded
          applications: ["*-prod"]
          manualSync: false
          approverRole: platform-admin
        - id: dna-blackout
          schedule: 24/7
          applications: ["dna-*"]
          manualSync: true
          approverRole: release-approver
          requiresMfa: true
    reconciliation:
      resyncSeconds: 180
      prune: true
      selfHeal: true
      serverSideApply: true
    forbidden:
      - using a flag to skip OpenFGA authorization check (E2.8 contract)
      - using a flag to skip ABAC redaction (E2.8 contract)
      - using a flag to skip consent ledger entry (E2.8 contract)
      - using a flag to skip audit logging (E2.8 contract)
      - production sync without release-approver + MFA
      - tenant-scoped canary weight (no per-tenant targeting)
      - setting `setWeight: 100` without analysis gate
      - maxSurge: 0 on stateless-api canary
      - bypass of `gitops.rbacStrict` (forbidden in production)
      - literal admin password / signing key / OAuth client secret / Redis password
      - business authorization (living / DNA / consent) — service-owned
    notes:
      - Source-of-truth: platform/argo/{argocd-server,projects,applications,rollout-strategy,sync-windows}.yaml.
      - Mirror: platform/helm/genealogy-platform/files/argo/*.yaml.
      - Bootstrap Job: templates/components/argo/bootstrap-job.yaml.
        Runs on every helm upgrade (pre-install,pre-upgrade hook).
        Reconciles AppProject set + canonical Application set + Rollout strategy + AnalysisTemplate + sync windows.
      - The Rollouts controller queries Prometheus directly for
        AnalysisTemplate metrics (no in-memory state).
      - Drift detection (180s resync) is the canonical source of truth;
        a PR review is required to re-sync after a manual drift.
      - Manual sync override is always logged to OTel audit sink with
        `actor_pseudo_id` + `window_id` + `reason` + `ticket` fields.
      - `dna-blackout` window enforces E10.2 isolation: a release-approver
        + MFA human action is required to roll any DNA workload.
{{- if eq $name "keycloak" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-contract-stub
  namespace: gp-edge
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: keycloak
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Keycloak identity provider contract (E3.1).
    responsibilities:
      - credential storage + login + MFA + recovery + federation
      - OIDC Authorization Code + PKCE (R2 §R2.1)
      - realm / client / flow / identity-provider config-as-code
      - per-realm signing key + client-secret rotation (E3.1 §5)
      - OIDC issuer / JWKS endpoint for Kong + BFF + Grafana SSO
      - audit event sink to platform OTel Collector (actor_pseudo_id)
      - mapping Keycloak subject -> tenant membership via `tenant-service`
        (E3.2 — SubjectProvisioned event)
    realm_topology:
      default: realm-per-tenant-group
      opt-in: realm-per-tenant
      saas_shared_realm: genealogy-shared
      dedicated_realm_requires:
        - justification
        - owner
        - isolationPolicy
    authentication:
      grant_types_allowed:
        - authorization_code
        - client_credentials   # BFF + public-api + kong-broker only
        - refresh_token
      grant_types_forbidden:
        - password              # Resource Owner Password FORBIDDEN (R2 §R2.1)
        - implicit              # OIDC 1.0 §3.1.2 — FORBIDDEN
        - urn:ietf:params:oauth:grant-type:token-exchange   # reserved E10.3
      pkce:
        code_challenge_method: S256
        required_for_public_clients: true
      mfa:
        conditional_flow: mfa
        authenticators:
          - webauthn
          - otp
        step_up_max_age_seconds: 300
      token_lifetimes:
        access_token_seconds: 1800
        sso_session_idle_seconds: 28800
        sso_session_max_seconds: 43200
        offline_session_idle_seconds: 2592000
      brute_force:
        strategy: MULTIPLE
        failure_factor: 5
        max_wait_seconds: 900
      password_policy:
        - length(12)
        - upperCredential(1)
        - lowerCredential(1)
        - digit(1)
        - specialCharacter(1)
        - notUsername
        - notEmail
        - passwordHistory(12)
        - hashIterations(10000)
        - hashAlgorithm(pbkdf2-sha512)
    mandatory_clients:
      - web-app            # public — Authorization Code + PKCE
      - web-bff            # confidential — Authorization Code + PKCE
      - public-api         # confidential — client_credentials + scopes
      - kong-oidc-broker   # confidential — client_credentials + JWT validator
      - grafana-sso        # confidential — Authorization Code + PKCE
    federation:
      preferred_protocol: oidc
      deprecated_protocols:
        - saml
      oidc_providers:
        - google-workspace
        - microsoft-entra
        - okta
        - auth0
        - pingfederate
      saml_providers:
        - okta-saml
        - pingfederate-saml
      clock_skew_tolerance_seconds: 30
    allowed_federated_attributes:
      - email
      - email_verified
      - given_name
      - family_name
      - preferred_username
      - groups
      - tenant_groups
    forbidden_federated_attributes:
      - tenant_id
      - user_id
      - raw_dna
      - raw_pii
      - phone_number
      - address
    key_rotation:
      realm_signing_key:
        algorithm: RS256
        key_size: 4096
        rotation_days: 90
        key_overlap_hours: 48
      provider_keys_jwks_refresh_minutes: 60
      provider_keys_jwks_cache_ttl_minutes: 360
      client_secret_rotation_days: 30
      client_secret_overlap_hours: 24
      client_secret_rotation_excludes:
        - kong-oidc-broker
        - grafana-sso
      database_password_rotation_days: 30
      kms_backend:
        saas: awskms
        onprem: vault-transit
        dev: vault-transit
    jwks:
      path: /realms/genealogy-shared/protocol/openid-connect/certs
      algorithms_allowed:
        - RS256
        - PS256
        - ES256
      algorithms_forbidden:
        - none
        - HS256
        - HS512
    event_listener:
      sink: otel-collector:4318/v1/audit
      persist_to_db: false
      events:
        - LOGIN
        - LOGIN_ERROR
        - LOGOUT
        - REGISTER
        - REGISTER_ERROR
        - UPDATE_EMAIL
        - UPDATE_PASSWORD
        - SEND_RESET_PASSWORD
        - RESET_PASSWORD
        - VERIFY_EMAIL
        - UPDATE_PROFILE
        - GRANT_ROLE
        - REVOKE_ROLE
        - IMPERSONATE
        - IMPERSONATE_ERROR
        - CLIENT_LOGIN
        - CLIENT_REGISTER
        - FEDERATED_IDENTITY_LINK
        - REMOVE_FEDERATED_IDENTITY
        - DELETE_ACCOUNT
    forbidden:
      - storing password / refresh token / authorization code outside Keycloak
      - inlining client_secret / private key / JWKS value in any YAML
      - custom SPI providers (ADR-E0.5-05 §Decision)
      - SAML federation without contractual justification
      - dedicated realm block without `justification` + `owner`
      - bearer-only client (R2 §R2.1)
      - Implicit grant / Resource Owner Password grant
      - HS256 / HS512 signing by Keycloak server
      - exposing `tenant_id` / `user_id` / `raw_dna` / `raw_pii` in OIDC claims
      - audit event sink other than the platform OTel Collector
      - business authorization (living / DNA / consent) — service-owned
    notes:
      - Source-of-truth: platform/keycloak/{realm-strategy,realm-export,
        client-configs,federation,key-rotation}.yaml.
      - Mirror: platform/helm/genealogy-platform/files/keycloak/*.yaml.
      - Bootstrap Job: templates/components/keycloak/bootstrap-job.yaml.
        Runs on every `helm upgrade` (pre-install,pre-upgrade hook).
        Idempotent — every PUT/POST is conditional on the resource not existing.
      - Domain authorization is at the service via OpenFGA + ABAC;
        Keycloak only decides identity, group membership + MFA posture.
      - Per `design.md` §4.2 / §13 the BFF trusts the Keycloak
        signed JWT; tenant_id is pseudonymised into
        `tenant_pseudo_id` at the OIDC protocol mapper
        (`client-configs.yaml`).
      - The `kong-oidc-broker` client is reserved for Kong
        JWT validation (E2.2). Domain authorization stays in
        the destination service per `design.md` §4.1.
      - Step-up flow is bound to admin actions (E16) + DNA
        consent (E10.3). The flow TTL is 5 minutes max.
      - Realm signing keys are stored in the platform KMS
        (SaaS = AWS KMS, on-prem = Vault transit).
{{- end }}
{{- if eq $name "grafana" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-contract-stub
  namespace: gp-observability
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: grafana
    gp.genealogy/contract-only: "true"
data:
  contract: |
    # Grafana OSS stack contract (E2.10).
    responsibilities:
      - OpenTelemetry Collector pipeline (otlp-grpc / otlp-http / prometheus / otlp-audit)
      - Prometheus scrape + recording rules + SLO burn-rate alerts
      - Loki structured log ingestion + retention + compactor
      - Tempo OTLP receiver + ingester + storage backend
      - Grafana dashboards + datasources + Keycloak OIDC SSO + 2FA
      - Audit log to OTel Collector (actor_pseudo_id only)
      - Reuse upstream `otel/opentelemetry-collector-contrib` / `prom/prometheus` /
        `grafana/loki` / `grafana/tempo` / `grafana/grafana` (ADR-E0.5-01)
      - Byte-identity mirror of source-of-truth files
    pipelines:
      traces:
        receivers: [otlp/grpc, otlp/http]
        processors: [memory_limiter, resourcedetection, k8sattributes,
                     attributes/tenant-pseudonym, transform, redaction, batch]
        exporters: [tempo]
      metrics:
        receivers: [otlp/grpc, otlp/http, prometheus]
        processors: [memory_limiter, resourcedetection, k8sattributes,
                     attributes/tenant-pseudonym, transform, batch]
        exporters: [prometheus]
      logs:
        receivers: [otlp/grpc, otlp/http]
        processors: [memory_limiter, resourcedetection, k8sattributes,
                     attributes/tenant-pseudonym, transform, redaction,
                     filter/logs, batch]
        exporters: [loki]
      audit:
        receivers: [otlp/audit]
        processors: [memory_limiter, resourcedetection, k8sattributes,
                     attributes/tenant-pseudonym, transform, redaction,
                     batch, resource/audit]
        exporters: [otlp/audit]
    redaction_rules:
      - ssn
      - passport
      - driver-license
      - email
      - phone
      - ipv4
      - jwt
      - raw-dna-marker
      - authorization-header
    mandatory_stream_labels:
      - service.name
      - service.namespace
      - deployment.environment
      - tenant_pseudo_id
      - actor_pseudo_id
      - trace_id
    deny_labels:
      - tenant_id
      - user_id
      - email
      - oidc_subject
      - raw_dna
      - raw_pii
    recording_rules:
      - red_rate_api
      - red_errors_api
      - kong_latency
      - kong_status
      - consumer_lag
      - outbox_age
      - workflow_failure
      - dq_size
      - redaction_coverage
    slo_alerts:
      - api-availability
      - canary-success
      - consumer-lag
      - pii-redaction-coverage
    mandatory_dashboards:
      - api-overview
      - kong
      - kafka
      - temporal
      - openfga
      - istio
      - vault
      - database
      - workload
    retention:
      prometheus: 30d    # saas: 90d; onprem: 30d; dev: 7d
      loki: 30d          # saas: 90d; onprem: 30d; dev: 7d
      tempo: 14d         # saas: 30d; onprem: 14d; dev: 3d
    forbidden:
      - emitting raw `tenant_id` / `user_id` / `email` / `oidc_subject` / `raw_dna` / `raw_pii` labels
      - literal admin password / OAuth client secret / bearer token / pepper / API key
      - bypassing the OTel Collector redaction processor
      - Prometheus / Loki / Tempo storage without retention enforcement
      - Grafana anonymous access (Keycloak OIDC SSO only)
      - Grafana without 2FA conditional flow
      - audit log without `actor_pseudo_id` (no raw email / oidc_subject)
      - SLO alert without burn-rate annotation + dashboard link
      - tenant-scoped Loki multi-tenancy (single-tenant cluster by design)
    notes:
      - Source-of-truth: platform/grafana/{otel-collector,prometheus,loki,tempo,dashboards,grafana}.yaml.
      - Mirror: platform/helm/genealogy-platform/files/grafana/*.yaml.
      - Reuses upstream `otel/opentelemetry-collector-contrib:0.110.0` /
        `prom/prometheus:v2.55.0` / `grafana/loki:3.4.0` /
        `grafana/tempo:2.7.0` / `grafana/grafana:11.3.0`
        (ADR-E0.5-01 latest stable baseline).
      - Tempo block storage: SaaS + on-prem use the
        `genea-tempo-blocks` S3 bucket (IRSA / customer Vault
        credentials); dev uses local filesystem.
      - PII / DNA redaction is enforced at the OTel Collector
        `redaction` processor; Loki + Tempo + Prometheus deny
        labels are a second-line defense.
      - Every Grafana dashboard view + every Prometheus / Loki /
        Tempo query publishes a `dashboard_viewed` /
        `query_executed` audit event to OTel Collector with
        `actor_pseudo_id` only.
{{- end }}
{{- end }}
