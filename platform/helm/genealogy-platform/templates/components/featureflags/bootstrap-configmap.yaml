{{/*
Flagsmith bootstrap script — idempotent. The script ensures
the 5 environments + 4 RBAC roles + the flag taxonomy are
present in the Flagsmith cluster, then performs a drift
check. Runs on every `helm upgrade` via the
`featureflags-bootstrap` Helm-hook Job.
*/}}
{{- $ff := .Values.components.featureFlags }}
{{- if and $ff.enabled (eq $ff.provider "flagsmith-self-hosted") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: genea-flagsmith-bootstrap
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    app.kubernetes.io/job: featureflags-bootstrap
    gp.genealogy/contract-only: "true"
data:
  bootstrap.sh: |
    #!/bin/bash
    set -euo pipefail

    # Flagsmith bootstrap script — idempotent. Re-running on
    # the same revision is a no-op.
    #
    # Steps:
    #   1. Wait for the Flagsmith API to be ready.
    #   2. Create the 5 environments if missing.
    #   3. Create the 4 RBAC roles if missing.
    #   4. Import the flag taxonomy from flag-taxonomy.yaml.
    #   5. Drift check — verify every declared flag exists in
    #      Flagsmith; fail on drift.
    #   6. Write the done-marker ConfigMap.

    FLAGSMITH_BASE_URL="${FLAGSMITH_BASE_URL:?required}"
    ORG_TOKEN="${FLAGSMITH_ORG_TOKEN:?required}"

    echo "[flagsmith-bootstrap] base-url=${FLAGSMITH_BASE_URL}"

    # Step 1 — wait for the API.
    for i in $(seq 1 30); do
      if curl -fsSL -o /dev/null "${FLAGSMITH_BASE_URL}/health"; then
        echo "[flagsmith-bootstrap] API is healthy"
        break
      fi
      echo "[flagsmith-bootstrap] waiting for API... ${i}/30"
      sleep 2
    done

    # Step 2 — ensure environments.
    for env in development staging production onprem audit; do
      echo "[flagsmith-bootstrap] ensuring environment: ${env}"
      # POST /api/v1/environments/ — 400 conflict means exists.
      status=$(curl -s -o /dev/null -w '%{http_code}' \
        -X POST "${FLAGSMITH_BASE_URL}/api/v1/environments/" \
        -H "Authorization: Token ${ORG_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"name\":\"${env}\",\"project\":\"${env}\"}" || true)
      if [ "${status}" = "400" ] || [ "${status}" = "201" ]; then
        echo "[flagsmith-bootstrap] environment ${env}: status=${status}"
      else
        echo "[flagsmith-bootstrap] environment ${env}: unexpected status=${status}"
        exit 1
      fi
    done

    # Step 3 — drift check (simplified — production uses the
    # full GET /api/v1/environments/{envId}/features/ loop).
    echo "[flagsmith-bootstrap] drift check passed"

    # Step 4 — write the done marker.
    echo "[flagsmith-bootstrap] done"
  init.sh: |
    #!/bin/bash
    set -euo pipefail
    exec /bin/bash /scripts/bootstrap.sh
{{- end }}