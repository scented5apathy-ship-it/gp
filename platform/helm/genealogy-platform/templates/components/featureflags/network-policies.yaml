{{/*
Flagsmith NetworkPolicy — default deny all Ingress + Egress;
allow the bootstrap Job + BFF + services + workers + PWA to
reach the API endpoint. Admin UI is reachable only from the
bastion VPN.
*/}}
{{- $ff := .Values.components.featureFlags }}
{{- if and $ff.enabled (eq $ff.provider "flagsmith-self-hosted") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flagsmith-default-deny
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    gp.genealogy/contract-only: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: genealogy-platform
      app.kubernetes.io/component: featureflags
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flagsmith-allow-clients
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    gp.genealogy/contract-only: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: genealogy-platform
      app.kubernetes.io/component: featureflags
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-bff
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-services
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-workers
      ports:
        - protocol: TCP
          port: 8000
    # Operator admin UI — bastion VPN only.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres backing store (gp-data namespace).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-data
      ports:
        - protocol: TCP
          port: 5432
    # OTel Collector (audit log).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp-observability
      ports:
        - protocol: TCP
          port: 4318
{{- end }}