{{/*
Flagsmith Secrets — placeholder objects consumed by External
Secrets Operator. The chart never inlines a literal
credential. ESO syncs the actual `DATABASE_URL` + `SECRET_KEY`
from Vault at runtime. Per-environment API tokens
(`flagsmith-api-token-*`) are also ESO-managed.

Placeholder Secrets are shipped so the Deployment + the
`featureflags-bootstrap` Helm-hook Job can be rendered
before ESO is online. ESO replaces the values within ~30
seconds of pod start.
*/}}
{{- $ff := .Values.components.featureFlags }}
{{- if and $ff.enabled (eq $ff.provider "flagsmith-self-hosted") }}
{{- $ns := "gp-platform" }}
{{- range $env := list "development" "staging" "production" "onprem" "audit" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: flagsmith-api-token-{{ $env }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    gp.genealogy/contract-only: "true"
  annotations:
    "external-secrets.io/external-secret": flagsmith-api-token-{{ $env }}
type: Opaque
stringData:
  # Placeholder — replaced by ESO.
  apiToken: "REPLACE_ME"
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: flagsmith-postgres-credentials
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    gp.genealogy/contract-only: "true"
  annotations:
    "external-secrets.io/external-secret": flagsmith-postgres-credentials
type: Opaque
stringData:
  # Placeholder — replaced by ESO.
  url: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: flagsmith-jwt-secret
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    gp.genealogy/contract-only: "true"
  annotations:
    "external-secrets.io/external-secret": flagsmith-jwt-secret
type: Opaque
stringData:
  # Placeholder — replaced by ESO.
  secret: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: flagsmith-server-tls
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    gp.genealogy/contract-only: "true"
  annotations:
    cert-manager.io/issuer-name: selfsigned-ca
    cert-manager.io/common-name: flagsmith.gp-platform.svc.cluster.local
    cert-manager.io/duration: 8760h
type: kubernetes.io/tls
stringData:
  tls.crt: "REPLACE_ME"
  tls.key: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: feature-flag-pseudonym-pepper
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    gp.genealogy/contract-only: "true"
  annotations:
    "external-secrets.io/external-secret": feature-flag-pseudonym-pepper
type: Opaque
stringData:
  # Placeholder — replaced by ESO. Used by the
  # `SafeFeatureClient` to compute `tenant_pseudo_id` /
  # `user_pseudo_id` from the BFF-issued trusted context.
  pepper: "REPLACE_ME"
{{- end }}