{{/*
Flagsmith + bootstrap ServiceAccounts.

The chart ships the Flagsmith pod's ServiceAccount + the
bootstrap Job's ServiceAccount. Domain pods (BFF, services,
workers, PWA) retain their own ServiceAccounts; the
OpenFeature SDK reads from the cluster-internal Flagsmith
Service via the workload's own identity.
*/}}
{{- $ff := .Values.components.featureFlags }}
{{- if and $ff.enabled (eq $ff.provider "flagsmith-self-hosted") }}
{{- $ns := "gp-platform" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flagsmith
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    gp.genealogy/contract-only: "true"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: featureflags-bootstrap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    app.kubernetes.io/job: featureflags-bootstrap
    gp.genealogy/contract-only: "true"
automountServiceAccountToken: false
{{- end }}