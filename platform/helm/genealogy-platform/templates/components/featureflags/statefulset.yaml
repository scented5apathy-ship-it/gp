{{/*
Flagsmith server — Deployment running the upstream
`flagsmith/flagsmith` container. Per ADR-E0.5-01 the pinned
image is `flagsmith/flagsmith:2.139.4`. The chart renders
Flagsmith whenever `components.featureFlags.provider:
flagsmith-self-hosted` is set; SaaS uses
`provider: flagsmith-saas` and bypasses the server workload.

Per `tasks.md` E2.8 + `design.md` §1 + §13 + `privacy-and-legal-gate.md`
§12 the Flagsmith cluster carries:
  - the API on port 8000 (internal Service)
  - the admin UI on port 8080 (internal Service only)
  - Postgres backing store (in-memory forbidden in production)
  - 5 environments + 4 RBAC roles provisioned by the bootstrap Job
  - JWT auth + per-environment API tokens
  - the audit log to the OTel Collector (E2.10)
  - Prometheus scrape on `/api/v1/flagsmith/usage`
  - Replica count per env (3 SaaS / 2 on-prem / 1 dev)
*/}}
{{- $ff := .Values.components.featureFlags }}
{{- if and $ff.enabled (eq $ff.provider "flagsmith-self-hosted") }}
{{- $ns := "gp-platform" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagsmith
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: featureflags
    app.kubernetes.io/version: {{ $ff.image.tag | quote }}
    gp.genealogy/contract-only: "true"
spec:
  replicas: {{ $ff.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/part-of: genealogy-platform
      app.kubernetes.io/component: featureflags
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: genealogy-platform
        app.kubernetes.io/component: featureflags
        app.kubernetes.io/version: {{ $ff.image.tag | quote }}
        gp.genealogy/contract-only: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/v1/flagsmith/usage"
    spec:
      serviceAccountName: flagsmith
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: flagsmith
          image: {{ include "genealogy-platform.image" (dict "image" $ff.image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
            - name: admin
              containerPort: 8080
              protocol: TCP
          env:
            # Backing store — Postgres is REQUIRED. The
            # `DATABASE_URL` value is resolved at runtime by ESO
            # from the `flagsmith-postgres-credentials` Secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flagsmith-postgres-credentials
                  key: url
            # JWT secret — required for admin UI auth. The value
            # is resolved at runtime by ESO from the
            # `flagsmith-jwt-secret` Secret.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flagsmith-jwt-secret
                  key: secret
            # Anonymous access — FORBIDDEN. The chart never
            # starts the server with `ALLOW_ANONYMOUS=true`.
            - name: ALLOW_ANONYMOUS
              value: "false"
            # Environment — `production` (deployment cluster)
            - name: ENV
              value: production
            # CORS allowlist — restricted to platform origins.
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," $ff.corsAllowedOrigins | quote }}
            # TLS minimum — TLS 1.2 minimum, TLS 1.3 preferred.
            - name: TLS_MIN_VERSION
              value: {{ $ff.tlsMinVersion | quote }}
            # Audit log — OTel Collector endpoint (E2.10).
            - name: AUDIT_LOG_ENDPOINT
              value: {{ $ff.auditEndpoint | quote }}
            # Cache — 5s in-process evaluation cache.
            - name: FLAG_FETCH_CACHE_TTL_SECONDS
              value: {{ $ff.cache.ttlSeconds | quote }}
            # Rate limit — flag evaluation endpoint is rate
            # limited at 100 req/s per identity.
            - name: FLAG_FETCH_RATE_LIMIT
              value: {{ $ff.rateLimit.flagFetchPerSecond | quote }}
            # Cluster name — disambiguates multi-cluster
            # topologies (ADR-E0.5-03 supersession).
            - name: FLAGSMITH_CLUSTER_NAME
              value: {{ .Values.global.region | default "ap-southeast-1" | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $ff.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: genea-flagsmith-server-config
            items:
              - key: config.yaml
                path: config.yaml
                mode: 0644
{{- end }}