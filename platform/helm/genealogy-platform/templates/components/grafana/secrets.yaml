{{/*
E2.10 observability Secrets — three ESO-managed Secrets.
The literal values are NEVER in the repo; the operator
renders them at runtime from Vault.
*/}}
{{- $obs := .Values.components.observability }}
{{- if $obs.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: genea-grafana-admin
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: grafana
    gp.genealogy/secret-source: external-secrets
  annotations:
    # ESO reconciles the literal value from Vault path
    # `secret/<env>/data/grafana/admin`.
    external-secrets.io/cluster-secret-store: {{ $obs.secretRefs.clusterSecretStore | default "vault-backend" }}
    external-secrets.io/remote-ref: |
      key: {{ $obs.secretRefs.grafanaAdminVaultPath | default "secret/dev/data/grafana/admin" }}
      property: password
type: Opaque
data:
  # Placeholder; ESO overwrites the literal at runtime. The
  # base64 of `REPLACE_VIA_ESO` is intentional and is rejected
  # by the deep linter's `no literal credential` check.
  password: {{ "REPLACE_VIA_ESO" | b64enc | quote }}
  user: {{ "REPLACE_VIA_ESO" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: genea-otel-collector-bearertoken
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: otel-collector
    gp.genealogy/secret-source: external-secrets
  annotations:
    external-secrets.io/cluster-secret-store: {{ $obs.secretRefs.clusterSecretStore | default "vault-backend" }}
    external-secrets.io/remote-ref: |
      key: {{ $obs.secretRefs.otelBearerVaultPath | default "secret/dev/data/otel-collector/bearertoken" }}
      property: token
type: Opaque
data:
  token: {{ "REPLACE_VIA_ESO" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: genea-grafana-keycloak-client-secret
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: grafana
    gp.genealogy/secret-source: external-secrets
  annotations:
    external-secrets.io/cluster-secret-store: {{ $obs.secretRefs.clusterSecretStore | default "vault-backend" }}
    external-secrets.io/remote-ref: |
      key: {{ $obs.secretRefs.grafanaKeycloakClientVaultPath | default "secret/dev/data/keycloak/grafana-client" }}
      property: client-secret
type: Opaque
data:
  client-secret: {{ "REPLACE_VIA_ESO" | b64enc | quote }}
{{- end }}