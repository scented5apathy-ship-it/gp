{{/*
E2.10 observability ServiceAccounts.
*/}}
{{- $obs := .Values.components.observability }}
{{- if $obs.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genea-otel-collector
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: otel-collector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genea-prometheus
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genea-loki
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: loki
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genea-tempo
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: tempo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genea-grafana
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: grafana
{{- end }}