{{/*
E2.10 observability Services.
*/}}
{{- $obs := .Values.components.observability }}
{{- if $obs.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: otel-collector
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: otlp-audit
      port: 4319
      targetPort: 4319
    - name: prometheus-exporter
      port: 9464
      targetPort: 9464
    - name: health
      port: 13133
      targetPort: 13133
  selector:
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: genealogy-platform
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: prometheus
    gp.genealogy/scrape: "true"
spec:
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: genealogy-platform
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: loki
spec:
  ports:
    - name: http
      port: 3100
      targetPort: 3100
    - name: grpc
      port: 9096
      targetPort: 9096
  selector:
    app.kubernetes.io/component: loki
    app.kubernetes.io/part-of: genealogy-platform
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: tempo
spec:
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app.kubernetes.io/component: tempo
    app.kubernetes.io/part-of: genealogy-platform
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.global.namespaceObservability | default "gp-observability" }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: grafana
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: genealogy-platform
{{- end }}