{{/*
ServiceAccount + RBAC for the istio-bootstrap job. The job calls
`istioctl install` / `kubectl apply` against the four ConfigMaps
to apply MeshConfig + PeerAuthentication + AuthorizationPolicy
+ Telemetry manifests. The job's ServiceAccount is restricted
to the `gp-platform` namespace; it has cluster-wide read on
mesh CRDs and write on the four mesh CRD kinds.

Per `design.md` §13 the bootstrap is the only path to apply
mesh config — operators NEVER `kubectl apply` against the
cluster directly.
*/}}
{{- $istio := .Values.components.istio }}
{{- if $istio.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-bootstrap
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: istio
    app.kubernetes.io/version: {{ $istio.version | default "1.23" | quote }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: istio-bootstrap
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: istio
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: istio-bootstrap
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: istio
subjects:
  - kind: ServiceAccount
    name: istio-bootstrap
    namespace: gp-platform
roleRef:
  kind: Role
  name: istio-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: istio-bootstrap
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: istio
rules:
  - apiGroups: ["networking.istio.io"]
    resources:
      - "destinationrules"
      - "gateways"
      - "serviceentries"
      - "sidecars"
      - "virtualservices"
      - "workloadentries"
      - "workloadgroups"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["security.istio.io"]
    resources:
      - "authorizationpolicies"
      - "peerauthentications"
      - "requestauthentications"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["telemetry.istio.io"]
    resources:
      - "telemetries"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["install.istio.io"]
    resources:
      - "istios"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: istio-bootstrap
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: istio
subjects:
  - kind: ServiceAccount
    name: istio-bootstrap
    namespace: gp-platform
roleRef:
  kind: ClusterRole
  name: istio-bootstrap
  apiGroup: rbac.authorization.k8s.io
{{- end }}
