{{/*
Telemetry ConfigMap — renders `platform/istio/telemetry.yaml`
as a ConfigMap. The chart applies the rendered manifest via
`istioctl apply` / `kubectl apply`. The retry / timeout /
tracing / metrics / accesslog policy is consumed by the
Spring Boot template (`libs/platform-spring-boot-starter`)
+ the OTel Collector (E2.10).
*/}}
{{- $istio := .Values.components.istio }}
{{- if $istio.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: genea-istio-telemetry
  namespace: gp-platform
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: istio
    app.kubernetes.io/version: {{ $istio.version | default "1.23" | quote }}
    gp.genealogy/contract-only: "true"
data:
  {{- (.Files.Get "files/istio/telemetry.yaml") | nindent 4 }}
{{- end }}
