{{/*
Kafka metrics ConfigMap (JMX exporter).

E2.3 SLI source for the alert rules in
`templates/components/observability/alerts.yaml`. The Kafka cluster
CR references this ConfigMap via `metricsConfig.valueFrom`.
*/}}
{{- $kafka := .Values.components.kafka }}
{{- if $kafka.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: genea-kafka-metrics
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: kafka
    gp.genealogy/contract-only: "true"
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value
        name: kafka_server_replica_manager_under_replicated_partitions
        type: GAUGE
      - pattern: kafka.server<type=ReplicaManager, name=OfflinePartitionsCount><>Value
        name: kafka_server_replica_manager_offline_partitions
        type: GAUGE
      - pattern: kafka.server<type=ReplicaManager, name=IsrShrinksPerSec><>Count
        name: kafka_server_replica_manager_isr_shrinks_total
        type: COUNTER
      - pattern: kafka.server<type=ReplicaManager, name=IsrExpandsPerSec><>Count
        name: kafka_server_replica_manager_isr_expands_total
        type: COUNTER
      - pattern: kafka.log<type=Log, name=Size, topic=(.+), partition=(.+)><>Value
        name: kafka_log_size_bytes
        type: GAUGE
        labels:
          topic: "$1"
          partition: "$2"
      - pattern: kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec, topic=(.+)><>Count
        name: kafka_server_broker_topic_metrics_messages_in_total
        type: COUNTER
        labels:
          topic: "$1"
      - pattern: kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec, topic=(.+)><>Count
        name: kafka_server_broker_topic_metrics_bytes_in_total
        type: COUNTER
        labels:
          topic: "$1"
      - pattern: kafka.server<type=ClientQuotaManager, name=(.+), clientId=(.+)><>Value
        name: kafka_server_client_quota_$1
        type: GAUGE
        labels:
          client_id: "$2"
{{- end }}
