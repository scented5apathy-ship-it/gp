{{/*
Keycloak ESO-managed Secrets — admin credentials + client secrets
+ SMTP credentials + signing keys. The chart never inlines a
literal credential; every value comes from External Secrets
Operator (Vault backend).

Per `tasks.md` E3.1 + `design.md` §13 + ADR-E0.5-06 the platform
must NEVER persist a secret outside KMS-backed storage. The
Secrets declared below are references — ESO creates the
actual `Secret` object from Vault on every sync.
*/}}
{{- $keycloak := .Values.components.keycloak }}
{{- if $keycloak.enabled }}
{{- $ref := $keycloak.secretRefs }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin-credentials
  namespace: gp-edge
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: keycloak
    gp.genealogy/contract-only: "true"
spec:
  secretStoreRef:
    name: {{ $ref.clusterSecretStore }}
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: keycloak-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-username
      remoteRef:
        key: {{ $ref.adminVaultPath | quote }}
        property: username
    - secretKey: admin-password
      remoteRef:
        key: {{ $ref.adminVaultPath | quote }}
        property: password
---
