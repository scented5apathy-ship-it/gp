{{/*
Keycloak ServiceAccounts — `keycloak` (server) + `keycloak-bootstrap`
(Job SA for the Admin REST API bootstrap).

Per `tasks.md` E3.1 the Keycloak server runs in the `gp-edge`
namespace so Kong + BFF + Grafana + Argo CD can reach it. The
`keycloak-bootstrap` Job SA is granted minimal RBAC so the
bootstrap Job can read the source-of-truth ConfigMaps + ESO
Secrets.
*/}}
{{- $keycloak := .Values.components.keycloak }}
{{- if $keycloak.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: gp-edge
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: keycloak
    gp.genealogy/contract-only: "true"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-bootstrap
  namespace: gp-edge
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: keycloak-bootstrap
    gp.genealogy/contract-only: "true"
automountServiceAccountToken: true
{{- end }}