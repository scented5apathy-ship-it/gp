{{/*
Kong Deployment — DB-less, edge-only gateway.

Per `design.md` §4.1 / `tasks.md` E2.2 this Deployment is the only
runtime for the gateway in production. Domain authorization is
forbidden here (enforced by the `kong-declarative-config` ConfigMap
plus `scripts/lint-kong-config.mjs`).

Probes use the standard `/healthz/{live,ready,startup}` contract from
`templates/_probes.tpl` — Kong ships `/status` for liveness and we
wrap it in a sidecar path. The `startupProbe` defers until the Kong
process has bound the listener.
*/}}
{{- $kong := .Values.components.kong }}
{{- if $kong.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: gp-edge
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: kong
    app.kubernetes.io/version: {{ $kong.image.tag }}
spec:
  replicas: {{ $kong.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/part-of: genealogy-platform
      app.kubernetes.io/component: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: genealogy-platform
        app.kubernetes.io/component: kong
        app.kubernetes.io/version: {{ $kong.image.tag }}
        gp.genealogy/contract-only: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9542"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kong
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false       # Kong OSS image ships with the `kong` user; the init container runs as root.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kong
          image: {{ include "genealogy-platform.image" (dict "image" $kong.image) }}
          imagePullPolicy: IfNotPresent
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: {{ $kong.declarativeConfig | quote }}
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_PROXY_LISTEN_SSL
              value: "0.0.0.0:8443 ssl"
            - name: KONG_ADMIN_LISTEN
              value: "127.0.0.1:8444 ssl"
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"
            - name: KONG_PLUGINS
              value: "bundled,{{ join "," $kong.enabledPlugins }}"
            - name: KONG_LOG_LEVEL
              value: {{ default "notice" $kong.logging.level | quote }}
            - name: KONG_LOG_FORMAT
              value: {{ default "json" $kong.logging.format | quote }}
            - name: KONG_SSL_CIPHER_SUITE
              value: "modern"
            - name: KONG_SSL_MIN_PROTOCOLS
              value: "tlsv1.3"
            - name: KONG_NGINX_HTTP2
              value: "on"
            - name: KONG_TRUSTED_IPS
              value: "0.0.0.0/0,::/0"
            - name: KONG_REAL_IP_HEADER
              value: "X-Forwarded-For"
            - name: KONG_ANONYMOUS_REPORTS
              value: "off"
            - name: KONG_CLUSTER_LISTEN
              value: "off"
          ports:
            - name: proxy
              containerPort: 8000
              protocol: TCP
            - name: proxy-ssl
              containerPort: 8443
              protocol: TCP
            - name: status
              containerPort: 8100
              protocol: TCP
            - name: metrics
              containerPort: 9542
              protocol: TCP
          {{- include "genealogy-platform.probes" . | nindent 10 }}
          # Kong's `/status` endpoint is the canonical liveness/ready
          # source — we wrap it under the contract path so the sidecar
          # (or the upstream Istio mesh) can call it without needing
          # Kong-specific knowledge.
          readinessProbe:
            httpGet:
              path: {{ .Values.baseline.probes.paths.ready }}
              port: status
            failureThreshold: {{ .Values.baseline.probes.readiness.failureThreshold }}
            periodSeconds: {{ .Values.baseline.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.baseline.probes.readiness.timeoutSeconds }}
            initialDelaySeconds: {{ .Values.baseline.probes.readiness.initialDelaySeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.baseline.probes.paths.live }}
              port: status
            failureThreshold: {{ .Values.baseline.probes.liveness.failureThreshold }}
            periodSeconds: {{ .Values.baseline.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.baseline.probes.liveness.timeoutSeconds }}
            initialDelaySeconds: {{ .Values.baseline.probes.liveness.initialDelaySeconds }}
          startupProbe:
            httpGet:
              path: {{ .Values.baseline.probes.paths.startup }}
              port: status
            failureThreshold: {{ .Values.baseline.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.baseline.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.baseline.probes.startup.timeoutSeconds }}
          resources:
            requests:
              cpu: {{ $kong.resources.requests.cpu | quote }}
              memory: {{ $kong.resources.requests.memory | quote }}
            limits:
              cpu: {{ $kong.resources.limits.cpu | quote }}
              memory: {{ $kong.resources.limits.memory | quote }}
          volumeMounts:
            - name: kong-declarative-config
              mountPath: /etc/kong
              readOnly: true
            - name: kong-tls
              mountPath: /etc/kong/tls
              readOnly: true
      volumes:
        - name: kong-declarative-config
          configMap:
            name: kong-declarative-config
        - name: kong-tls
          secret:
            secretName: kong-tls
            defaultMode: 0400
{{- end }}
