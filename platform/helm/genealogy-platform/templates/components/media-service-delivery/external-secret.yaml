{{/*
media delivery service ExternalSecret (E7.4).

Vault Agent Injector source of truth for the
media-service-delivery workload. The chart never embeds
secrets in values; the ExternalSecret references Vault
paths and the agent sidecar injects the resolved values
into the pod's filesystem at runtime.

Per `agent-execution.md` §4.4 + AGENTS.md §3: Vault
manages every secret; no secret / PII / DNA / webhook
payload may be committed to Git.
*/}}
{{- $svc := .Values.services.mediaDelivery }}
{{- if $svc.enabled }}
{{- $sa := $svc.serviceAccount }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: media-service-delivery-secrets
  namespace: gp-services
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: media-service-delivery
    gp.genealogy/contract-only: "true"
spec:
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: media-service-delivery-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: secret/data/media-service-delivery/database
        property: password
    - secretKey: kafka-password
      remoteRef:
        key: secret/data/media-service-delivery/kafka
        property: password
    - secretKey: openfga-token
      remoteRef:
        key: secret/data/media-service-delivery/openfga
        property: token
    - secretKey: audit-service-token
      remoteRef:
        key: secret/data/media-service-delivery/audit-service
        property: token
    - secretKey: s3-signing-key
      remoteRef:
        key: secret/data/media-service-delivery/s3
        property: signingKey
    - secretKey: minio-signing-key
      remoteRef:
        key: secret/data/media-service-delivery/minio
        property: signingKey
{{- end }}