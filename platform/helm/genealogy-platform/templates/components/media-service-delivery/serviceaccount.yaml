{{/*
media delivery service ServiceAccount (E7.4).

Tied to the Vault Agent Injector policy
`media-service-delivery` so the Vault sidecar can inject
the database / openfga / audit-service / s3 / minio
credentials at runtime.
*/}}
{{- $svc := .Values.services.mediaDelivery }}
{{- if and $svc.enabled $svc.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc.serviceAccount.name }}
  namespace: gp-services
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: media-service-delivery
    gp.genealogy/contract-only: "true"
  {{- with $svc.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}