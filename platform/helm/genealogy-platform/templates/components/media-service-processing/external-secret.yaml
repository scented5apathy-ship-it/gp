{{/*
media processing service ExternalSecret (E7.3).

Vault Agent Injector source of truth for the
media-service-processing workload. The chart never embeds
secrets in values; the ExternalSecret references Vault
paths and the agent sidecar injects the resolved values
into the pod's filesystem at runtime.

Per `agent-execution.md` §4.4 + AGENTS.md §3: Vault
manages every secret; no secret / PII / DNA / webhook
payload may be committed to Git.
*/}}
{{- $svc := .Values.services.mediaProcessing }}
{{- if $svc.enabled }}
{{- $sa := $svc.serviceAccount }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: media-service-processing-secrets
  namespace: gp-services
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: media-service-processing
    gp.genealogy/contract-only: "true"
spec:
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: media-service-processing-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: secret/data/media-service-processing/database
        property: password
    - secretKey: kafka-password
      remoteRef:
        key: secret/data/media-service-processing/kafka
        property: password
    - secretKey: openfga-token
      remoteRef:
        key: secret/data/media-service-processing/openfga
        property: token
    - secretKey: libvips-rest-url
      remoteRef:
        key: secret/data/media-service-processing/image-optimizer
        property: restUrl
    - secretKey: gotenberg-rest-url
      remoteRef:
        key: secret/data/media-service-processing/document-renderer
        property: restUrl
    - secretKey: ffmpeg-rest-url
      remoteRef:
        key: secret/data/media-service-processing/video-encoder
        property: restUrl
    - secretKey: tesseract-rest-url
      remoteRef:
        key: secret/data/media-service-processing/ocr-worker
        property: restUrl
{{- end }}