{{/*
media processing service Service (E7.3).

ClusterIP service exposing the Spring Boot Actuator HTTP
port (8080) to the rest of the platform via Istio mesh
routing. Domain authorization lives in the application;
this Service MUST NOT add a Kong route or Istio
AuthorizationPolicy.

The four processing workers (image-optimizer /
document-renderer / video-encoder / ocr-worker) live in
their own pods; the `media-service-processing` Deployment
schedules them and dispatches work via the Temporal
worker queue.
*/}}
{{- $svc := .Values.services.mediaProcessing }}
{{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: media-service-processing
  namespace: gp-services
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: media-service-processing
    gp.genealogy/contract-only: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: media-service-processing
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}