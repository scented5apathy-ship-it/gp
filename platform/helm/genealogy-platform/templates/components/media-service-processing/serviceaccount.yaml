{{/*
media processing service ServiceAccount (E7.3).

Vault Agent Injector anchor for the media-service-processing
workload. The annotations match the E2.6 contract; the role
name `media-service-processing` must match the policy in
`platform/vault/policies.yaml`.

Domain authorization lives in the application (OpenFGA +
ABAC) per design.md §5 / §13; this template MUST NOT add
an Istio AuthorizationPolicy or Kong route.
*/}}
{{- $svc := .Values.services.mediaProcessing }}
{{- if $svc.enabled }}
{{- $sa := $svc.serviceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: gp-services
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: media-service-processing
    gp.genealogy/contract-only: "true"
{{- end }}