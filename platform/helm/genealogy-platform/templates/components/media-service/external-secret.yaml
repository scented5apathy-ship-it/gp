{{/*
media service ExternalSecret (E7.2).

Vault Agent Injector source of truth for the
media-service workload. The chart never embeds secrets
in values; the ExternalSecret references Vault paths
and the agent sidecar injects the resolved values
into the pod's filesystem at runtime.

Per `agent-execution.md` §4.4 + AGENTS.md §3: Vault
manages every secret; no secret / PII / DNA / webhook
payload may be committed to Git.
*/}}
{{- $svc := .Values.services.media }}
{{- if $svc.enabled }}
{{- $sa := $svc.serviceAccount }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: media-service-secrets
  namespace: gp-services
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: media-service
    gp.genealogy/contract-only: "true"
spec:
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: media-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: secret/data/media-service/database
        property: password
    - secretKey: kafka-password
      remoteRef:
        key: secret/data/media-service/kafka
        property: password
    - secretKey: openfga-token
      remoteRef:
        key: secret/data/media-service/openfga
        property: token
    - secretKey: clamav-rest-url
      remoteRef:
        key: secret/data/media-service/scanner
        property: restUrl
    - secretKey: tika-rest-url
      remoteRef:
        key: secret/data/media-service/extractor
        property: restUrl
{{- end }}