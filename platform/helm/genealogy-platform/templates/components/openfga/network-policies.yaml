apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openfga
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: openfga
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: genealogy-platform
      app.kubernetes.io/component: openfga
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              gp.genealogy/contract-only: "true"
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: gp-data
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              gp.genealogy/contract-only: "true"
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
