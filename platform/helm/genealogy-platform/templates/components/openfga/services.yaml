{{- $openfga := .Values.components.openfga }}
{{- if $openfga.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: openfga
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: openfga
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ $openfga.network.adminPort }}
      targetPort: http
    - name: grpc
      port: {{ $openfga.network.checkPort }}
      targetPort: grpc
  selector:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: openfga
{{- end }}
