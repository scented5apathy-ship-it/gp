{{/*
research service ExternalSecret references (E6.1e).

The Vault-backed database + Kafka credentials are
referenced via External Secrets Operator. The chart NEVER
inlines a literal secret value — the per-env values files
(`values-saas.yaml`, `values-onprem.yaml`, `values-dev.yaml`)
override the Vault paths.

The data keys are intentionally opaque: the workload's
`envFrom.secretRef` reads them as `SPRING_DATASOURCE_PASSWORD`
+ `KAFKA_SASL_PASSWORD`. The Vault Agent Injector template
in `values.yaml::services.research-service.serviceAccount
.vaultAnnotations` is the canonical place to wire the
mapping.
*/}}
{{- $svc := .Values.services.research }}
{{- if $svc.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: research-service-database
  namespace: gp-services
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: research-service
spec:
  secretStoreRef:
    name: {{ $svc.secretRefs.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: research-service-database
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ $svc.secretRefs.databaseVaultPath }}
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: research-service-kafka
  namespace: gp-services
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: research-service
spec:
  secretStoreRef:
    name: {{ $svc.secretRefs.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: research-service-kafka
    creationPolicy: Owner
  data:
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef:
        key: {{ $svc.secretRefs.kafkaVaultPath }}
        property: password
{{- end }}
