{{/*
E6.1e: ServiceAccount for the research workload.

The Vault Agent Injector binds the workload identity to the
Vault role `research-service` per `platform/vault/policies.yaml`.
The role is what authorises the workload to read the database
+ Kafka secrets from Vault at startup.

No literal secret material is rendered here — the SA is
intentionally a token-less Kubernetes identity (the Vault
injector mints a short-lived AppRole token at runtime).
*/}}
{{- $svc := .Values.services.research }}
{{- if and $svc.enabled $svc.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc.serviceAccount.name }}
  namespace: gp-services
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: research-service
automountServiceAccountToken: false
{{- end }}
