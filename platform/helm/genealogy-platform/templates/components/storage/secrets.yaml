{{/*
MinIO + bucket-init Secrets — placeholder objects consumed by
External Secrets Operator. The chart never inlines a literal
credential. ESO syncs the actual `MINIO_ROOT_USER` +
`MINIO_ROOT_PASSWORD` from Vault at runtime.

A placeholder Secret is shipped so the StatefulSet + the
`storage-bucket-init` Helm-hook Job can be rendered before
ESO is online. ESO replaces the values within ~30 seconds
of pod start.
*/}}
{{- $storage := .Values.components.storage }}
{{- if and $storage.enabled (eq $storage.provider "minio") }}
{{- $ns := "gp-data" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: storage
    gp.genealogy/contract-only: "true"
  annotations:
    # ESO annotation — replaced at runtime.
    "external-secrets.io/external-secret": minio-credentials
type: Opaque
stringData:
  # Placeholder — replaced by ESO.
  rootUser: "REPLACE_ME"
  rootPassword: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-server-tls
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: storage
    gp.genealogy/contract-only: "true"
  annotations:
    cert-manager.io/issuer-name: selfsigned-ca
    cert-manager.io/common-name: minio.gp-data.svc.cluster.local
    cert-manager.io/duration: 8760h
type: kubernetes.io/tls
stringData:
  tls.crt: "REPLACE_ME"
  tls.key: "REPLACE_ME"
{{- end }}
