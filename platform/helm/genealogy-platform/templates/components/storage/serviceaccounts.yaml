{{/*
MinIO ServiceAccount + per-bucket IAM roles.

The chart ships the MinIO pod's ServiceAccount + the
service-specific ServiceAccounts that the bootstrap Job uses
to apply the bucket policy. Domain pods (media-service,
dna-service, etc.) retain their own ServiceAccounts; the
bucket policy binds them to per-bucket read / write via
`mc admin policy`.
*/}}
{{- $storage := .Values.components.storage }}
{{- if and $storage.enabled (eq $storage.provider "minio") }}
{{- $ns := "gp-data" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: storage
    gp.genealogy/contract-only: "true"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage-bucket-init
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: storage
    app.kubernetes.io/job: storage-bucket-init
    gp.genealogy/contract-only: "true"
automountServiceAccountToken: false
{{- end }}
