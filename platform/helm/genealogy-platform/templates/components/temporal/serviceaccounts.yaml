{{/*
ServiceAccounts for Temporal server + UI + the two Helm-hook Jobs.
The four workload identities are bound to OpenFGA `temporal.*`
relationships (E3.3) and to the worker-identity allowlist in
`task-queues.yaml` (E2.4 §4). Workload identity for the server is
carried via the downward-API pod name + the mTLS cert minted by
the mesh.
*/}}
{{- $temporal := .Values.components.temporal }}
{{- if $temporal.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal
  namespace: {{ $temporal.namespace }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: temporal
automountServiceAccountToken: false
---
{{- if $temporal.ui.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-ui
  namespace: {{ $temporal.namespace }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: temporal-ui
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-namespace-init
  namespace: {{ $temporal.namespace }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: temporal
    app.kubernetes.io/version: {{ $temporal.image.tag | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-task-queue-init
  namespace: {{ $temporal.namespace }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: temporal
    app.kubernetes.io/version: {{ $temporal.image.tag | quote }}
automountServiceAccountToken: false
{{- end }}