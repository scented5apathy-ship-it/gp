{{/*
Helm-hook Job — reconcile Temporal task queues on chart install /
upgrade. Mirrors the namespace-init Job in shape; reads the
source-of-truth `task-queues.yaml` ConfigMap and emits
`temporal task-queue update` for every entry whose retention or
description diverges.
*/}}
{{- $temporal := .Values.components.temporal }}
{{- if $temporal.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-task-queue-init
  namespace: {{ $temporal.namespace }}
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: temporal
    app.kubernetes.io/version: {{ $temporal.image.tag | quote }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: genealogy-platform
        app.kubernetes.io/component: temporal
    spec:
      serviceAccountName: temporal-task-queue-init
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile
          image: {{ include "genealogy-platform.image" (dict "image" $temporal.adminToolsImage) }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Reconciling Temporal task queues via admin-tools..."
              temporal-init.sh \
                --config /etc/temporal/policy/policy.yaml \
                --server temporal.{{ $temporal.namespace }}.svc.cluster.local:7233
          volumeMounts:
            - name: policy
              mountPath: /etc/temporal/policy
              readOnly: true
            - name: init-script
              mountPath: /usr/local/bin/temporal-init.sh
              readOnly: true
              subPath: temporal-init.sh
      volumes:
        - name: policy
          configMap:
            name: genea-temporal-task-queue-config
        - name: init-script
          configMap:
            name: temporal-init-scripts
            defaultMode: 0500
{{- end }}