{{/*
Vault ServiceAccount + RBAC — the `vault` SA is bound to a
ClusterRole that lets the bootstrap Job initialise the Raft
cluster, write the auth-method config, and write the per-
component policies. The RBAC is intentionally minimal; the
bootstrap Job is the only consumer.

The `vault-agent-injector` SA is reserved for the upstream
`hashicorp/vault-k8s` chart and is documented but not
rendered here (the subchart owns it). The SA + ClusterRole
below are for the platform-managed `vault-bootstrap` Job
that ships with E2.6.
*/}}
{{- $vault := .Values.components.vault }}
{{- if $vault.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault
    app.kubernetes.io/version: {{ $vault.image.tag | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-bootstrap
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault-bootstrap
    app.kubernetes.io/version: {{ $vault.image.tag | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-bootstrap
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault
rules:
  # The bootstrap Job reads + writes ConfigMaps in `gp-data`
  # to publish the rendered auth-method + policy configs.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # The bootstrap Job reads the SA + token Secrets it needs to
  # unseal Vault + write the initial root token.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # The bootstrap Job lists Vault pods so it can wait for the
  # active leader before issuing `vault operator` calls.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-bootstrap
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-bootstrap
subjects:
  - kind: ServiceAccount
    name: vault-bootstrap
    namespace: gp-data
{{- end }}
