{{/*
Vault services — two Services:
  - `vault` (ClusterIP, port 8200) — active Vault API, reachable
    from inside the mesh. Kong / BFF / domain services resolve
    this for `vault.hashicorp.com/agent-inject` annotations.
  - `vault-internal` (headless, port 8201) — Raft cluster
    listener, intra-pod-only. Never exposed to non-Vault pods.
*/}}
{{- $vault := .Values.components.vault }}
{{- if $vault.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault
    gp.genealogy/contract-only: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault
    # The active Vault node — the Raft leader. When the
    # leader changes, the Service re-resolves (kube-dns TTL
    # is short). Workloads that need a deterministic endpoint
    # use `vault.hashicorp.com/agent-inject` + the
    # `auto-auth` method instead.
    statefulset.kubernetes.io/pod-name: vault-0
  ports:
    - name: api
      port: 8200
      targetPort: api
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault
    gp.genealogy/contract-only: "true"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault
  ports:
    - name: cluster
      port: 8201
      targetPort: cluster
      protocol: TCP
    - name: api
      port: 8200
      targetPort: api
      protocol: TCP
{{- end }}
