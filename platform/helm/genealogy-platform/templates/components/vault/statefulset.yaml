{{/*
Vault server — StatefulSet running the upstream `vault` container
(front-end + Raft storage on the same node). Per ADR-E0.5-01 the
pinned image is `hashicorp/vault:1.17.x`; the chart ships the
all-in-one layout with Raft integrated storage (no external
Consul dependency). The server config is mounted from the
`genea-vault-server-config` ConfigMap.

Per ADR-E0.5-07 + E2.6 the Vault cluster is self-hosted on-prem
AND on SaaS. SaaS only swaps to a managed KMS provider (cloud
KMS via IRSA / pod identity) for the seal; the server layout is
identical.
*/}}
{{- $vault := .Values.components.vault }}
{{- if $vault.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault
    app.kubernetes.io/version: {{ $vault.image.tag | quote }}
    gp.genealogy/contract-only: "true"
spec:
  serviceName: vault-internal
  replicas: {{ $vault.replicas }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/part-of: genealogy-platform
      app.kubernetes.io/component: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: genealogy-platform
        app.kubernetes.io/component: vault
        app.kubernetes.io/version: {{ $vault.image.tag | quote }}
        gp.genealogy/contract-only: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/v1/sys/metrics?format=prometheus"
    spec:
      serviceAccountName: vault
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: vault
          image: {{ include "genealogy-platform.image" (dict "image" $vault.image) }}
          imagePullPolicy: IfNotPresent
          args:
            - "server"
            - "-config=/vault/config/config.hcl"
          env:
            # The KMS provider env vars are documented in
            # `kms-abstraction.yaml` (AWS_REGION, AWS_ACCESS_KEY_ID
            # from IRSA). The chart never inlines a literal key.
            - name: VAULT_ADDR
              value: https://127.0.0.1:8200
            - name: VAULT_API_ADDR
              value: https://vault.gp-data.svc.cluster.local:8200
            - name: VAULT_CLUSTER_ADDR
              value: https://vault-0.vault-internal:8201
            - name: VAULT_K8S_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: vault
                  resource: limits.cpu
                  divisor: "1"
            - name: VAULT_K8S_MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: vault
                  resource: limits.memory
                  divisor: "1"
            # Cluster name — disambiguates multi-cluster
            # topologies (ADR-E0.5-03 supersession).
            - name: VAULT_CLUSTER_NAME
              value: {{ .Values.global.region | default "ap-southeast-1" | quote }}
            # KMS provider selection (E2.6 §4). The SaaS values
            # file injects AWS_REGION + AWS_KMS_KEY_ID via IRSA;
            # the on-prem values file injects
            # VAULT_TRANSIT_ADDRESS + VAULT_TRANSIT_TOKEN.
            - name: VAULT_SEAL_TYPE
              value: {{ $vault.seal.type | quote }}
            {{- if eq $vault.seal.type "awskms" }}
            - name: AWS_REGION
              value: {{ .Values.global.region | quote }}
            - name: AWS_KMS_KEY_ID
              value: {{ $vault.seal.kmsKeyId | quote }}
            {{- end }}
            {{- if eq $vault.seal.type "transit" }}
            - name: VAULT_TRANSIT_ADDRESS
              value: {{ $vault.seal.transitAddress | quote }}
            - name: VAULT_TRANSIT_KEY_NAME
              value: {{ $vault.seal.transitKeyName | quote }}
            - name: VAULT_TRANSIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $vault.seal.tokenSecret }}
                  key: token
            {{- end }}
          ports:
            - name: api
              containerPort: 8200
              protocol: TCP
            - name: cluster
              containerPort: 8201
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: api
              scheme: HTTPS
            failureThreshold: {{ .Values.baseline.probes.readiness.failureThreshold }}
            periodSeconds: {{ .Values.baseline.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.baseline.probes.readiness.timeoutSeconds }}
            initialDelaySeconds: {{ .Values.baseline.probes.readiness.initialDelaySeconds }}
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: api
              scheme: HTTPS
            failureThreshold: {{ .Values.baseline.probes.liveness.failureThreshold }}
            periodSeconds: {{ .Values.baseline.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.baseline.probes.liveness.timeoutSeconds }}
            initialDelaySeconds: {{ .Values.baseline.probes.liveness.initialDelaySeconds }}
          startupProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: api
              scheme: HTTPS
            failureThreshold: {{ .Values.baseline.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.baseline.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.baseline.probes.startup.timeoutSeconds }}
          resources:
            requests:
              cpu: {{ $vault.resources.requests.cpu | quote }}
              memory: {{ $vault.resources.requests.memory | quote }}
            limits:
              cpu: {{ $vault.resources.limits.cpu | quote }}
              memory: {{ $vault.resources.limits.memory | quote }}
          volumeMounts:
            - name: data
              mountPath: /vault/file
            - name: config
              mountPath: /vault/config
              readOnly: true
            - name: tls
              mountPath: /vault/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: genea-vault-server-config
            items:
              - key: config.hcl
                path: config.hcl
        - name: tls
          projected:
            sources:
              - secret:
                  name: vault-server-tls
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: genealogy-platform
          app.kubernetes.io/component: vault
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp-data-ssd
        resources:
          requests:
            storage: {{ $vault.persistence.size | default "50Gi" }}
{{- end }}
