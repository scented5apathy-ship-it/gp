# Local / dev values for the genealogy-platform umbrella chart.
#
# Drives `platform/local/` (kind / k3d / Docker Desktop) so a
# developer can bring up the full stack on a laptop. Replica counts
# are pinned to 1 (CPU/RAM friendly) and in-tree replacements are
# enabled where managed services don't exist locally.
global:
  environment: dev
  clusterDomain: genealogy.localhost
  region: local

baseline:
  podDisruptionBudget:
    minAvailable: 1
  certificate:
    issuerName: selfsigned-ca
    stagingIssuerName: selfsigned-ca
    ingressClass: nginx
  probes:
    liveness:
      initialDelaySeconds: 10
    readiness:
      initialDelaySeconds: 5
    startup:
      failureThreshold: 60

components:
  kong:
    replicas: 1
    edition: oss
  keycloak:
    topology: standalone
    replicas: 1
  kafka:
    # ZK cần >= 3 replicas cho quorum (2 ZK + 1 observer). Override
    # `replicas` riêng cho ZK — chart hiện dùng cùng $kafka.replicas.
    # Strimzi 0.45.2 validate `zookeeper.replicas >= 3`. Dev trên kind
    # cần bump lên 3 để ZK form quorum đúng.
    replicas: 3
    replicationFactor: 1
    minInSyncReplicas: 1
    # kind cluster không provision được gp-data-ssd; dùng standard
    # (local-path provisioner built-in của kind).
    kafkaStorageClass: standard
    zookeeperStorageClass: standard
    # Entity-operator DISABLED on dev. Strimzi 0.45.2 entity-operator
    # has silent Admin API bug on kind cluster (topic + user
    # reconciliation runs in <100ms without actually calling Kafka
    # Admin API). Topics + ACLs are bootstrapped manually via
    # `kafka-topics.sh` / `kafka-acls.sh` from broker pod
    # (see docs/local-k8s-setup.md Step 10.4). Keep `enabled: true`
    # on production / staging.
    entityOperator:
      enabled: false
  apicurio:
    replicas: 1
    # ADR-E0.5-01 pin Apicurio 2.6.x, nhưng Docker Hub đã drop
    # tag 2.6.x (chỉ còn 3.x). Trên dev dùng 3.3 cho đến khi
    # ADR cập nhật lên 3.x. Production values giữ 2.6.x.
    # Tag PHẢI là string trong quotes để Helm không parse thành float.
    image:
      tag: "3.3"
  temporal:
    # Dev runs the all-in-one `temporal-server` as a single
    # StatefulSet replica (the umbrella chart already collapses the
    # four upstream services into a single pod per ADR-E0.5-07).
    # StorageClass stays `standard` because kind cluster cannot
    # provision `gp-data-ssd` (local-path provisioner only).
    persistence:
      postgresHost: postgres.gp-data.svc.cluster.local
      postgresPort: "5432"
      database: genea_temporal
      secretName: temporal-postgres-credentials
      cacheStorageClass: standard
      cacheSize: 2Gi
    # UI off in dev — the contract test suite asserts visibility
    # attribute + namespace + task-queue reconciliation via the
    # admin-tools image (the Helm-hook Jobs). The UI is only
    # useful for live debugging.
    ui:
      enabled: false
  vault:
    replicas: 1
    # Local dev runs Vault in `dev` mode with auto-unseal; the
    # preflight script refuses to start with this mode in any other
    # environment.
    unsealMode: dev
    # Dev profile always uses Shamir seal (no cloud KMS in dev).
    seal:
      type: shamir
    # Dev profile mounts the auth-methods + policies + KMS
    # abstraction ConfigMaps from the chart mirror. The
    # bootstrap Job still runs on every `helm upgrade`.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      storageClass: standard
      size: 2Gi
  storage:
    # E2.7 — dev runs MinIO single replica on the local
    # kind cluster. kind cluster cannot provision
    # `gp-data-ssd`, so the storage class falls through
    # to `standard` (local-path provisioner).
    provider: minio
    driver: minio
    buckets:
      - media
      - media-quarantine
      - dna-raw
      - import-export
    encryption: envelope
    versioning: enabled
    replicas: 1
    persistence:
      storageClass: standard
      size: 50Gi
    # Dev never has a real public origin; the CORS list
    # uses the local dev domain.
    corsAllowedOrigins:
      - http://app.genealogy.localhost
      - http://api.genealogy.localhost
  cache:
    # E2.7 — dev runs Valkey single replica + no
    # Sentinel HA. TLS is disabled (dev only).
    provider: valkey
    driver: valkey
    replicas: 1
    maxmemory: "256Mi"
    sentinel:
      enabled: false
    persistence:
      storageClass: standard
      size: 2Gi
  featureFlags:
    # E2.8 — dev runs Flagsmith single replica on the local
    # kind cluster. The `development` environment is selected
    # by the OpenFeature SDK; `corsAllowedOrigins` uses the
    # local dev domain.
    provider: flagsmith-self-hosted
    driver: flagsmith
    replicas: 1
    corsAllowedOrigins:
      - http://app.genealogy.localhost
      - http://api.genealogy.localhost
      - http://public-api.genealogy.localhost
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    sdkSafeDefault: true
  observability:
    # Local stack keeps one replica each and a 7-day retention so
    # the dev VM doesn't run out of disk.
    retention:
      prometheus: 7d
      loki: 7d
      tempo: 3d
  gitops:
    # E2.9 — dev profile runs the full Argo CD control plane
    # locally with rollouts controller enabled (canary drills
    # on the dev cluster). Replica counts and resources are
    # sized for a single-node dev kind cluster.
    driver: argocd
    rolloutsEnabled: true
    controller:
      replicas: 1
      server:
        replicas: 1
      repoServer:
        replicas: 1
      applicationController:
        replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "500m"
          memory: 512Mi
    rollouts:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    driftDetection:
      enabled: true
      resyncSeconds: 60

# Per-env overrides for the Istio mesh (E2.5).
# Dev profile keeps the four source-of-truth files but enables a
# less aggressive `kubectlImage.tag` (1.31.x) for the bootstrap
# Job. The dev stack does NOT run `istiod` — the bootstrap Job
# applies the four CRD sets against a kind cluster; the in-pod
# sidecar injection is left to `scripts/local-up.sh` on a per
# developer basis (out of scope for the umbrella chart).
istio:
  enabled: true
  version: "1.23"
  kubectlImage:
    repository: bitnami/kubectl
    tag: "1.31.1"
    registry: docker.io
  trustDomain: cluster.local

backups:
  postgres:
    enabled: false
  kafka:
    enabled: false
  minio:
    enabled: false
  vault:
    enabled: false
