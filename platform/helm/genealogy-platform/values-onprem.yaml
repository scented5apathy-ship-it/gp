# On-premise values for the genealogy-platform umbrella chart.
#
# Per ADR-E0.5-01 / NFR6 the on-prem profile self-hosts every
# capability (PostgreSQL, Kafka, MinIO, Vault, Valkey) so an
# enterprise tenant can run air-gapped. The shape of the cluster is
# the same as SaaS — only the size knobs differ (target ~64 vCPU /
# 256 GB RAM per `scale-and-slo.md` §2.6) and the secret store is the
# customer's Vault.
global:
  environment: onprem
  clusterDomain: onprem.genealogy.local
  region: customer-managed

baseline:
  podDisruptionBudget:
    minAvailable: 1
  certificate:
    # On-prem customers typically front the cluster with their own
    # PKI; the default Issuer is overridden per customer.
    issuerName: internal-ca
    stagingIssuerName: internal-ca-staging
    ingressClass: nginx-internal
  storage:
    defaultClass: gp-data-ssd
  namespacesOverrides:
    gp-data:
      quota:
        requestsCpu: "96"
        requestsMemory: 384Gi
        limitsCpu: "192"
        limitsMemory: 768Gi
        pods: "80"
        persistentVolumeClaims: "120"

components:
  kong:
    replicas: 3
    edition: oss
  keycloak:
    topology: clustered
    replicas: 3
  kafka:
    replicas: 3
    replicationFactor: 3
  apicurio:
    replicas: 2
  temporal:
    # On-prem profile mirrors SaaS (single StatefulSet running the
    # all-in-one `temporal-server`). Horizontal scaling is via the
    # `addCacheCapacity` chart knob once the size envelopes grow
    # (out of scope for E2.4 — tracked separately).
    persistence:
      postgresHost: postgres.gp-data.svc.cluster.local
      postgresPort: "5432"
      database: genea_temporal
      secretName: temporal-postgres-credentials
      cacheStorageClass: gp-data-ssd
      cacheSize: 20Gi
    ui:
      enabled: true
  vault:
    replicas: 3
    # On-prem Vault seals against a customer-managed KMS (HSM,
    # OpenBao, Azure Key Vault, etc.) selected per ADR-E0.5-01.
    # Transit auto-unseal points at the customer's bootstrap
    # Vault cluster; the transit token is mounted by External
    # Secrets Operator from the customer's secret store.
    seal:
      type: transit
      transitAddress: https://vault.customer.local:8200
      transitKeyName: genealogy-platform-root
      tokenSecret: vault-bootstrap-token
    sealMode: transit
  storage:
    # E2.7 — on-prem runs MinIO with the customer's
    # bootstrap Vault cluster for the SSE-KMS key. Replica
    # count is 1 + backup CronJob; DR runs on the customer's
    # second site (ADR-E0.5-03 supersession).
    provider: minio
    buckets:
      - media
      - media-quarantine
      - dna-raw
      - import-export
    encryption: envelope
    versioning: enabled
    replicas: 1
    # On-prem never has a public Object store endpoint;
    # CORS allowlist uses the customer's public-api host.
    corsAllowedOrigins:
      - https://app.customer.local
      - https://api.customer.local
    persistence:
      storageClass: gp-data-ssd
      size: 250Gi
  cache:
    # E2.7 — on-prem runs Valkey (Redis-compatible) with
    # 3 replicas + Sentinel HA. The customer's secret
    # store backs the password Secret.
    provider: valkey
    driver: valkey
    replicas: 3
    maxmemory: "1Gi"
  featureFlags:
    # E2.8 — on-prem runs Flagsmith self-hosted on the
    # customer cluster with 2 replicas. The `onprem`
    # environment is selected by the OpenFeature SDK.
    provider: flagsmith-self-hosted
    driver: flagsmith
    replicas: 2
    corsAllowedOrigins:
      - https://app.genealogy.local
      - https://api.genealogy.local
      - https://public-api.genealogy.local
      - https://admin.genealogy.local
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi
  observability:
    # E2.10 — on-prem runs the full observability stack on the
    # customer cluster. Customer-managed secret store backs the
    # ESO-managed Secrets.
    otelCollectorConfig:
      replicas: 2
    prometheusConfig:
      replicas: 2
      storage:
        size: 100Gi
    lokiConfig:
      replicas: 2
      storage:
        size: 100Gi
    tempoConfig:
      replicas: 2
      storage:
        size: 100Gi
    grafanaConfig:
      replicas: 2
    retention:
      prometheus: 30d
      loki: 30d
      tempo: 14d
    secretRefs:
      clusterSecretStore: vault-customer
      grafanaAdminVaultPath: secret/onprem/data/grafana/admin
      grafanaKeycloakClientVaultPath: secret/onprem/data/keycloak/grafana-client
      otelBearerVaultPath: secret/onprem/data/otel-collector/bearertoken
  gitops:
    # E2.9 — on-prem customer cluster runs the full Argo CD
    # control plane with rollouts controller enabled. AppProject
    # RBAC is enforced via Keycloak OIDC groups; the customer
    # customer manages the four-eyes promotion gate (MFA
    # required on release-approver).
    driver: argocd
    rolloutsEnabled: true
    controller:
      replicas: 2
      server:
        replicas: 2
      repoServer:
        replicas: 2
      applicationController:
        replicas: 2
    rollouts:
      replicas: 2
    driftDetection:
      enabled: true
      resyncSeconds: 180

# On-prem Istio profile (E2.5). Same posture as SaaS; the
# umbrella chart renders the same four source-of-truth
# ConfigMaps. The trust domain follows the customer's cluster
# domain (overridable per-deploy via `--set global.clusterDomain`).
istio:
  enabled: true
  version: "1.23"
  kubectlImage:
    repository: bitnami/kubectl
    tag: "1.31.1"
    registry: docker.io
  trustDomain: cluster.local

backups:
  postgres:
    schedule: "0 2 * * *"
    retentionDays: 14
  kafka:
    schedule: "0 3 * * *"
    retentionDays: 7
  minio:
    schedule: "0 4 * * *"
    retentionDays: 60
  vault:
    schedule: "0 5 * * *"
    retentionDays: 365

# Customer-managed Vault path. The path prefix is reserved per
# deployment (`onprem/<tenant>/...`) so multi-tenant on-prem
# deployments cannot read each other's secrets.
secretRefs:
  vault:
    address: https://vault.customer.local:8200
    namespacePrefix: onprem/REPLACE_ME
