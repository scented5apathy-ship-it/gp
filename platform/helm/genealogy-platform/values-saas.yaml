# SaaS values for the genealogy-platform umbrella chart.
#
# Per ADR-E0.5-01 / design §13 the SaaS profile pins to managed cloud
# services where available (PostgreSQL, S3, KMS, Redis) while keeping
# the same Helm contract as on-premise. Tenant isolation is enforced
# via per-tenant namespace quotas (baseline.namespaces[*].quota).
#
# Per `agent-execution.md` §4.4 secrets are NEVER inlined — the
# `secretRefs` map below is consumed by External Secrets / Vault.
global:
  environment: saas
  clusterDomain: saas.genealogy.example
  region: ap-southeast-1

# SaaS pushes the data plane to managed services; the chart only
# stands up the operator/agent side. Replicas reflect peak Y3 load
# (`scale-and-slo.md` §2.5) divided across three availability zones.
baseline:
  podDisruptionBudget:
    minAvailable: 2
  probes:
    liveness:
      initialDelaySeconds: 45
    readiness:
      initialDelaySeconds: 15

components:
  kong:
    replicas: 6
  keycloak:
    # SaaS clustered — 4 replicas across 3 AZs.
    replicas: 4
    topology: clustered
    # Realm strategy — ADR-E0.5-05 §Decision.
    realmStrategy: realm-per-tenant-group
    saasSharedRealm: genealogy-shared
    # Secret refs — managed Vault cluster (`vault-backend`).
    secretRefs:
      clusterSecretStore: vault-backend
      adminVaultPath: secret/saas/data/keycloak/admin
      webBffClientVaultPath: secret/saas/data/keycloak/web-bff-client
      publicApiClientVaultPath: secret/saas/data/keycloak/public-api-client
      kongBrokerClientVaultPath: secret/saas/data/keycloak/kong-broker-client
      grafanaClientVaultPath: secret/saas/data/keycloak/grafana-client
      smtpVaultPath: secret/saas/data/keycloak/smtp
      dbPasswordVaultPath: secret/saas/data/keycloak/db-password
      signingKeysVaultPath: secret/saas/data/keycloak/signing-keys
    # Federation — managed IdPs (Google Workspace / Microsoft
    # Entra / Okta / Auth0 / PingFederate).
    federation:
      okta:
        url: REPLACE_VIA_VALUES
      auth0:
        url: REPLACE_VIA_VALUES
      ping:
        url: REPLACE_VIA_VALUES
      saml:
        oktaJustification: ""
        pingJustification: ""
    # Resources — 4 replicas × 2 vCPU each.
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    persistence:
      storageClass: gp-data-ssd
      size: 100Gi
    # mTLS — opt-in for tenant-facing clients.
    mtls:
      enabled: false
  kafka:
    replicas: 6
    replicationFactor: 3
  apicurio:
    replicas: 3
  temporal:
    # SaaS self-hosts the Temporal cluster in-region (ADR-E0.5-07
    # — Temporal Cloud is reserved for an explicit ADR that
    # documents in-region + on-prem parity). The chart renders the
    # same all-in-one StatefulSet as on-prem; horizontal scaling is
    # via the `addCacheCapacity` knob once the size envelopes grow
    # (out of scope for E2.4).
    persistence:
      postgresHost: postgres.gp-data.svc.cluster.local
      postgresPort: "5432"
      database: genea_temporal
      secretName: temporal-postgres-credentials
      cacheStorageClass: gp-data-ssd
      cacheSize: 50Gi
    ui:
      enabled: true
  vault:
    replicas: 5
    # SaaS uses AWS KMS auto-unseal. The key ARN is injected
    # via `secretRefs.vault.kms.keyArn` (External Secrets
    # Operator resolves it from the AWS KMS-backed secret).
    # The literal ARN NEVER lives in this file.
    seal:
      type: awskms
      # kmsKeyId is the canonical ARN pattern; the actual
      # ARN is resolved by External Secrets at runtime.
      kmsKeyId: arn:aws:kms:ap-southeast-1:REPLACE_ME:alias/genea-vault-root
  storage:
    # E2.7 — SaaS uses managed AWS S3 (ADR-E0.5-03 candidate).
    # The chart does NOT render the MinIO workload; the same
    # bucket policy file is shipped to the AWS account via
    # the IaC pipeline (terraform / Cloud Custodian). The
    # deep linter still asserts the source-of-truth file
    # is present in `platform/storage/`.
    provider: aws-s3
    region: ap-southeast-1
    buckets:
      - media
      - media-quarantine
      - dna-raw
      - import-export
    encryption: envelope
    versioning: enabled
  cache:
    # E2.7 — SaaS uses AWS ElastiCache for Valkey (managed).
    # The chart does NOT render the Valkey StatefulSet; the
    # same Valkey config file is shipped to the AWS account
    # via the IaC pipeline. The deep linter still asserts
    # the source-of-truth file is present.
    provider: aws-elasticache
    driver: redis-managed
    replicas: 6
    maxmemory: "2Gi"
  featureFlags:
    # E2.8 — SaaS uses managed Flagsmith SaaS
    # (ADR-E0.5-03 candidate). The chart does NOT render
    # the Flagsmith Deployment; the same source-of-truth
    # files are shipped to the Flagsmith SaaS workspace
    # via the IaC pipeline. The deep linter still asserts
    # the source-of-truth files are present in
    # `platform/featureflags/`. The `production` environment
    # is selected by the OpenFeature SDK.
    provider: flagsmith-saas
    driver: flagsmith
    replicas: 3
    corsAllowedOrigins:
      - https://app.genealogy.local
      - https://api.genealogy.local
      - https://public-api.genealogy.local
      - https://admin.genealogy.local
  gitops:
    # E2.9 — SaaS runs the full Argo CD control plane in the
    # cluster (per-region, per-tenant-class). Rollouts
    # controller enabled; canary drills run against the
    # production cluster. The deep linter still asserts the
    # source-of-truth files are present in `platform/argo/`.
    driver: argocd
    rolloutsEnabled: true
    controller:
      replicas: 3
      server:
        replicas: 3
      repoServer:
        replicas: 3
      applicationController:
        replicas: 3
    rollouts:
      replicas: 3
    driftDetection:
      enabled: true
      resyncSeconds: 180
  observability:
    # E2.10 — SaaS runs the full observability stack on the
    # production cluster. 90-day Prometheus + Loki retention
    # for audit / compliance. Tempo S3 backend via cross-region
    # bucket `genea-tempo-blocks`.
    otelCollectorConfig:
      replicas: 3
    prometheusConfig:
      replicas: 3
      storage:
        size: 250Gi
    lokiConfig:
      replicas: 3
      storage:
        size: 250Gi
    tempoConfig:
      replicas: 3
      storage:
        size: 250Gi
    grafanaConfig:
      replicas: 3
    retention:
      prometheus: 90d
      loki: 90d
      tempo: 30d
    secretRefs:
      clusterSecretStore: vault-backend
      grafanaAdminVaultPath: secret/saas/data/grafana/admin
      grafanaKeycloakClientVaultPath: secret/saas/data/keycloak/grafana-client
      otelBearerVaultPath: secret/saas/data/otel-collector/bearertoken

# SaaS Istio profile (E2.5). Production posture; same
# source-of-truth files as on-prem. The trust domain follows
# the cluster domain; for cross-cluster failover the trust
# domain is appended with the region (e.g. `cluster.local.eu-
# central-1`) — tracked in ADR-E0.5-03 supersession.
istio:
  enabled: true
  version: "1.23"
  kubectlImage:
    repository: bitnami/kubectl
    tag: "1.31.1"
    registry: docker.io
  trustDomain: cluster.local

# Backup retention extended for SaaS (audit/compliance needs).
backups:
  postgres:
    schedule: "0 1 * * *"
    retentionDays: 35
  kafka:
    schedule: "0 2 * * *"
    retentionDays: 14
  minio:
    schedule: "0 3 * * *"
    retentionDays: 90
  vault:
    schedule: "0 4 * * *"
    retentionDays: 90

# External Secrets references. The literal Vault path lives here (no
# secret material); the Vault policy gate `cluster/<region>/saas/*`
# is enforced at runtime.
secretRefs:
  postgres:
    vaultPath: secret/saas/data/postgres
    keys:
      - username
      - password
  kafka:
    vaultPath: secret/saas/data/kafka
    keys:
      - bootstrapServers
      - saslPassword
  vault:
    kms:
      provider: aws-kms
      keyArn: arn:aws:kms:ap-southeast-1:000000000000:key/REPLACE_ME
