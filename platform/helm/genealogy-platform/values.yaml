# Default values for the genealogy-platform umbrella chart.
#
# Per `architecture-decisions.md` ADR-E0.5-01 (pinned baseline) and
# ADR-E0.5-02 (database topology), the chart ships a single set of
# defaults that every environment (SaaS, on-prem, staging, dev) inherits.
# Each environment then layers its overrides via `values-<env>.yaml`.
#
# Secrets are NEVER inlined — see `values-<env>.yaml` for the
# `secretRefs:` mapping consumed by External Secrets / Vault. The
# `scripts/lint-yaml.mjs` sensitive-key smoke check enforces this.

global:
  # Tenant boundary = `tenant_pseudo_id`. Workloads must label every
  # metric/log/trace with this pseudo-id only (no raw tenant UUIDs).
  tenantLabel: tenant_pseudo_id
  userLabel: user_pseudo_id
  # Default cluster domain used by Kong public route DNS and by
  # cert-manager certificate SANs.
  clusterDomain: cluster.local
  # Region tag is consumed by the OTel Collector (per
  # `ownership-catalog.md` data-residency column) and by Vault policy
  # templates that refuse cross-region secret reads.
  region: ap-southeast-1
  # Environment tag (saas | onprem | staging | dev).
  environment: dev

# Cluster baseline — applied to every environment.
baseline:
  # Namespaces follow the contract: 1 namespace per workload layer.
  # Pod Security admission profiles are pinned per namespace below.
  # The map is keyed by namespace name so per-environment overrides
  # (`baseline.namespacesOverrides.<ns>`) can patch a single
  # namespace without replacing the entire list (Helm default list
  # replacement would otherwise wipe namespaces on every per-env
  # values file).
  namespaces:
    gp-platform:
      name: gp-platform
      purpose: shared platform components (Kong, Keycloak, OpenFGA, etc.)
      podSecurity: restricted
      quota:
        requestsCpu: "32"
        requestsMemory: 64Gi
        limitsCpu: "64"
        limitsMemory: 128Gi
        pods: "100"
        persistentVolumeClaims: "50"
        # Tenant isolation enforced by `default-deny` NetworkPolicy +
        # per-namespace `gp-tenant-id` label consumed by OpenFGA and ABAC.
        tenantShared: true
    gp-edge:
      name: gp-edge
      purpose: public edge (Kong ingress, WAF)
      podSecurity: baseline
      quota:
        requestsCpu: "16"
        requestsMemory: 32Gi
        limitsCpu: "32"
        limitsMemory: 64Gi
        pods: "40"
        persistentVolumeClaims: "10"
        publicFacing: true
    gp-bff:
      name: gp-bff
      purpose: web-bff and public-api applications
      podSecurity: restricted
      quota:
        requestsCpu: "24"
        requestsMemory: 48Gi
        limitsCpu: "48"
        limitsMemory: 96Gi
        pods: "80"
        persistentVolumeClaims: "0"
    gp-services:
      name: gp-services
      purpose: domain services (11 services)
      podSecurity: restricted
      quota:
        requestsCpu: "64"
        requestsMemory: 128Gi
        limitsCpu: "128"
        limitsMemory: 256Gi
        pods: "200"
        persistentVolumeClaims: "100"
        tenantShared: true
    gp-workers:
      name: gp-workers
      purpose: async workers (media, search-indexer, export, dna-match)
      podSecurity: restricted
      quota:
        requestsCpu: "48"
        requestsMemory: 96Gi
        limitsCpu: "96"
        limitsMemory: 192Gi
        pods: "120"
        persistentVolumeClaims: "80"
    gp-data:
      name: gp-data
      purpose: stateful data plane (PostgreSQL, Kafka brokers, MinIO, Vault)
      podSecurity: baseline
      quota:
        requestsCpu: "64"
        requestsMemory: 256Gi
        limitsCpu: "128"
        limitsMemory: 512Gi
        pods: "60"
        persistentVolumeClaims: "80"
        storageClass: gp-data-ssd
    gp-observability:
      name: gp-observability
      purpose: OTel Collector, Prometheus, Loki, Tempo, Grafana
      podSecurity: restricted
      quota:
        requestsCpu: "24"
        requestsMemory: 64Gi
        limitsCpu: "48"
        limitsMemory: 128Gi
        pods: "60"
        persistentVolumeClaims: "30"
    gp-argocd:
      name: gp-argocd
      purpose: Argo CD / Rollouts control plane
      podSecurity: restricted
      quota:
        requestsCpu: "8"
        requestsMemory: 16Gi
        limitsCpu: "16"
        limitsMemory: 32Gi
        pods: "40"
        persistentVolumeClaims: "10"

  # Per-environment overrides. Each entry is deep-merged into the
  # matching namespace entry above (sprig `merge` semantics). Use
  # this to bump a quota or change a podSecurity profile without
  # redacting the rest of the namespace definition.
  namespacesOverrides: {}

  # Pod Security admission labels applied to every namespace above.
  # Per ADR-E0.5-01 / design §13, workloads run as non-root with
  # read-only root filesystem and drop ALL capabilities.
  podSecurityDefaults:
    enforce: restricted
    audit: restricted
    warn: baseline

  # Default NetworkPolicy posture: deny-all ingress + egress, then
  # per-workload allow rules layered by the workload templates.
  defaultDeny:
    enabled: true
    egressAllow:
      # DNS must always be reachable (CoreDNS).
      - toNamespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53

  # PodDisruptionBudget defaults — at least one replica must remain
  # available during voluntary disruption so Argo CD can roll without
  # dropping SLO budget.
  podDisruptionBudget:
    minAvailable: 1
    maxUnavailable: null
    # Services that are always single-replica (e.g. Kong control plane,
    # Vault) keep `maxUnavailable: 0` to prevent split-brain.
    singleReplicaWorkloads:
      - kong
      - vault
      - keycloak

  # Probe defaults — applied by every workload via the `_probes.tpl`
  # helper. Values match `scale-and-slo.md` §11 readiness budget.
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 5
      timeoutSeconds: 3
    liveness:
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 3
      initialDelaySeconds: 30
    readiness:
      failureThreshold: 3
      periodSeconds: 5
      timeoutSeconds: 2
      initialDelaySeconds: 10
    # `/healthz/live` and `/healthz/ready` are the contract enforced by
    # every Spring Boot service template (`libs/platform-spring-boot-starter`).
    paths:
      live: /healthz/live
      ready: /healthz/ready
      startup: /healthz/startup

  # Storage classes — used by the data plane.
  storage:
    defaultClass: gp-data-ssd
    classes:
      - name: gp-data-ssd
        type: ssd
        reclaimPolicy: Retain
        # Encrypted at rest per ADR §12 (KMS key per cluster).
        encrypted: true
      - name: gp-data-hdd
        type: hdd
        reclaimPolicy: Retain
        encrypted: true
      - name: gp-data-nvme
        type: nvme
        reclaimPolicy: Retain
        encrypted: true

  # cert-manager ClusterIssuer that Kong + BFF + public-api consume.
  # The preflight script (`scripts/preflight-cluster.mjs`) requires a
  # healthy `Ready=True` Issuer before declaring baseline OK.
  certificate:
    issuerName: letsencrypt-prod
    stagingIssuerName: letsencrypt-staging
    # Domain placeholders — overridden per environment.
    ingressClass: nginx

# Shared platform components. Each block ships its own subchart
# dependencies (kept inline here so the umbrella is self-contained for
# air-gapped on-premise installs). Detailed component config lives in
# the E2.2–E2.10 tasks; the values here are contract defaults so the
# umbrella can `helm template --validate-only` from day one.
components:
  kong:
    enabled: true
    edition: oss
    # Domain authorization lives in services; Kong handles only edge
    # policies (TLS, auth validation, CORS, request-size, rate limit,
    # correlation ID). See tasks.md E2.2.
    domainAuthorizationInKong: false
    replicas: 3
    # Log defaults — consumed by the Kong deployment env block.
    # Pre-existing in main's E2.2 commit but missing from the
    # values block, which broke `helm template` with a nil-pointer
    # error. E2.1 surfaces the gap.
    logging:
      level: notice
      format: json
    # Resource requests/limits — consumed by the Kong deployment
    # template's resources block. Pre-existing in main's E2.2
    # template but missing from values; E2.1 fills the gap.
    resources:
      requests:
        cpu: "500m"
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # Image pin — ADR-E0.5-01 baseline (Kong 3.8.x). The Helm workload
    # template renders a digest-pinned reference; Renovate bumps the
    # patch line per ADR-E0.5-01.
    image:
      repository: kong
      tag: "3.8.0"
      registry: docker.io
    # Path to the DB-less declarative config mounted by the
    # `kong-declarative-config` ConfigMap. Per E2.2 the same file is
    # reused by SaaS / on-prem / dev so route/plugin diffs stay in
    # git.
    declarativeConfig: /etc/kong/kong.yml
    # Explicit allow-list of plugins. Anything outside this list is
    # denied at startup, which makes the contract auditable.
    enabledPlugins:
      - correlation-id
      - cors
      - request-size-limiting
      - rate-limiting
      - ip-restriction
      - jwt
      - prometheus
  keycloak:
    enabled: true
    # Per `tasks.md` E3.1 + ADR-E0.5-05 + ADR-E0.5-01 the
    # platform runs the upstream `quay.io/keycloak/keycloak:26.x`
    # image with the five source-of-truth ConfigMaps (realm
    # strategy + realm export + client configs + federation +
    # key rotation). The deep linter
    # (`scripts/lint-keycloak-config.mjs`) enforces:
    #   - realmTopology is one of `realm-per-tenant-group` /
    #     `realm-per-tenant`;
    #   - SaaS shared realm name = `genealogy-shared`;
    #   - enterprise realm declarations carry a
    #     `justification` + `owner` block (linter refuses a
    #     dedicated realm without both);
    #   - the five mandatory OIDC clients (`web-app`,
    #     `web-bff`, `public-api`, `kong-oidc-broker`,
    #     `grafana-sso`) are declared with PKCE S256 +
    #     Vault-managed client secrets;
    #   - 5 OIDC + 2 SAML identity providers are declared
    #     (SAML marked `deprecatedPath: true`);
    #   - realm signing key rotated every 90 days + client
    #     secrets every 30 days + JWKS cache TTL ≤ 360 min;
    #   - no literal client_secret / private key / JWKS value
    #     in any YAML file.
    topology: standalone
    realmStrategy: realm-per-tenant-group
    replicas: 2
    # Image pin — ADR-E0.5-01 baseline (Keycloak 26.x).
    image:
      repository: keycloak/keycloak
      tag: "26.0"
      registry: quay.io
    # Database — shared Postgres cluster in `gp-data`.
    # The Keycloak JPA DB is `genea_keycloak`. The DB
    # password is rotated every 30 days via the
    # `keycloak-db-password-rotation` CronJob (E14.1).
    database:
      host: postgres.gp-data.svc.cluster.local
      port: "5432"
      name: genea_keycloak
      username: keycloak
      # The password is injected from the ESO-managed
      # `keycloak-db-password` Secret at runtime — the
      # chart never inlines a literal.
      passwordSecretName: keycloak-db-password
      passwordSecretKey: password
    # Resource requests/limits — Keycloak 26.x baseline.
    # The StatefulSet template renders these into the
    # Pod's `resources` block.
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # Persistence — 20Gi default. On dev the storageClass
    # falls through to `standard` (local-path).
    persistence:
      storageClass: gp-data-ssd
      size: 20Gi
    # Source-of-truth list of ConfigMaps mirrored from
    # `platform/keycloak/`. The chart mounts them into
    # the StatefulSet + the bootstrap Job.
    configPaths:
      realmStrategy: keycloak/realm-strategy.yaml
      realmExport: keycloak/realm-export.yaml
      clientConfigs: keycloak/client-configs.yaml
      federation: keycloak/federation.yaml
      keyRotation: keycloak/key-rotation.yaml
    # External Secrets references — NEVER literal credentials.
    # Every secret comes from Vault via External Secrets
    # Operator (E2.6). The per-env values files override
    # the `clusterSecretStore` + `*VaultPath` for on-prem
    # (`vault-customer`) and SaaS (`vault-backend`).
    secretRefs:
      clusterSecretStore: vault-backend
      adminVaultPath: secret/dev/data/keycloak/admin
      webBffClientVaultPath: secret/dev/data/keycloak/web-bff-client
      publicApiClientVaultPath: secret/dev/data/keycloak/public-api-client
      kongBrokerClientVaultPath: secret/dev/data/keycloak/kong-broker-client
      grafanaClientVaultPath: secret/dev/data/keycloak/grafana-client
      smtpVaultPath: secret/dev/data/keycloak/smtp
      dbPasswordVaultPath: secret/dev/data/keycloak/db-password
      signingKeysVaultPath: secret/dev/data/keycloak/signing-keys
    # mTLS — opt-in. When enabled, the `web-bff` and
    # `kong-oidc-broker` clients switch to
    # `ssl.client-auth = external-request`. Per-env values
    # override this default.
    mtls:
      enabled: false
    # Federation overrides — the per-env values files
    # inject IdP discovery endpoints + Vault paths. The
    # chart default leaves the per-IdP `discoveryEndpoint`
    # as `REPLACE_VIA_VALUES`; the bootstrap Job fails if
    # a SaaS / on-prem deployment reaches the Job without
    # a populated endpoint.
    federation:
      okta:
        url: REPLACE_VIA_VALUES
      auth0:
        url: REPLACE_VIA_VALUES
      ping:
        url: REPLACE_VIA_VALUES
      # SAML providers — DEPRECATED. Each requires a
      # contractual justification in the per-env values
      # file (ADR-E0.5-05 §License/TCO).
      saml:
        oktaJustification: ""
        pingJustification: ""
  openfga:
    enabled: true
    # Per `tasks.md` E3.3 + ADR-E0.5-06 + ADR-E0.5-01 the
    # platform runs the upstream `openfga/openfga:1.x` image
    # with the store-strategy + model-registry + bootstrap-tuples
    # + audit-hook + sync-workflow source-of-truth ConfigMaps.
    # The deep linter (`scripts/lint-openfga-config.mjs`)
    # enforces:
    #   - storeTopology = 'store-per-tenant' + shared model;
    #   - readConsistency.p95Milliseconds ≤ 500;
    #   - cache.invalidationOnWrite = 'required'
    #     (TTL-only caching forbidden);
    #   - audit.mode = 'required' (every Write emits a hook);
    #   - bootstrap.modelVersion matches the
    #     `contracts/openfga/model.v<version>.json` file;
    #   - migration.policy = 'expand-contract';
    #   - no literal token / password / DSN in any YAML file.
    topology: store-per-tenant
    replicas: 2
    # Image pin — ADR-E0.5-01 baseline (OpenFGA 1.x).
    # Local profile pins 1.10; the chart pin is the latest
    # release line Renovate bumps. Sync workflow reads the
    # model-registry ConfigMap and uploads on every `helm
    # upgrade`.
    image:
      repository: openfga/openfga
      tag: "v1.18.3"
      pullPolicy: IfNotPresent
    # Bootstrap Job image — uploads model + default-role tuples
    # to each per-tenant store on `helm upgrade`. Same pin as
    # the OpenFGA server (1.18) so the SDK matches.
    bootstrapImage:
      repository: openfga/openfga
      tag: "v1.18.3"
    # Datastore — Postgres for SaaS / on-prem, in-memory for dev.
    # DSN injected from ESO-managed Secret at runtime; never
    # inlined.
    datastore:
      engine: postgres
      postgres:
        host: postgres.gp-data.svc.cluster.local
        port: "5432"
        name: genea_openfga
        username: openfga
        passwordSecretName: openfga-db-password
        passwordSecretKey: password
    # Resource requests/limits — OpenFGA 1.x baseline.
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "1Gi"
    # Network — admin (8080) + check (8081); both inside the
    # `gp-data` namespace over Istio mTLS. No public ingress.
    network:
      adminPort: 8080
      checkPort: 8081
      mtls: required
    # Storage class — gp-data-encrypted (StorageClass
    # `encrypted: "true"` per baseline).
    storageClass: gp-data-encrypted
    storageSize: 10Gi
  kafka:
    enabled: true
    # Strimzi-managed; see E2.3 for topic/ACL/quota policy.
    replicas: 3
    replicationFactor: 3
    minInSyncReplicas: 2
    # Image pin — ADR-E0.5-01 baseline (Kafka 3.8.x via Strimzi
    # 0.45.x). Renovate bumps the patch line per ADR-E0.5-01.
    # Bumped from 0.43.0 → 0.45.2 per ADR-E0.5-01 supersession
    # (entity-operator Admin API bug in 0.43.0 + KRaft stability
    # fixes; StaticQuotaCallback forbidden-list dropped in 0.45).
    image:
      repository: quay.io/strimzi/kafka
      tag: 0.45.2-kafka-3.8.0
      registry: quay.io
    # KRaft-only; ZooKeeper is forbidden per design §13.
    kraft: true
    # Per-broker quota DISABLED for Strimzi 0.43.x / 0.45.x baseline.
    # Strimzi's forbidden-list still strips the required
    # AdminClient bootstrap key in these versions. Quota enforcement
    # delegated to KafkaUser.spec.quotas and Kong edge rate-limit.
    # Re-enable in ADR-E0.5-08 supersession when Strimzi 0.46.x is
    # adopted (forbidden-list lifted in 0.46 line). Keys below kept
    # commented for the future ADR diff.
    # quota:
    #   produceBytesPerSec: 52428800
    #   consumeBytesPerSec: 52428800
    #   requestsPerSec: 200000
    #   adminBootstrapServers: "genea-kafka-kafka-bootstrap.gp-data.svc.cluster.local:9092"
    # Probe defaults — Kafka brokers expose a TCP-only probe on
    # 9090 (entity-operator) and 8080 (Strimzi admin). The Spring
    # Boot service template uses the standard
    # `/healthz/{live,ready,startup}` contract.
    # Entity-operator (topic + user). Set `enabled: false` on local
    # dev where the operator's Admin API connection fails silently
    # (Strimzi 0.43 / 0.45 bug on kind cluster). When disabled, the
    # chart ships only the Kafka cluster + ZooKeeper; topics/ACLs
    # are bootstrapped manually via `kafka-topics.sh` /
    # `kafka-acls.sh` exec'd from broker pod. Keep `enabled: true`
    # on production / staging.
    entityOperator:
      enabled: true
      topicOperator:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
      userOperator:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # Source-of-truth list of KafkaTopics. Mirrored from
    # `platform/kafka/topics.yaml` so the chart can `helm template`
    # without reading the file directly.
    topicsPath: files/kafka/topics.yaml
    usersPath: files/kafka/users.yaml
  apicurio:
    enabled: true
    replicas: 2
    # Image pin — ADR-E0.5-01 supersession (Apicurio 3.3.x).
    # Bumped from 2.6.x → 3.3.x because Docker Hub dropped the
    # 2.6.x tag stream and Apicurio 3.x ships on Quarkus (different
    # config mount path, env-var-driven). Production / staging must
    # be re-validated after bump.
    image:
      repository: apicurio/apicurio-registry
      tag: "3.3"
      registry: docker.io
    # Source-of-truth config (configmap) + per-artifact
    # compatibility matrix.
    configPath: files/apicurio/registry-config.yaml
    # Default compatibility is BACKWARD (ADR-E0.5-08).
    defaultCompatibility: BACKWARD
    resources:
      requests:
        cpu: "200m"
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # JMX exporter port (alert source).
    jmxPort: 9999
  temporal:
    enabled: true
    # Per `tasks.md` E2.4 + ADR-E0.5-07 the Temporal cluster is
    # self-hosted on-prem AND on SaaS. SaaS only swaps to Temporal
    # Cloud with an in-region + on-prem-parity contract (tracked
    # in the ADR). The chart renders the self-hosted layout.
    namespace: gp-data
    # Image pin — ADR-E0.5-01 baseline (Temporal 1.26.x).
    # The umbrella chart ships the all-in-one `temporalio/temporal`
    # image (front-end + history + matching + worker on distinct
    # ports) — same binary the upstream `temporalio/temporal` Helm
    # chart uses. Renovate bumps the patch line per ADR-E0.5-01.
    image:
      repository: temporalio/temporal
      tag: "1.26.2"
      registry: docker.io
    # Admin-tools image — used by the two Helm-hook Jobs that
    # reconcile namespaces + task queues. Same upstream
    # `temporalio/admin-tools` chart default.
    adminToolsImage:
      repository: temporalio/admin-tools
      tag: "1.26.2"
      registry: docker.io
    # Default namespace — every domain namespace in
    # `platform/temporal/namespace-config.yaml` is created by the
    # `temporal-namespace-init` Helm-hook Job.
    defaultNamespace: genea-default
    # PostgreSQL persistence — uses the chart's gp-data cluster.
    # The Helm pre-install hook from E2.1 provisions the database
    # + role; the chart only references the secret.
    persistence:
      postgresHost: postgres.gp-data.svc.cluster.local
      postgresPort: "5432"
      database: genea_temporal
      secretName: temporal-postgres-credentials
      cacheStorageClass: gp-data-ssd
      cacheSize: 10Gi
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # UI is read-only and restricted to platform-primary on-call
    # operators per ADR-E0.5-07 §privacy. The UI is exposed via
    # the chart's `gp-platform` ingress with SSO; nothing is
    # public.
    ui:
      enabled: true
      image:
        repository: temporalio/ui
        tag: "2.5.0"
        registry: docker.io
      resources:
        requests:
          cpu: "100m"
          memory: 128Mi
        limits:
          cpu: "500m"
          memory: 512Mi
  istio:
    enabled: true
    profile: default
    # Image pin — ADR-E0.5-01 baseline (Istio 1.23.x). Renovate
    # bumps the patch line per ADR-E0.5-01; the umbrella chart
    # uses the `istio-operator` subchart for the control plane
    # (`istiod`) so this version is the documented baseline.
    version: "1.23"
    # Image pin for the bootstrap Job (Python + kubectl). The
    # `istio-bootstrap-job` template does NOT need the heavy
    # `istioctl` image — it just applies the four source-of-truth
    # ConfigMap-derived manifests. `bitnami/kubectl` ships
    # `python3` for the YAML conversion.
    kubectlImage:
      repository: bitnami/kubectl
      tag: "1.31.1"
      registry: docker.io
    # Strict mTLS, deny-by-default AuthorizationPolicy and no in-mesh
    # retry (mesh + app retries are kept disjoint per design §13).
    # The four source-of-truth files live in `platform/istio/` and
    # are mirrored into the chart's `files/istio/` directory.
    mesh:
      mtls: STRICT
      outboundPolicy: REGISTRY_ONLY
      inboundPolicy: MUTUAL_TLS
      retryBudget: null
    # The four source-of-truth ConfigMaps rendered by the chart
    # (mesh-config, peer-auth, authz-policies, telemetry). Mirrored
    # from `platform/istio/` so `helm template` does not read
    # outside the chart root.
    configPaths:
      meshConfig: files/istio/mesh-config.yaml
      peerAuth: files/istio/peer-auth.yaml
      authzPolicies: files/istio/authz-policies.yaml
      telemetry: files/istio/telemetry.yaml
    # Authorization policy — pinned posture for the platform.
    # The `authz-policies.yaml` source-of-truth carries the
    # documented allow + deny rules; these values tell the
    # template which CRD kinds to render.
    authz:
      denyByDefault: true
      denyPlaintextPrincipal: true
      dnaServiceEgressDeny: true
      dnaServiceIngressDeny: true
      mediaWorkerEgressDeny: true
      mediaWorkerIngressAllow: true
      dnaWorkerEgressDeny: true
    # Telemetry — pinned posture for the platform.
    telemetry:
      traceDriver: otel
      otelCollectorHost: otel-collector.gp-observability.svc.cluster.local
      otelCollectorPort: 4317
      prometheusHost: prometheus.gp-observability.svc.cluster.local
      prometheusPort: 9090
      accesslogFormat: JSON
      includeSpiffe: true
    # Trust domain — must match the `clusterDomain` in
    # `global.clusterDomain` (default `cluster.local`).
    trustDomain: cluster.local
    # Resources for the bootstrap Job — small, runs once per
    # `helm upgrade`.
    bootstrapResources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  vault:
    enabled: true
    # E2.6 — Vault + cloud KMS abstraction. The chart ships
    # the Vault server (StatefulSet), the Vault Agent Injector
    # (via the upstream `hashicorp/vault-k8s` subchart), the
    # `vault-bootstrap` Helm-hook Job that initialises the
    # Raft cluster + enables the auth methods + writes the
    # per-component policies, and the four source-of-truth
    # ConfigMaps that mirror `platform/vault/`.
    #
    # SaaS uses `awskms` (AWS KMS auto-unseal via IRSA /
    # pod identity). On-prem uses `transit` (Vault transit
    # auto-unseal against a bootstrap Vault cluster). Dev
    # uses `shamir` (operator unseals manually).
    #
    # The deep linter (`scripts/lint-vault-config.mjs`) enforces:
    #   - server-config HCL declares the active seal stanza;
    #   - policies.yaml carries deny-all default + path-scoped
    #     per-component ACLs + no `root` capability;
    #   - kms-abstraction.yaml pins the activeProvider per env;
    #   - no literal AWS access key / secret key in any file;
    #   - injector-templates.yaml carries agent-inject: "true"
    #     + agent-revoke-on-shutdown: "true" for every
    #     workload class.
    unsealMode: auto
    replicas: 3
    # Image pin — ADR-E0.5-01 baseline (Vault 1.17.x). The
    # umbrella chart renders the upstream `hashicorp/vault`
    # subchart for the server; this image reference is the
    # canonical baseline. Renovate bumps the patch line per
    # ADR-E0.5-01.
    image:
      repository: hashicorp/vault
      tag: "1.17.1"
      registry: docker.io
    # Injector image — used by the upstream
    # `hashicorp/vault-k8s` subchart. Same pin as the server.
    injectorImage:
      repository: hashicorp/vault-k8s
      tag: "1.5.0"
      registry: docker.io
    # KMS seal — SaaS uses AWS KMS auto-unseal; on-prem uses
    # Vault transit auto-unseal; dev uses Shamir. The
    # `kmsKeyId` + `transitAddress` are injected at deploy
    # time via the per-env values files; the chart never
    # inlines a literal AWS key.
    seal:
      # One of: `awskms`, `transit`, `shamir`.
      type: awskms
      # AWS KMS key ARN — only when `type == awskms`.
      # The dev / on-prem values files override this.
      kmsKeyId: arn:aws:kms:ap-southeast-1:000000000000:alias/genea-vault-root
      # Vault transit address — only when `type == transit`.
      transitAddress: https://vault-bootstrap.gp-platform.svc.cluster.local:8200
      transitKeyName: genealogy-platform-root
      # Kubernetes Secret carrying the transit token — only
      # when `type == transit`. The Secret is created by
      # External Secrets Operator against the bootstrap Vault.
      tokenSecret: vault-bootstrap-token
    # Source-of-truth list of ConfigMaps mirrored from
    # `platform/vault/`. The chart mounts them into the
    # StatefulSet + the `vault-bootstrap` Helm-hook Job.
    configPaths:
      serverConfig: files/vault/server-config.yaml
      authMethods: files/vault/auth-methods.yaml
      policies: files/vault/policies.yaml
      kmsAbstraction: files/vault/kms-abstraction.yaml
      injectorTemplates: files/vault/injector-templates.yaml
    # Per-component policy ACL list — pinned posture for the
    # platform. The `vault-bootstrap` Job writes each entry
    # via `vault policy write`. Each policy is path-scoped to
    # the documented KV v2 mount (`secret/data/<scope>/...`).
    policies:
      enabledPolicies:
        - default
        - services-read-secrets
        - bff-read-secrets
        - workers-read-secrets
        - data-read-secrets
        - data-rotate-secrets
        - observability-read-secrets
        - ci-read-secrets
        - ci-write-deploy-markers
      forbiddenCapabilities:
        - root
        - sudo
    # Auth method list — pinned posture for the platform.
    # The Kubernetes auth method is the canonical workload
    # identity; Keycloak JWT is reserved for human operators;
    # GitHub Actions AppRole is reserved for CI runners.
    authMethods:
      enabled:
        - kubernetes
        - keycloak-oidc
        - github-actions
      forbidden:
        - userpass
        - ldap
        - cert
    # KMS abstraction contract — application code binds to
    # `com.genealogy.platform.kms.KmsProvider`. The runtime
    # provider is selected by `seal.type` + per-env values.
    kmsAbstraction:
      contractInterface: com.genealogy.platform.kms.KmsProvider
      activeProvider:
        saas: aws-kms
        onprem: vault-transit
        dev: vault-transit
      # Per-data-class key assignments per
      # `privacy-and-legal-gate.md` §5. The linter rejects
      # a reused keyId across two classes.
      dataClasses:
        - PII.IDENTITY
        - PII.QUASI_ID
        - PII.SENSITIVE
        - GENETIC.RAW
        - GENETIC.METADATA
        - GENETIC.DERIVED
        - MEDIA.RAW
        - MEDIA.DERIVATIVE
        - AUDIT.APPENDONLY
        - OPS.METADATA
        - SECRET
    # Telemetry — Prometheus on 8200 (alert source) + OTel
    # trace export to the platform OTel Collector (E2.10).
    # The OTel endpoint is overridable per env; the default
    # points at the gp-observability collector.
    telemetry:
      prometheusEnabled: true
      otelCollectorHost: otel-collector.gp-observability.svc.cluster.local
      otelCollectorPort: 4317
    # Persistence — local cache + Raft storage on the gp-data
    # StorageClass (encrypted-at-rest per ADR-E0.5-02 +
    # `privacy-and-legal-gate.md` §6).
    persistence:
      storageClass: gp-data-ssd
      size: 50Gi
    # Resources — sized for SaaS / on-prem (3 replicas). The
    # dev values file overrides to a single replica + smaller
    # requests.
    resources:
      requests:
        cpu: "500m"
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 4Gi
    # Bootstrap Job resources — small, runs once per
    # `helm upgrade`.
    bootstrapResources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  storage:
    # E2.7 — S3/MinIO + bucket policy. The chart renders the
    # upstream `minio/minio` StatefulSet on on-prem + dev;
    # SaaS uses managed AWS S3 (provider: aws-s3). The four
    # source-of-truth ConfigMaps (`platform/storage/*.yaml`)
    # are mirrored into `files/storage/` and mounted into
    # the StatefulSet + the `storage-bucket-init` Helm-hook
    # Job. The deep linter (`scripts/lint-s3-config.mjs`)
    # enforces:
    #   - s3-config.yaml pins MinIO RELEASE
    #     2024-10-13T13-34-11Z (ADR-E0.5-01);
    #   - bucket-policy.yaml carries 4 buckets with versioning
    #     + lifecycle + KMS key alias + IAM + CORS;
    #   - no public READ ACL on the `media` bucket;
    #   - no raw tenant UUID / raw PII / raw DNA in any prefix
    #     template;
    #   - signed URL TTL ≤ 1 hour (export bucket ≤ 15 min);
    #   - no literal AWS access key / secret key in any file.
    enabled: true
    # `provider` selects which workload to render:
    #   - `minio`  → StatefulSet (on-prem + dev)
    #   - `aws-s3` → managed AWS S3 (SaaS, ADR-E0.5-03)
    provider: minio
    # Bucket list — must match `bucket-policy.yaml.buckets`.
    # The linter rejects a drift between the values list and
    # the source-of-truth list.
    buckets:
      - media
      - media-quarantine
      - dna-raw
      - import-export
    # Server posture — defaults to MinIO on-prem defaults.
    encryption: envelope
    versioning: enabled
    # Image pin — ADR-E0.5-01 baseline (MinIO
    # RELEASE.2024-10-13T13-34-11Z).
    image:
      repository: minio/minio
      tag: RELEASE.2024-10-13T13-34-11Z
      registry: docker.io
    mcImage:
      repository: minio/mc
      tag: RELEASE.2024-10-13T15-34-59Z
      registry: docker.io
    # CORS allowlist — restricted to the platform public
    # origins. Wildcard is forbidden per
    # `privacy-and-legal-gate.md` §11.
    corsAllowedOrigins:
      - https://app.genealogy.local
      - https://api.genealogy.local
      - https://public-api.genealogy.local
    # OTel audit endpoint (E2.10).
    auditEndpoint: "http://otel-collector.gp-observability.svc.cluster.local:4318/v1/audit"
    # Replica count — per-env values files override.
    replicas: 1
    # Persistence — local cache + MinIO data on the gp-data
    # StorageClass (encrypted-at-rest per ADR-E0.5-02 +
    # `privacy-and-legal-gate.md` §6).
    persistence:
      storageClass: gp-data-ssd
      size: 100Gi
    # Resources — sized for SaaS / on-prem (3+ replicas).
    # The dev values file overrides to a single replica +
    # smaller requests.
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # Source-of-truth list of ConfigMaps mirrored from
    # `platform/storage/`. The chart mounts them into
    # the StatefulSet + the `storage-bucket-init` Helm-hook
    # Job.
    configPaths:
      s3Config: storage/s3-config.yaml
      bucketPolicy: storage/bucket-policy.yaml
      compatibilityMatrix: storage/compatibility-matrix.yaml
    # Bucket-init Job resources.
    bucketInitResources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  cache:
    # E2.7 — Valkey (Redis-compatible) for cache / session /
    # rate state. The chart renders the upstream
    # `valkey/valkey` StatefulSet on on-prem + dev; SaaS
    # uses AWS ElastiCache for Valkey (provider: aws-elasticache).
    # The four source-of-truth files
    # (`platform/storage/valkey-config.yaml`) are mirrored
    # into `files/storage/`. The deep linter enforces:
    #   - valkey-config.yaml pins Valkey 7.2-alpine
    #     (ADR-E0.5-01);
    #   - per-user ACL forbids `@admin` for service users;
    #   - forbiddenKeyPatterns forbids raw DNA / password /
    #     token storage;
    #   - maxmemoryPolicy is `allkeys-lru` (no `noeviction`);
    #   - per-class TTL ceilings enforced.
    enabled: true
    # `provider` selects which workload to render:
    #   - `valkey`         → StatefulSet (on-prem + dev)
    #   - `aws-elasticache` → managed (SaaS, ADR-E0.5-03)
    provider: valkey
    # Legacy alias preserved for the dev profile.
    driver: valkey
    replicas: 2
    # Image pin — ADR-E0.5-01 baseline (Valkey 7.2-alpine).
    image:
      repository: valkey/valkey
      tag: "7.2-alpine"
      registry: docker.io
    # Maximum memory per replica. Per-env values files
    # override (SaaS = 2Gi, on-prem = 1Gi, dev = 256Mi).
    maxmemory: "1Gi"
    # Memory limit + eviction policy. The linter rejects
    # `noeviction`.
    maxmemoryPolicy: "allkeys-lru"
    # Persistence — AOF + RDB snapshot.
    persistence:
      storageClass: gp-data-ssd
      size: 10Gi
    # Sentinel — works at 3 replicas. Disabled on dev (1
    # replica).
    sentinel:
      enabled: true
      quorum: 2
    # Resources — sized for on-prem (3 replicas).
    resources:
      requests:
        cpu: "200m"
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # Source-of-truth file.
    configPath: storage/valkey-config.yaml
  featureFlags:
    # E2.8 — Flagsmith + OpenFeature. The chart renders the
    # upstream `flagsmith/flagsmith` Deployment on on-prem +
    # dev; SaaS uses managed Flagsmith SaaS (provider:
    # flagsmith-saas). The five source-of-truth files
    # (`platform/featureflags/*.yaml`) are mirrored into
    # `files/featureflags/`. The deep linter
    # (`scripts/lint-flagsmith-config.mjs`) enforces:
    #   - flagsmith-server.yaml pins the upstream
    #     `flagsmith/flagsmith:2.139.4` image
    #     (ADR-E0.5-01 baseline);
    #   - backing store is postgresql (in-memory forbidden in
    #     production);
    #   - anonymous access is FORBIDDEN;
    #   - CORS allowlist is restricted (no wildcard);
    #   - 5 environments + 4 RBAC roles declared;
    #   - 8 legal-gate flags from
    #     `privacy-and-legal-gate.md` §12 + ≥ 4 rollout flags;
    #   - safe-default rules enforced (typed fallback +
    #     evaluation timeout + audit event contract);
    #   - forbidden key patterns rejected (skip_auth /
    #     skip_consent / bypass_audit / etc.);
    #   - no literal secret / token / password in any file.
    enabled: true
    # `provider` selects which workload to render:
    #   - `flagsmith-self-hosted` → Deployment (on-prem + dev)
    #   - `flagsmith-saas`        → managed (SaaS, ADR-E0.5-03)
    provider: flagsmith-self-hosted
    # Legacy alias preserved for the dev profile.
    driver: flagsmith
    # Image pin — ADR-E0.5-01 baseline (Flagsmith 2.139.4).
    image:
      repository: flagsmith/flagsmith
      tag: "2.139.4"
      registry: docker.io
    # Replica count — per-env values files override.
    replicas: 2
    # Backing store — Postgres is REQUIRED for production /
    # staging / on-prem. In-memory is FORBIDDEN in any
    # non-development environment.
    backingStore: postgresql
    # Anonymous access — FORBIDDEN. JWT auth + per-environment
    # API tokens are mandatory.
    allowAnonymous: false
    # CORS allowlist — restricted to the platform public
    # origins. Wildcard is forbidden per
    # `privacy-and-legal-gate.md` §11.
    corsAllowedOrigins:
      - https://app.genealogy.local
      - https://api.genealogy.local
      - https://public-api.genealogy.local
      - https://admin.genealogy.local
    # TLS minimum — TLS 1.2 minimum, TLS 1.3 preferred.
    tlsMinVersion: "tls12"
    # OTel audit endpoint (E2.10).
    auditEndpoint: "http://otel-collector.gp-observability.svc.cluster.local:4318/v1/audit"
    # Cache — 5s in-process evaluation cache. The OpenFeature
    # SDK (E1.4 Spring Boot starter) maintains its own 30s
    # cache; server-side cache is intentionally small to keep
    # rollout latency low.
    cache:
      ttlSeconds: 5
      maxEntries: 10000
    # Rate limit — flag evaluation endpoint is rate-limited
    # at 100 req/s per identity (Kong edge rate limit applies
    # globally; this is the per-flag-fetch defense in depth).
    rateLimit:
      flagFetchPerSecond: 100
    # Resources — sized for SaaS / on-prem (2-3 replicas).
    # The dev values file overrides to a single replica +
    # smaller requests.
    resources:
      requests:
        cpu: "200m"
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # Bootstrap Job resources — small, runs once per
    # `helm upgrade`.
    bootstrapResources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Source-of-truth list of ConfigMaps mirrored from
    # `platform/featureflags/`. The chart mounts them into
    # the Deployment + the `featureflags-bootstrap` Helm-hook
    # Job.
    configPaths:
      serverConfig: featureflags/flagsmith-server.yaml
      environments: featureflags/environments.yaml
      flagTaxonomy: featureflags/flag-taxonomy.yaml
      safeDefaults: featureflags/safe-defaults.yaml
      sdkConfig: featureflags/sdk-config.yaml
    # SDK safe-default — guaranteed by the
    # `OpenFeatureAutoConfiguration` in the platform Spring
    # Boot starter. The starter always installs the
    # `NoOpProvider` as a safe default; the Flagsmith provider
    # is wired here (E2.8).
    sdkSafeDefault: true
    # SDK evaluation context — every evaluation is scoped by
    # `tenant_pseudo_id` so a cross-tenant flag read cannot
    # leak. The ABAC layer (E3.4) verifies the pseudo-id
    # against the BFF-issued trusted context.
    pseudonymisation:
      algorithm: sha256
      pepperSecretRef: feature-flag-pseudonym-pepper
    # Resilience — circuit breaker + retry budget + bulkhead
    # to prevent flag-fetch amplification at the mesh layer.
    resilience:
      circuitBreaker:
        failureThreshold: 5
        openDurationSeconds: 30
        halfOpenSuccessThreshold: 2
      retry:
        maxAttempts: 1
        backoffMs: 100
      bulkhead:
        maxConcurrent: 100
        onFull: safe-default
  gitops:
    # E2.9 — Argo CD + Argo Rollouts GitOps + progressive delivery.
    # The chart renders the Argo CD control plane (server +
    # repo-server + application-controller + dex + notifications
    # + redis) + the Argo Rollouts controller when
    # `driver: argocd`. Customers running an external managed
    # controller set `driver: external` and bypass the workload.
    # The five source-of-truth files (`platform/argo/*.yaml`)
    # are mirrored into `files/argo/`. The deep linter
    # (`scripts/lint-argo-config.mjs`) enforces:
    #   - argocd-server.yaml pins `argoproj/argocd:v2.13.4` +
    #     `argoproj/argocd-rollouts:v1.7.2` (ADR-E0.5-01);
    #   - RBAC strict mode + Keycloak OIDC for human auth;
    #   - anonymous access is FORBIDDEN;
    #   - TLS 1.2 minimum;
    #   - drift detection enabled (180s resync);
    #   - AppProject RBAC enforces the four-eyes principle
    #     (developer / config-reviewer / release-approver /
    #     platform-admin);
    #   - promotion pipeline dev → staging → production with
    #     release-approver + MFA gate on production;
    #   - canary strategy wired to 4 AnalysisTemplates
    #     (error-rate / latency-p95 / success-rate / saturation);
    #   - 4 service-class templates (stateless-api / bff /
    #     domain-event-consumer / async-worker);
    #   - sync windows allow dev + staging + production;
    #   - sync windows deny weekend-blackout + change-freeze +
    #     legal-hold + dna-blackout;
    #   - audit fields use `actor_pseudo_id` only (no raw
    #     email / OIDC subject);
    #   - no literal secret / token / password / API key /
    #     private key / ssh-key in any file.
    enabled: true
    # `driver` selects which workload to render:
    #   - `argocd`    → Argo CD control plane (on-prem + dev)
    #   - `external`  → managed (SaaS, customer-managed)
    driver: argocd
    # Rollouts controller — required for canary / blue-green
    # progressive delivery (E2.9 + E13.4).
    rolloutsEnabled: true
    # Merge / config-change / promotion-approval separation
    # enforced via AppProject RBAC + Keycloak OIDC groups.
    rbacStrict: true
    # Image pin — ADR-E0.5-01 baseline (Argo CD 2.13.x).
    # Renovate bumps the patch line per ADR-E0.5-01.
    image:
      repository: argoproj/argocd
      tag: v2.13.4
      registry: quay.io
    # Argo Rollouts controller image — ADR-E0.5-01 baseline
    # (Argo Rollouts 1.7.x).
    rolloutsController:
      repository: argoproj/argocd
      tag: v1.7.2
      registry: quay.io
    # Redis image — ADR-E0.5-01 baseline (Redis 7.2-alpine).
    redis:
      repository: redis
      tag: 7.2-alpine
      registry: public.ecr.aws/docker/library
      persistence:
        size: 10Gi
    # Controller replica counts.
    controller:
      replicas: 3
      server:
        replicas: 2
      repoServer:
        replicas: 2
      applicationController:
        replicas: 3
      sharding:
        enabled: false
        clustersPerShard: 0
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
    # Argo Rollouts controller replica count + resources.
    rollouts:
      replicas: 2
      metrics:
        address: http://prometheus.gp-observability.svc.cluster.local:9090
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
    # RBAC — strict mode + Keycloak OIDC for human auth.
    rbac:
      policyDefault: "role:readonly"
      policyCsvStrict: true
      scopes:
        - "[groups]"
        - "[email]"
    # Auth — anonymous access is FORBIDDEN; Keycloak OIDC SSO
    # for human operators.
    auth:
      anonymousEnabled: false
      disableAdmin: true
      sessionTimeoutMinutes: 60
      sso:
        provider: keycloak
        oidcIssuer: https://keycloak.gp-platform.svc.cluster.local/realms/genealogy
        clientId: argocd
        clientSecretSecretRef: argocd-keycloak-client-secret
    # TLS minimum — TLS 1.2 minimum, TLS 1.3 preferred.
    tls:
      enabled: true
      minVersion: "1.2"
      certManagerIssuer: letsencrypt-prod
    # Audit log — OTel Collector endpoint (E2.10).
    audit:
      enabled: true
      endpoint: "http://otel-collector.gp-observability.svc.cluster.local:4318/v1/audit"
    # Drift detection — resync every 180s; prune + self-heal
    # enabled on production (drift = PR review required).
    driftDetection:
      enabled: true
      resyncSeconds: 180
      prune: true
      selfHeal: true
    # Source-of-truth list of ConfigMaps mirrored from
    # `platform/argo/`. The chart mounts them into the
    # Deployment + the `argocd-bootstrap` Helm-hook Job.
    configPaths:
      serverConfig: argo/argocd-server.yaml
      projects: argo/projects.yaml
      applications: argo/applications.yaml
      rolloutStrategy: argo/rollout-strategy.yaml
      syncWindows: argo/sync-windows.yaml
    # Bootstrap Job resources — small, runs once per
    # `helm upgrade`.
    bootstrapResources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  observability:
    # OTel Collector + Prometheus + Loki + Tempo + Grafana (E2.10).
    # Per `tasks.md` E2.10 + `design.md` §13 + NFR1/NFR3/NFR4
    # the chart renders the observability stack whenever this
    # block is present. The five source-of-truth files
    # (`platform/grafana/*.yaml`) are mirrored into
    # `files/grafana/`. The deep linter
    # (`scripts/lint-grafana-config.mjs`) enforces:
    #   - otel-collector.yaml declares 4 receivers
    #     (otlp-grpc + otlp-http + prometheus + otlp-audit),
    #     9 mandatory processors in the documented order
    #     (memory_limiter / resourcedetection / k8sattributes /
    #     attributes-tenant-pseudonym / transform / redaction /
    #     filter-logs / batch / resource-audit),
    #     5 mandatory exporters (prometheus / loki / tempo /
    #     otlp-audit / debug-dev-only);
    #   - redaction regex covers SSN / passport / driver-license /
    #     email / phone / ipv4 / JWT / raw DNA marker pattern /
    #     Authorization header;
    #   - prometheus.yaml declares 6 scrape jobs (otel-collector /
    #     services / workers / platform / self / audit) + 9
    #     recording rules + 4 SLO burn-rate alerts;
    #   - loki.yaml declares 6 mandatory stream labels
    #     (service.name / service.namespace / deployment.environment
    #     / tenant_pseudo_id / actor_pseudo_id / trace_id) +
    #     4 deny_labels (email / oidc_subject / raw_dna /
    #     raw_pii);
    #   - tempo.yaml declares OTLP receiver + 5 generators +
    #     search_tags allow/deny + retention block_retention;
    #   - dashboards.yaml declares the 9 mandatory dashboards
    #     (api-overview / kong / kafka / temporal / openfga /
    #     istio / vault / database / workload) with template
    #     variables using `tenant_pseudo_id` only;
    #   - grafana.yaml declares Keycloak OIDC SSO + 2FA + audit
    #     fields = `actor_pseudo_id` only;
    #   - resource attributes use `tenant_pseudo_id` /
    #     `user_pseudo_id` / `actor_pseudo_id` — raw
    #     `tenant_id` / `user_id` / `email` / `oidc_subject` /
    #     `raw_dna` / `raw_pii` are FORBIDDEN at every
    #     exporter boundary;
    #   - no literal secret / token / password / api-key /
    #     pepper / jwt in any values file;
    #   - retention ≥ 30 days Prometheus / Loki + ≥ 14 days
    #     Tempo on production.
    enabled: true
    # Image pin — ADR-E0.5-01 baseline.
    otelCollectorConfig:
      image:
        repository: otel/opentelemetry-collector-contrib
        tag: "0.110.0"
        registry: docker.io
      replicas: 2
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
    prometheusConfig:
      image:
        repository: prom/prometheus
        tag: v2.55.0
        registry: docker.io
      replicas: 2
      storage:
        size: 50Gi
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
    lokiConfig:
      image:
        repository: grafana/loki
        tag: 3.4.0
        registry: docker.io
      replicas: 2
      storage:
        size: 50Gi
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
    tempoConfig:
      image:
        repository: grafana/tempo
        tag: 2.7.0
        registry: docker.io
      replicas: 2
      storage:
        size: 50Gi
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
    grafanaConfig:
      image:
        repository: grafana/grafana
        tag: 11.3.0
        registry: docker.io
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # Retention — per-env override in values-{dev,onprem,saas}.yaml.
    retention:
      prometheus: 30d
      loki: 30d
      tempo: 14d
    # Source-of-truth list of ConfigMaps mirrored from
    # `platform/grafana/`. The chart mounts them into the
    # StatefulSets / Deployments.
    configPaths:
      otelCollector: grafana/otel-collector.yaml
      prometheus: grafana/prometheus.yaml
      loki: grafana/loki.yaml
      tempo: grafana/tempo.yaml
      dashboards: grafana/dashboards.yaml
      grafana: grafana/grafana.yaml
    # External Secrets references — NEVER literal credentials.
    secretRefs:
      clusterSecretStore: vault-backend
      grafanaAdminVaultPath: secret/dev/data/grafana/admin
      grafanaKeycloakClientVaultPath: secret/dev/data/keycloak/grafana-client
      otelBearerVaultPath: secret/dev/data/otel-collector/bearertoken

# Backups (Per design §13). The `scripts/check-platform-baseline.mjs`
# helper requires a CronJob manifest in this section for every
# stateful component before marking baseline green.
backups:
  postgres:
    enabled: true
    schedule: "0 2 * * *"
    # Vault / S3 destination references an ExternalSecret (no
    # literal credential).
    destinationRef: backup-postgres
  kafka:
    enabled: true
    schedule: "0 3 * * *"
    destinationRef: backup-kafka
  minio:
    enabled: true
    schedule: "0 4 * * *"
    destinationRef: backup-minio
  vault:
    enabled: true
    schedule: "0 5 * * *"
    destinationRef: backup-vault
