---
# Local docker-compose profile for `platform/local`.
#
# Mirrors the SaaS topology on a developer workstation. The file is
# deliberately small (PostgreSQL, Keycloak, OpenFGA, Kafka single-node,
# Apicurio, Temporal, MinIO, Valkey, Flagsmith and the OTel Collector).
# Heavyweight platform components (Istio mesh, Vault HA, Argo CD)
# live in the umbrella chart and are skipped locally via the dev
# `values-dev.yaml` profile.
#
# Per `agent-execution.md` §4.4 / §5 no secret is committed here —
# `*_PASSWORD` etc. are sourced from `.env.local` which is in
# `.gitignore`.

name: gp-local

networks:
  default:
    name: gp-local-net

services:
  postgres:
    image: postgres:16-alpine
    container_name: gp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genealogy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: genea_shared
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-genealogy} -d genea_shared"
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: gp-keycloak
    # E3.1 — local dev runs the upstream Keycloak 26.x in
    # `start-dev` mode with realm import. The five
    # source-of-truth ConfigMaps (`platform/keycloak/*.yaml`)
    # are mounted into `/opt/keycloak/import/` so the
    # `keycloak-bootstrap` Job (the local equivalent of the
    # Helm hook Job) reads the same files the production
    # chart applies.
    command:
      - "start-dev"
      - "--import-realm"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Disable DB persistence on dev — in-memory store is OK.
      KC_DB: dev-mem
      # Realm import — points at the canonical SaaS shared
      # realm JSON file mounted from
      # `platform/keycloak/realm-export.yaml`. The local
      # stack swaps the SMTP host + dev secret store path so
      # the realm export works without Vault.
      KC_SPI_REALM_PROVIDER_FILE: /opt/keycloak/import/realm-export.yaml
    ports:
      - "8080:8080"
    volumes:
      - ../keycloak/realm-strategy.yaml:/opt/keycloak/import/realm-strategy.yaml:ro
      - ../keycloak/realm-export.yaml:/opt/keycloak/import/realm-export.yaml:ro
      - ../keycloak/client-configs.yaml:/opt/keycloak/import/client-configs.yaml:ro
      - ../keycloak/federation.yaml:/opt/keycloak/import/federation.yaml:ro
      - ../keycloak/key-rotation.yaml:/opt/keycloak/import/key-rotation.yaml:ro
      - ./observability/keycloak-bootstrap.sh:/scripts/bootstrap.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:v1.18.3
    container_name: gp-openfga
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
    ports:
      - "8080:8080"
      - "8081:8081"

  kafka:
    image: quay.io/strimzi/kafka:0.43.0-kafka-3.8.0
    container_name: gp-kafka
    user: "0"
    command: ["sh", "-c", "mkdir -p /tmp/kafka-logs && if [ ! -f /tmp/kafka-logs/meta.properties ]; then /opt/kafka/bin/kafka-storage.sh format -t MkU3OEVBNTcwNTJENDM2Qk -c /opt/kafka/config/kraft/server.properties; fi && exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIR: /tmp/kafka-logs
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/tmp/kafka-logs

  apicurio:
    image: apicurio/apicurio-registry:3.3.1
    container_name: gp-apicurio
    environment:
      REGISTRY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/genea_apicurio
      REGISTRY_DATASOURCE_USERNAME: ${POSTGRES_USER:-genealogy}
      REGISTRY_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: gp-temporal
    environment:
      DB: postgres12
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-genealogy}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      DEFAULT_NAMESPACE: genea-default
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
      # E2.4 search attribute whitelist (mirrors
      # `platform/temporal/search-attrs.yaml`). The auto-setup
      # script accepts a comma-separated list via
      # `TEMPORAL_SEARCH_ATTRIBUTES`; the deep linter enforces
      # the same list at PR time.
      TEMPORAL_SEARCH_ATTRIBUTES: "TenantId=CustomStringField,WorkflowType=CustomKeywordField,TaskQueue=CustomKeywordField,Attempt=CustomIntField,AggregateType=CustomKeywordField,AggregateId=CustomStringField,MediaAssetId=CustomStringField,TransferJobId=CustomStringField,ConsentId=CustomStringField"
    ports:
      - "7233:7233"
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: gp-minio
    # E2.7 — MinIO dev server. The local stack runs MinIO
    # with object lock + CORS allowlist; the `storage-bucket-init`
    # container applies the bucket policy (mirrored from
    # `platform/storage/bucket-policy.yaml`) on first install.
    command:
      - "server"
      - "/data"
      - "--console-address=:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-genealogy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: local
      MINIO_BROWSER: "off"
      MINIO_API_OBJECT_LOCK_API: "on"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - ../storage/s3-config.yaml:/minio/config/s3-config.yaml:ro
      - ../storage/bucket-policy.yaml:/minio/config/bucket-policy.yaml:ro
      - ../storage/compatibility-matrix.yaml:/minio/config/compatibility-matrix.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  storage-bucket-init:
    # E2.7 — applies the bucket policy via `mc` against the
    # local MinIO alias. Idempotent: every `mc` call is
    # skipped if the resource already exists. The Job runs
    # once at `docker compose up` time.
    image: minio/mc:RELEASE.2024-10-13T15-34-59Z
    container_name: gp-storage-bucket-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-genealogy}" "${MINIO_ROOT_PASSWORD}"
        for bucket in media media-quarantine dna-raw import-export; do
          if ! mc ls "local/${bucket}" >/dev/null 2>&1; then
            mc mb "local/${bucket}" --region=local
          fi
          mc version enable "local/${bucket}" || true
        done
        mc retention set --default COMPLIANCE 2555d local/dna-raw || true
        echo "[storage-bucket-init] OK"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-genealogy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

  valkey:
    # E2.7 — Valkey (Redis-compatible) dev server. The
    # local stack runs single replica without TLS. The
    # platform's source-of-truth file
    # (`platform/storage/valkey-config.yaml`) is mounted
    # read-only so the contract test sees the same config
    # the chart applies.
    image: valkey/valkey:7.2-alpine
    container_name: gp-valkey
    command:
      - "valkey-server"
      - "--maxmemory=256mb"
      - "--maxmemory-policy=allkeys-lru"
      - "--appendonly=yes"
      - "--appendfsync=everysec"
      - "--save=300,1"
      - "--slowlog-log-slower-than=10000"
      - "--slowlog-max-len=128"
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
      - ../storage/valkey-config.yaml:/valkey/config/valkey-config.yaml:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  flagsmith:
    image: flagsmith/flagsmith:2.139.4
    container_name: gp-flagsmith
    restart: on-failure
    entrypoint: ["sh", "/app/scripts/run-docker-dev.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-genealogy}:${POSTGRES_PASSWORD}@postgres:5432/genea_flagsmith
      ENV: dev
      DJANGO_ALLOWED_HOSTS: "*"
      # E2.8 — anonymous access is FORBIDDEN.
      ALLOW_ANONYMOUS: "false"
      # E2.8 — CORS allowlist (no wildcard).
      CORS_ALLOWED_ORIGINS: "http://app.genealogy.localhost,http://api.genealogy.localhost,http://public-api.genealogy.localhost"
      # E2.8 — TLS minimum.
      TLS_MIN_VERSION: "tls12"
      # E2.8 — audit log endpoint (OTel Collector).
      AUDIT_LOG_ENDPOINT: "http://otel-collector:4318/v1/audit"
      # E2.8 — pseudonymisation pepper (placeholder; replaced
      # by ESO at runtime in production).
      FEATURE_FLAGS_PSEUDONYM_PEPPER: "REPLACE_ME"
    volumes:
      # E2.8 — mount the 5 source-of-truth files into the
      # container so the OpenFeature SDK can read them via
      # Spring Boot properties. The deep linter
      # (`scripts/lint-flagsmith-config.mjs`) enforces the
      # contract; the byte-identity mirror check rejects drift.
      - ../featureflags/flagsmith-server.yaml:/app/flagsmith-server.yaml:ro
      - ../featureflags/environments.yaml:/app/environments.yaml:ro
      - ../featureflags/flag-taxonomy.yaml:/app/flag-taxonomy.yaml:ro
      - ../featureflags/safe-defaults.yaml:/app/safe-defaults.yaml:ro
      - ../featureflags/sdk-config.yaml:/app/sdk-config.yaml:ro
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy

  featureflags-bootstrap:
    image: flagsmith/flagsmith:2.139.4
    container_name: gp-featureflags-bootstrap
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    environment:
      FLAGSMITH_BASE_URL: "http://flagsmith:8000"
      FLAGSMITH_ORG_TOKEN: "REPLACE_ME"
    volumes:
      - ../featureflags:/source:ro
      - ./featureflags/bootstrap.sh:/scripts/bootstrap.sh:ro
    depends_on:
      flagsmith:
        condition: service_started

  # Argo CD + Argo Rollouts (E2.9) — local dev profile.
  # The local stack runs the upstream `argoproj/argocd` server
  # + repo-server + application-controller + redis alongside
  # the `argoproj/argocd-rollouts` controller. The
  # `argocd-bootstrap` service applies the five source-of-truth
  # files on first install (idempotent).
  argocd-server:
    image: argoproj/argocd:v2.13.4
    container_name: gp-argocd-server
    command:
      - /usr/local/bin/argocd-server
      - --redis
      - argocd-redis:6379
      - --disable-admin
    environment:
      ARGOCD_RBAC_POLICY_DEFAULT: "role:readonly"
      ARGOCD_SERVER_INSECURE: "false"
      ARGOCD_CONTROLLER_REPLICAS: "1"
    ports:
      - "8080:8080"     # admin UI (dev only)
    depends_on:
      argocd-redis:
        condition: service_started
  argocd-repo-server:
    image: argoproj/argocd:v2.13.4
    container_name: gp-argocd-repo-server
    command:
      - /usr/local/bin/argocd-repo-server
      - --redis
      - argocd-redis:6379
    ports:
      - "8081:8081"
    depends_on:
      argocd-redis:
        condition: service_started
  argocd-application-controller:
    image: argoproj/argocd:v2.13.4
    container_name: gp-argocd-application-controller
    command:
      - /usr/local/bin/argocd-application-controller
      - --redis
      - argocd-redis:6379
      - --resync-seconds
      - "60"
    depends_on:
      argocd-redis:
        condition: service_started
  argocd-redis:
    image: public.ecr.aws/docker/library/redis:7.2-alpine
    container_name: gp-argocd-redis
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    ports:
      - "6379:6379"
  argo-rollouts-controller:
    image: argoproj/argocd-rollouts:v1.7.2
    container_name: gp-argo-rollouts-controller
    command:
      - --namespaced
      - --loglevel
      - info
    environment:
      ROLLOUTS_PROMETHEUS_ADDRESS: "http://prometheus:9090"
    depends_on:
      prometheus:
        condition: service_started
  argocd-bootstrap:
    image: argoproj/argocd:v2.13.4
    container_name: gp-argocd-bootstrap
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        echo "[argocd-bootstrap] applying AppProject + Application + Rollout strategy + sync windows"
        for f in projects applications rollout-strategy sync-windows; do
          curl -s -X POST "http://argocd-server:8080/api/v1/${f}/apply" || true
        done
        echo "[argocd-bootstrap] done"
    volumes:
      - ../argo:/source:ro
    depends_on:
      argocd-server:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: gp-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../grafana/otel-collector.yaml:/etc/otelcol-contrib/source.yaml:ro
    environment:
      # The container-side `/etc/otelcol-contrib/config.yaml`
      # is rendered by the bootstrap Job; for the local
      # docker-compose stack we mount the source-of-truth
      # directly via a wrapper entrypoint.
      OTEL_CONFIG_FILE: /etc/otelcol-contrib/source.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "4319:4319"
      - "9464:9464"
      - "13133:13133"

  prometheus:
    # E2.10 — local Prometheus pinned to ADR-E0.5-01 baseline
    # (v2.55.0). Mounts the 6 source-of-truth ConfigMaps +
    # 9 recording rules / 4 SLO alerts.
    image: prom/prometheus:v2.55.0
    container_name: gp-prometheus
    command:
      - "--config.file=/etc/prometheus/config/config.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ../grafana/prometheus.yaml:/etc/prometheus/config/config.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started

  loki:
    # E2.10 — local Loki pinned to ADR-E0.5-01 baseline (3.4.0).
    # Single-node mode; retention 7d; boltdb-shipper store.
    image: grafana/loki:3.4.0
    container_name: gp-loki
    command: ["-config.file=/etc/loki/config/config.yaml"]
    user: "0"
    volumes:
      - ../grafana/loki.yaml:/etc/loki/config/config.yaml:ro
      - loki-data:/var/loki
    ports:
      - "3100:3100"

  tempo:
    # E2.10 — local Tempo pinned to ADR-E0.5-01 baseline
    # (2.7.0). Single-node mode; retention 3d; local
    # filesystem block store.
    image: grafana/tempo:2.7.0
    container_name: gp-tempo
    command:
      - "-config.file=/etc/tempo/config/config.yaml"
      - "-storage.trace.block.retention=72h"
    user: "0"
    volumes:
      - ../grafana/tempo.yaml:/etc/tempo/config/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    # E2.10 — local Grafana pinned to ADR-E0.5-01 baseline
    # (11.3.0). Mounts the dashboard catalogue + server
    # config; Keycloak SSO bypassed for dev (admin mode
    # only).
    image: grafana/grafana:11.3.0
    container_name: gp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-genealogy}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_KEYCLOAK_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/grafana.yaml:/etc/grafana/grafana.ini:ro
      - ../grafana/dashboards.yaml:/etc/grafana/dashboards/catalogue.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  grafana-bootstrap:
    # E2.10 — one-shot bootstrap that verifies all 6
    # source-of-truth files are byte-identical between
    # `platform/grafana/` and `platform/helm/.../files/grafana/`.
    image: grafana/grafana:11.3.0
    container_name: gp-grafana-bootstrap
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    environment:
      SOURCE_DIR: /source
      MIRROR_DIR: /mirror
    volumes:
      - ./observability/grafana-bootstrap.sh:/scripts/bootstrap.sh:ro
      - ../grafana:/source:ro
      - ../../platform/helm/genealogy-platform/files/grafana:/mirror:ro

  keycloak-bootstrap:
    # E3.1 — one-shot bootstrap that verifies all 5
    # source-of-truth files are byte-identical between
    # `platform/keycloak/` and
    # `platform/helm/.../files/keycloak/` and that the
    # realm export declares the canonical SaaS shared realm.
    image: alpine:3.20
    container_name: gp-keycloak-bootstrap
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    environment:
      SOURCE_DIR: /source
      MIRROR_DIR: /mirror
    volumes:
      - ./observability/keycloak-bootstrap.sh:/scripts/bootstrap.sh:ro
      - ../keycloak:/source:ro
      - ../../platform/helm/genealogy-platform/files/keycloak:/mirror:ro
    depends_on:
      - keycloak

  kong:
    image: kong:3.8.0
    container_name: gp-kong
    command: ["bash", "-c", "kong start && kong tail -F"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_PROXY_LISTEN_SSL: "0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8444 ssl"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_PLUGINS: "bundled,correlation-id,cors,request-size-limiting,rate-limiting,ip-restriction,jwt,prometheus"
      KONG_LOG_LEVEL: notice
      KONG_LOG_FORMAT: json
      KONG_NGINX_HTTP2: "on"
      KONG_SSL_CIPHER_SUITE: modern
      KONG_SSL_MIN_PROTOCOLS: "tlsv1.3"
    volumes:
      - ../kong/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"     # proxy HTTP (for smoke tests only; SaaS uses CDN in front)
      - "8443:8443"     # proxy TLS
      - "8100:8100"     # status / health
    healthcheck:
      test: ["CMD-SHELL", "kong health --all 2>/dev/null || curl -fsS http://127.0.0.1:8100/status | grep -q '\"database\":{}'"]
      interval: 10s
      timeout: 5s
      retries: 10

  vault:
    # E2.6 — Vault dev server. The local stack runs Vault in
    # `dev` mode with auto-unseal; the production / staging
    # chart renders the same image with the `awskms` or
    # `transit` seal. The four source-of-truth ConfigMaps
    # (`platform/vault/*.yaml`) are mounted into `/vault/config`
    # so the smoke + contract tests exercise the same files
    # the umbrella chart applies.
    image: hashicorp/vault:1.17.1
    container_name: gp-vault
    command: ["server", "-dev", "-dev-root-token-id=genealogy-dev-root-token", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: genealogy-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
      VAULT_LOCAL_CONFIG: |
        ui = true
        disable_mlock = true
        default_lease_ttl_duration = "30m"
        max_lease_ttl_duration = "24h"
        telemetry {
          prometheus {
            is_enabled = true
            retain_for = "24h"
          }
        }
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"     # Vault API (dev mode only; production uses 8200 + 8201)
    volumes:
      - ../vault/server-config.yaml:/vault/config/server-config.yaml:ro
      - ../vault/auth-methods.yaml:/vault/config/auth-methods.yaml:ro
      - ../vault/policies.yaml:/vault/config/policies.yaml:ro
      - ../vault/kms-abstraction.yaml:/vault/config/kms-abstraction.yaml:ro
      - ../vault/injector-templates.yaml:/vault/config/injector-templates.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8200/v1/sys/health?standbyok=true || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
  valkey-data:
  kafka-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
