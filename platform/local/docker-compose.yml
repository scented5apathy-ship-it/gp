---
# Local docker-compose profile for `platform/local`.
#
# Mirrors the SaaS topology on a developer workstation. The file is
# deliberately small (PostgreSQL, Keycloak, OpenFGA, Kafka single-node,
# Apicurio, Temporal, MinIO, Valkey, Flagsmith and the OTel Collector).
# Heavyweight platform components (Istio mesh, Vault HA, Argo CD)
# live in the umbrella chart and are skipped locally via the dev
# `values-dev.yaml` profile.
#
# Per `agent-execution.md` §4.4 / §5 no secret is committed here —
# `*_PASSWORD` etc. are sourced from `.env.local` which is in
# `.gitignore`.

name: gp-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: gp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genealogy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: genea_shared
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-genealogy} -d genea_shared"
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: gp-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:1.10
    container_name: gp-openfga
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
    ports:
      - "8080:8080"
      - "8081:8081"

  kafka:
    image: quay.io/strimzi/kafka:0.43.0-kafka-3.8.0
    container_name: gp-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"

  apicurio:
    image: apicurio/apicurio-registry:2.6
    container_name: gp-apicurio
    environment:
      REGISTRY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/genea_apicurio
      REGISTRY_DATASOURCE_USERNAME: ${POSTGRES_USER:-genealogy}
      REGISTRY_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: gp-temporal
    environment:
      DB: postgresql
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: "5432"
      DB_POSTGRES_USER: ${POSTGRES_USER:-genealogy}
      DB_POSTGRES_PWD: ${POSTGRES_PASSWORD}
      DB_POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: genea-default
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
    ports:
      - "7233:7233"
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: gp-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-genealogy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: gp-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  flagsmith:
    image: flagsmith/flagsmith:latest
    container_name: gp-flagsmith
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-genealogy}:${POSTGRES_PASSWORD}@postgres:5432/genea_flagsmith
      ENV: dev
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: gp-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres-data:
  minio-data:
