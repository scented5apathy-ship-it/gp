# Local-development profiles for `platform/local`.
#
# These files describe the local profile that `scripts/local-up.sh`
# brings up on a developer workstation (Docker Desktop / OrbStack /
# colima / k3d). The `docker-compose.yml` in this directory is the
# minimal stack the contract tests (E1.2) need; the umbrella chart
# (`platform/helm/genealogy-platform`) drives the full topology in
# `kind` for integration testing.
#
# Per `design.md` §3.1 / §13 the local profile mirrors SaaS topology
# so cloud/on-prem parity holds during development.

# PostgreSQL — schema-per-service via Flyway init scripts.
postgres:
  image: postgres:16-alpine
  version: "16"
  port: 5432
  databases:
    - genea_shared
    - genea_tenant
    - genea_genealogy
    - genea_research
    - genea_collaboration
    - genea_media
    - genea_search
    - genea_importexport
    - genea_dna
    - genea_notification
    - genea_reporting
    - genea_audit
  rls:
    enabled: true
    seed: scripts/seed-rls.sql
  extensions:
    - pgcrypto
    - citext
    - pg_stat_statements
    - btree_gin

# Keycloak — realm export + test identities.
keycloak:
  image: quay.io/keycloak/keycloak:26.0
  port: 8080
  realmExport: keycloak/keycloak-realm-genealogy-dev.json
  adminUser: admin
  # Password injected from `.env.local` (NEVER committed).
  adminPasswordEnv: KEYCLOAK_ADMIN_PASSWORD
  tls:
    enabled: false

# OpenFGA — relationship model + initial store.
openfga:
  image: openfga/openfga:1.10
  port: 8080
  grpcPort: 8081
  datastore:
    engine: memory
    # Production swaps to postgres; local uses in-memory for
    # deterministic contract tests.
  model: openfga/openfga-model-draft.yaml

# Strimzi Kafka single-node + Apicurio Registry.
kafka:
  image: quay.io/strimzi/kafka:0.45.2-kafka-3.8.0
  port: 9092
  kraft: true                  # KRaft mode (no ZooKeeper), E2.3
  replicationFactor: 1
  minInSyncReplicas: 1
  # Local profile mirrors the canonical topic list from
  # `platform/kafka/topics.yaml` so contract tests can use the same
  # names. The chart-side list is the source of truth; this profile
  # is a documentation hint for `scripts/local-up.sh`.
  topics:
    - name: genealogy.person.v1.v1
      topicClass: domain-event
      partitions: 3
      retentionMs: 2592000000
    - name: genealogy.tree.v1.v1
      topicClass: domain-event
      partitions: 3
      retentionMs: 2592000000
    - name: genealogy.relationship.v1.v1
      topicClass: domain-event
      partitions: 3
      retentionMs: 2592000000
    - name: genealogy.media.v1.v1
      topicClass: domain-event
      partitions: 3
      retentionMs: 2592000000
    - name: genealogy.research.v1.v1
      topicClass: domain-event
      partitions: 3
      retentionMs: 2592000000
    - name: genealogy.collaboration.v1.v1
      topicClass: domain-event
      partitions: 3
      retentionMs: 2592000000
    - name: genealogy.notification.v1.v1
      topicClass: domain-event
      partitions: 3
      retentionMs: 2592000000
    - name: genealogy.search.rebuild.v1.v1
      topicClass: projection-rebuild
      partitions: 3
      retentionMs: 604800000
    - name: genealogy.public.rebuild.v1.v1
      topicClass: projection-rebuild
      partitions: 3
      retentionMs: 604800000
    - name: genealogy.audit.v1.v1
      topicClass: audit
      partitions: 3
      retentionMs: 31536000000
    - name: genealogy.dlq.v1.v1
      topicClass: dlq
      partitions: 3
      retentionMs: 1209600000
apicurio:
  image: apicurio/apicurio-registry:2.6
  port: 8080
  defaultCompatibility: BACKWARD
  artifacts:
    - group: genea-person-v1
      artifact: genea-person-v1
      type: AVRO
      compatibility: BACKWARD
    - group: genea-tree-v1
      artifact: genea-tree-v1
      type: AVRO
      compatibility: BACKWARD
    - group: genea-relationship-v1
      artifact: genea-relationship-v1
      type: AVRO
      compatibility: BACKWARD
    - group: genea-media-v1
      artifact: genea-media-v1
      type: AVRO
      compatibility: BACKWARD
    - group: genea-research-v1
      artifact: genea-research-v1
      type: AVRO
      compatibility: BACKWARD
    - group: genea-collaboration-v1
      artifact: genea-collaboration-v1
      type: AVRO
      compatibility: BACKWARD
    - group: genea-notification-v1
      artifact: genea-notification-v1
      type: AVRO
      compatibility: BACKWARD
    - group: genea-search-rebuild-v1
      artifact: genea-search-rebuild-v1
      type: AVRO
      compatibility: FORWARD
    - group: genea-public-rebuild-v1
      artifact: genea-public-rebuild-v1
      type: AVRO
      compatibility: FULL
    - group: genea-audit-v1
      artifact: genea-audit-v1
      type: AVRO
      compatibility: BACKWARD
    - group: genea-dlq-v1
      artifact: genea-dlq-v1
      type: AVRO
      compatibility: BACKWARD

# Temporal dev server + namespace (E2.4).
temporal:
  image: temporalio/auto-setup:1.26.2
  adminToolsImage: temporalio/admin-tools:1.26.2
  port: 7233
  uiPort: 8088
  namespace: genea-default
  retentionDays: 7
  # Local profile mirrors the canonical namespace list from
  # `platform/temporal/namespace-config.yaml` so contract tests can
  # use the same names. The chart-side list is the source of truth;
  # this profile is a documentation hint for `scripts/local-up.sh`.
  namespaces:
    - name: genea-default
      retentionDays: 7
    - name: genea-genealogy
      retentionDays: 7
    - name: genea-media
      retentionDays: 7
    - name: genea-search
      retentionDays: 7
    - name: genea-interop
      retentionDays: 7
    - name: genea-notify
      retentionDays: 7
    - name: genea-reporting
      retentionDays: 7
    - name: genea-dna
      retentionDays: 365
  # Local profile mirrors the canonical task-queue list from
  # `platform/temporal/task-queues.yaml`.
  taskQueues:
    - genea-genealogy-main
    - genea-genealogy-outbox
    - genea-media-scan
    - genea-media-derive
    - genea-search-rebuild
    - genea-interop-transfer
    - genea-notify-dispatch
    - genea-reporting-gen
    - genea-dna-match
    - genea-dna-revoke
  # Search attribute whitelist (ADR-E0.5-07 §privacy) — opaque IDs
  # only. The auto-setup image accepts these as env vars.
  searchAttributes:
    - name: TenantId
      type: CustomStringField
    - name: WorkflowType
      type: CustomKeywordField
    - name: TaskQueue
      type: CustomKeywordField
    - name: Attempt
      type: CustomIntField
    - name: AggregateType
      type: CustomKeywordField
    - name: AggregateId
      type: CustomStringField
    - name: MediaAssetId
      type: CustomStringField
    - name: TransferJobId
      type: CustomStringField
    - name: ConsentId
      type: CustomStringField

# MinIO + bucket layout.
#
# Per `tasks.md` E2.7 + `design.md` §11 + §13 the local
# profile runs MinIO (the on-prem + dev path). The bucket
# policy + lifecycle + CORS + object lock posture is
# declared in `platform/storage/bucket-policy.yaml`; the
# `storage-bucket-init` Job applies it via `mc` at first
# install. The deep linter
# (`scripts/lint-s3-config.mjs`) enforces the contract.
minio:
  image: minio/minio:RELEASE.2024-10-13T13-34-11Z
  # MC client image — same pin as `components.storage.mcImage`
  # in `values.yaml` (E2.7 bootstrap Job).
  mcImage: minio/mc:RELEASE.2024-10-13T15-34-59Z
  apiPort: 9000
  consolePort: 9001
  # Region — local cluster always uses `local`. The chart
  # never inlines a literal AWS region.
  region: local
  # CORS — dev allows the localhost origin only. Wildcard
  # is forbidden per `privacy-and-legal-gate.md` §11.
  corsAllowedOrigins:
    - http://app.genealogy.localhost
    - http://api.genealogy.localhost
  # Object lock — enabled. The `dna-raw` bucket is set to
  # compliance mode with 7-year retention.
  objectLock: enabled
  # Audit — every PutObject / DeleteObject / GetObject is
  # logged to the OTel Collector (E2.10).
  audit: enabled
  buckets:
    - name: media
      versioning: enabled
      lifecycleDays: 365
    - name: media-quarantine
      versioning: enabled
      lifecycleDays: 30
    - name: dna-raw
      versioning: enabled
      lifecycleDays: 0 # indefinite (legal hold semantics)
      encryption: envelope
    - name: import-export
      versioning: enabled
      lifecycleDays: 30
  rootUserEnv: MINIO_ROOT_USER
  rootPasswordEnv: MINIO_ROOT_PASSWORD

# Valkey (Redis-compatible) cache / session / rate state.
#
# Per `tasks.md` E2.7 + `design.md` §3 + §13 Valkey carries
# the cache / session / rate-state substrate. The deep
# linter (`scripts/lint-s3-config.mjs`) enforces the per-class
# TTL ceiling + the per-user ACL allowlist.
valkey:
  image: valkey/valkey:7.2-alpine
  port: 6379
  # Single replica on dev (no Sentinel HA).
  replicas: 1
  # Persistence — AOF + RDB. Cache is fail-safe, not
  # source-of-truth.
  persistence:
    aof: true
    aofFsync: everysec
    rdbSnapshotMinutes: 5
  # Memory limit + eviction policy.
  maxmemory: 256Mi
  maxmemoryPolicy: allkeys-lru
  # ACL — per-user allowlist. The linter rejects `@admin`
  # for service users (operator only).
  aclRequired: true
  # TTLs per cache class (matches
  # `platform/storage/valkey-config.yaml.ttl`).
  ttl:
    sessionSeconds: 3600
    sessionSecondsCeiling: 7200
    rateStateSeconds: 60
    rateStateSecondsCeiling: 300
    cacheSeconds: 300
    cacheSecondsCeiling: 1800
    permissionDecisionSeconds: 30
    permissionDecisionSecondsCeiling: 60
    abacRedactionSeconds: 30
    abacRedactionSecondsCeiling: 60
  # Sentinel — disabled on dev (1 replica).
  sentinel:
    enabled: false

# Flagsmith local container.
flagsmith:
  image: flagsmith/flagsmith:latest
  apiPort: 8000
  uiPort: 8080
  sdkSafeDefault: true

# Observability — OTel Collector + Grafana + Prometheus + Loki + Tempo.
observability:
  otelCollector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    port: 4317
    portHttp: 4318
  grafana:
    image: grafana/grafana:11.3.0
    port: 3000
    dashboards: ../observability/grafana/dashboards
  prometheus:
    image: prom/prometheus:v2.55.0
    port: 9090
  loki:
    image: grafana/loki:3.3.2
    port: 3100
  tempo:
    image: grafana/tempo:2.6.0
    port: 3200

# Kong Gateway (E2.2) — DB-less, declarative config. The same
# `kong.yml` is reused by the umbrella Helm chart; the local stack
# mounts it at `/etc/kong/kong.yml`.
kong:
  image: kong:3.8.0
  edition: oss
  database: off
  declarativeConfig: /etc/kong/kong.yml
  proxyPort: 8000
  proxyTlsPort: 8443
  statusPort: 8100
  enabledPlugins:
    - correlation-id
    - cors
    - request-size-limiting
    - rate-limiting
    - ip-restriction
    - jwt
    - prometheus

# Istio service mesh (E2.5) — local dev profile.
# The local stack DOES NOT run `istiod` (the heavy control plane).
# The four source-of-truth files (`platform/istio/*.yaml`) are
# rendered by the umbrella chart on the integration kind cluster;
# locally, `scripts/local-up.sh` exercises the same files via
# `kubectl apply` against a single-node kind cluster. The profile
# below documents the pin + the bootstrap Job image so the
# integration tests have a single source of truth.
istio:
  # Image pin — ADR-E0.5-01 baseline (Istio 1.23.x). The
  # umbrella chart renders the `istio-operator` subchart on
  # staging / production; the local profile documents the same
  # pin so `scripts/local-up.sh` brings up the control plane on
  # kind with the same version.
  version: "1.23"
  # Bootstrap Job image — same pin as `components.istio.kubectlImage`
  # in `values.yaml` (E2.5 §4).
  kubectlImage: bitnami/kubectl:1.31.1
  # Trust domain — `cluster.local` for the local kind cluster.
  trustDomain: cluster.local
  # MeshConfig posture — must match the source-of-truth in
  # `platform/istio/mesh-config.yaml`. The linter enforces this
  # so the local profile cannot drift.
  mesh:
    mtls: STRICT
    outboundPolicy: REGISTRY_ONLY
    inboundPolicy: MUTUAL_TLS
    retryBudget: null

# Vault + cloud KMS abstraction (E2.6) — local dev profile.
# The local stack runs the upstream `hashicorp/vault` server
# in `dev` mode with auto-unseal + the four source-of-truth
# ConfigMaps. The `vault-bootstrap` Helm-hook Job is rendered
# by the umbrella chart; on dev it no-ops (the dev server is
# already unsealed via `VAULT_DEV_ROOT_TOKEN_ID`).
#
# Cloud KMS is NOT exercised locally — the SaaS values file
# declares `awskms` + an IRSA-backed key ARN. On dev the
# `seal.type: shamir` override means the Vault server
# never touches the cloud KMS endpoint.
vault:
  # Image pin — ADR-E0.5-01 baseline (Vault 1.17.x).
  image: hashicorp/vault:1.17.1
  # Vault Agent Injector image — same upstream pin as
  # `components.vault.injectorImage` in `values.yaml`.
  injectorImage: hashicorp/vault-k8s:1.5.0
  # Dev profile always uses Shamir seal.
  seal:
    type: shamir
  # Dev-mode auto-unseal token (NEVER use in production).
  devRootTokenId: genealogy-dev-root-token
  # Dev-mode listener port (8200 + cluster 8201).
  apiPort: 8200
  clusterPort: 8201
  # Dev profile mounts the source-of-truth ConfigMaps via
  # the docker-compose volume below.
  configPath: /vault/config/config.hcl
  # KMS abstraction — dev always uses Vault transit (no cloud
  # KMS in dev). The bootstrap Job no-ops the awskms seal
  # block.
  kmsAbstraction:
    activeProvider: vault-transit

