# Source-of-truth Vault policy (ACL) list — E2.6.
#
# Per `tasks.md` E2.6 every Vault secret read/write MUST be
# authorised by a Vault policy declared here. The file declares:
#   1. The default policy (`default`) — deny-all; workloads that
#      forget to bind a policy get no access.
#   2. Per-component policies (`services-read-secrets`,
#      `bff-read-secrets`, `workers-read-secrets`,
#      `data-read-secrets`, `data-rotate-secrets`,
#      `observability-read-secrets`,
#      `ci-read-secrets`, `ci-write-deploy-markers`).
#   3. The root policy (`root`) — reserved for the bootstrap Job
#      that configures the auth methods on first install. The
#      bootstrap Job is short-lived (pre-install,pre-upgrade hook
#      with `helm.sh/hook-delete-policy: before-hook-creation,
#      hook-succeeded`).
#
# The deep linter (`scripts/lint-vault-config.mjs`) enforces:
#   - the `default` policy is deny-all (root = false;
#     no capabilities);
#   - the per-component policies are path-scoped to the
#     documented KV v2 mount (`secret/data/<scope>/...`);
#   - `ci-read-secrets` is read-only;
#   - no policy grants `root` capabilities;
#   - no policy references paths outside `secret/` (KV v2
#     only; database / transit / ssh are not exposed via
#     policies).
apiVersion: v1
kind: ConfigMap
metadata:
  name: genea-vault-policies
  namespace: gp-data
  labels:
    app.kubernetes.io/part-of: genealogy-platform
    app.kubernetes.io/component: vault
    app.kubernetes.io/version: "1.17"
    gp.genealogy/contract-only: "true"
data:
  config.yaml: |
    # Vault policy list — E2.6 §3.
    policies:
      # ----------------------------------------------------------------
      # Default policy — deny everything. Workloads that bind
      # this policy get NO secret access. The platform never
      # auto-binds default; it's the safety net.
      # ----------------------------------------------------------------
      - name: default
        body: |
          # Default policy — deny all (E2.6 §3.1).
          # Path-scoped to nothing. A workload bound to this
          # policy cannot read, list, or write any secret.
          path "*" {
            capabilities = ["deny"]
          }

      # ----------------------------------------------------------------
      # services-read-secrets — domain services (genealogy,
      # tenant, research, ...) read their DB credentials +
      # Keycloak admin URL + outbound webhook secret from the
      # `secret/data/services/<service-name>/*` path. Read-only.
      # ----------------------------------------------------------------
      - name: services-read-secrets
        body: |
          # services-read-secrets — E2.6 §3.2.
          # Read access to per-service secret payload only. Write
          # access is reserved for the bootstrap + rotation Jobs.
          path "secret/data/services/{{identity.entity.aliases.auth_kubernetes_4a3d.accessor.metadata.service_account_name}}/*" {
            capabilities = ["read"]
          }
          path "secret/metadata/services/{{identity.entity.aliases.auth_kubernetes_4a3d.accessor.metadata.service_account_name}}/*" {
            capabilities = ["list"]
          }
          # Token self-renew is allowed (the Vault Agent calls
          # `auth/token/renew-self` periodically).
          path "auth/token/renew-self" {
            capabilities = ["update"]
          }
          path "auth/token/lookup-self" {
            capabilities = ["read"]
          }

      # ----------------------------------------------------------------
      # bff-read-secrets — web-bff + public-api read session
      # cookie signing keys + Keycloak admin client secret +
      # outbound email provider key.
      # ----------------------------------------------------------------
      - name: bff-read-secrets
        body: |
          # bff-read-secrets — E2.6 §3.3.
          path "secret/data/bff/*" {
            capabilities = ["read"]
          }
          path "secret/metadata/bff/*" {
            capabilities = ["list"]
          }
          path "auth/token/renew-self" {
            capabilities = ["update"]
          }
          path "auth/token/lookup-self" {
            capabilities = ["read"]
          }

      # ----------------------------------------------------------------
      # workers-read-secrets — async workers (media-worker,
      # search-indexer, dna-worker, import-export-worker) read
      # their DB credentials + storage credentials.
      # ----------------------------------------------------------------
      - name: workers-read-secrets
        body: |
          # workers-read-secrets — E2.6 §3.4.
          path "secret/data/workers/*" {
            capabilities = ["read"]
          }
          path "secret/metadata/workers/*" {
            capabilities = ["list"]
          }
          path "auth/token/renew-self" {
            capabilities = ["update"]
          }
          path "auth/token/lookup-self" {
            capabilities = ["read"]
          }

      # ----------------------------------------------------------------
      # data-read-secrets — Postgres / Kafka / MinIO operators
      # read their credentials. The StatefulSet for each
      # component mounts the secret via the Vault Agent
      # Injector.
      # ----------------------------------------------------------------
      - name: data-read-secrets
        body: |
          # data-read-secrets — E2.6 §3.5.
          path "secret/data/data/*" {
            capabilities = ["read"]
          }
          path "secret/metadata/data/*" {
            capabilities = ["list"]
          }
          path "auth/token/renew-self" {
            capabilities = ["update"]
          }
          path "auth/token/lookup-self" {
            capabilities = ["read"]
          }

      # ----------------------------------------------------------------
      # data-rotate-secrets — privileged: the bootstrap /
      # rotation Jobs that actually `vault write` the dynamic
      # DB credentials. Bound to a dedicated `vault-bootstrap`
      # SA in `gp-data`.
      # ----------------------------------------------------------------
      - name: data-rotate-secrets
        body: |
          # data-rotate-secrets — E2.6 §3.6.
          # Write access to per-DB dynamic credential paths.
          # Path-scoped so the rotation Job cannot touch
          # unrelated secrets.
          path "secret/data/data/*" {
            capabilities = ["read", "create", "update"]
          }
          path "secret/metadata/data/*" {
            capabilities = ["read", "list"]
          }
          path "database/creds/*" {
            capabilities = ["read"]
          }
          path "auth/token/renew-self" {
            capabilities = ["update"]
          }
          path "auth/token/lookup-self" {
            capabilities = ["read"]
          }

      # ----------------------------------------------------------------
      # observability-read-secrets — OTel Collector +
      # Prometheus + Grafana read their storage + Tempo +
      # Loki credentials.
      # ----------------------------------------------------------------
      - name: observability-read-secrets
        body: |
          # observability-read-secrets — E2.6 §3.7.
          path "secret/data/observability/*" {
            capabilities = ["read"]
          }
          path "secret/metadata/observability/*" {
            capabilities = ["list"]
          }
          path "auth/token/renew-self" {
            capabilities = ["update"]
          }
          path "auth/token/lookup-self" {
            capabilities = ["read"]
          }

      # ----------------------------------------------------------------
      # ci-read-secrets — GitHub Actions runner reads the
      # image-pull secret + Cosign signing key.
      # ----------------------------------------------------------------
      - name: ci-read-secrets
        body: |
          # ci-read-secrets — E2.6 §3.8.
          path "secret/data/ci/*" {
            capabilities = ["read"]
          }
          path "secret/metadata/ci/*" {
            capabilities = ["list"]
          }
          path "auth/token/renew-self" {
            capabilities = ["update"]
          }
          path "auth/token/lookup-self" {
            capabilities = ["read"]
          }

      # ----------------------------------------------------------------
      # ci-write-deploy-markers — CI runner writes the
      # Helm release marker so Argo Rollouts can detect a new
      # build. Path-scoped, no other write access.
      # ----------------------------------------------------------------
      - name: ci-write-deploy-markers
        body: |
          # ci-write-deploy-markers — E2.6 §3.9.
          path "secret/data/ci/deploy-markers/*" {
            capabilities = ["read", "create", "update"]
          }
          path "secret/metadata/ci/deploy-markers/*" {
            capabilities = ["read", "list"]
          }

    # ----------------------------------------------------------------
    # Forbidden capabilities — the linter rejects any policy that:
    #   - grants `root` (root token = unsealed storage = critical);
    #   - references paths outside `secret/` (KV v2 only);
    #   - grants `sudo` to non-root policies.
    # ----------------------------------------------------------------
    forbiddenCapabilities:
      - root
      - sudo
    forbiddenPathPrefixes:
      - "auth/token/"
      - "sys/"
      - "database/"
      - "transit/"
      - "ssh/"
