# Trivy secret-scanner companion config. The primary secret scanner is
# Gitleaks (security/gitleaks.toml); Trivy runs as a second pass during
# the image scan to catch anything that landed in a built artefact.

severity:
  - HIGH
  - CRITICAL

# The list of detectors Trivy should run. We disable the noisy default
# detectors that overlap with Gitleaks.
enable:
  - AWS
  - Azure
  - GCP
  - GitHub
  - Slack
  - Stripe
  - Telegram
  - PrivateKey
  - Keyword

disable:
  - Generic
