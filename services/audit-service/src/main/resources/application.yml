spring:
  application:
    name: audit-service
  main:
    banner-mode: log
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/audit_service}
    username: ${SPRING_DATASOURCE_USERNAME:audit_service}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: audit-service-pool
      register-mbeans: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: audit_service
    create-schemas: true
  jooq:
    sql-dialect: POSTGRES
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/genealogy-shared}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  compression:
    enabled: true
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 5s

platform:
  tenant:
    header-required: true
    max-id-length: 64
  security:
    require-bearer-token: true
  audit:
    enabled: true
    metric-name: "platform.audit.events"
  openfeature:
    provider: "noop"
    cache-ttl-millis: 30000
  shutdown:
    timeout-seconds: 30
  otel:
    service-name: audit-service
    exporter-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
    always-sample: false

spring.lifecycle.timeout-per-shutdown-phase: 30s

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      service: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
    enable-keep-alive: true
    keep-alive-time: 30s
    keep-alive-timeout: 10s
    permit-keep-alive-without-calls: true
    permit-keep-alive-time: 60s
    reflection-service-enabled: true

audit:
  ingest:
    enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${AUDIT_TOPIC:gp.audit.events.v1}
    consumer-group: ${AUDIT_GROUP:audit-service}
  retention:
    sweep-cron: "0 0 2 * * *"
    batch-size: 1000
  integrity:
    verification-cron: "0 0 3 * * *"
    on-tamper: ABORT_AND_ALERT

logging:
  level:
    root: INFO
    com.genealogy: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{tenant_id:-},%X{correlation_id:-}] %logger{36} - %msg%n"
