---
spring:
  application:
    name: research-service
  main:
    banner-mode: log
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/research_service}
    username: ${SPRING_DATASOURCE_USERNAME:research_service}
    # Datasource password is supplied by the runtime secret
    # manager (Vault / cloud KMS) per `design.md` §12; the env
    # var is empty by default so a missing secret fails the
    # startup instead of silently using a placeholder.
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: research-service-pool
      register-mbeans: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: research_service
    create-schemas: true
  jooq:
    sql-dialect: POSTGRES
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/genealogy-shared}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  compression:
    enabled: true
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 5s

# E1.4 template defaults — every value below is the safe production
# default. Operators override only the bits that must change per
# environment (datasource URL, Keycloak issuer, OTel endpoint).
platform:
  tenant:
    header-required: true
    max-id-length: 64
  security:
    require-bearer-token: true
  audit:
    enabled: true
    metric-name: "platform.audit.events"
  openfeature:
    provider: "noop"
    cache-ttl-millis: 30000
  shutdown:
    timeout-seconds: 30
  otel:
    service-name: research-service
    exporter-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
    always-sample: false

# Spring Boot graceful shutdown — give in-flight requests 30 s before
# SIGTERM-driven shutdown becomes a hard kill. Matches
# `platform.shutdown.timeout-seconds`.
spring.lifecycle.timeout-per-shutdown-phase: 30s

# Probes — readiness fails when the JDBC connection is unreachable.
# Liveness only fails when the JVM is dead.
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      service: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${management.otlp.metrics.export.url:http://localhost:4318/v1/metrics}
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
    logs:
      export:
        enabled: false

logging:
  level:
    root: INFO
    com.genealogy: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{tenant_id:-},%X{correlation_id:-}] %logger{36} - %msg%n"
